<script type="module">
/* ════════════════════════════════════════════════════════════════
   盘古 3D 预览层
   单文件 / 零构建 / 零外部资源（除 three 从 CDN 动态加载）
   ════════════════════════════════════════════════════════════════ */

const WORLD = (() => {
  try { return JSON.parse(document.getElementById('pangu-world').textContent); }
  catch (e) { return {}; }
})();

const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const num = (v, d = 0) => (typeof v === 'number' && isFinite(v)) ? v : d;

/* ── 数据抽取（全部容错，缺字段不抛错） ───────────────────────── */
const META = WORLD.meta || {};
const COS  = WORLD.cosmology || {};
const IS_STARS = (COS.stars || []).filter(s => s && typeof s === 'object');
const IS_BODIES = (COS.bodies || []).filter(b => b && typeof b === 'object');

function starColor(s) {
  if (s.color) return s.color;
  const t = num(s.temp_k, 5800);
  if (t < 3700) return '#ff8f5e';
  if (t < 5200) return '#ffc98a';
  if (t < 6000) return '#fff4e2';
  if (t < 7500) return '#eef3ff';
  return '#cfe0ff';
}
const visRadius = b => {
  if (num(b.visual_radius, 0) > 0) return num(b.visual_radius);
  const re = num(b.radius_earth, 0) || (num(b.radius_km, 0) / 6371) || 1;
  return clamp(1.0 + 1.5 * Math.log10(re + 1), 0.6, 6);
};
const visStarRadius = s => clamp(1.4 * Math.pow(num(s.radius_solar, 1), 0.7), 0.8, 4);

const ORBIT_SCALE = 26;

/* ── 标头填充 ───────────────────────────────────────────────── */
$('w-name').textContent = META.name || '未命名世界';
$('w-sub').textContent  = META.subtitle || '';
$('w-tag').textContent  = META.tagline || '';

/* ════════════════════════════════════════════════════════════════
   1.1 · 地面视角：站在地表抬头
   方位角/高度角用球面三角真算，影子方向 = 恒星方位 + 180°
   ════════════════════════════════════════════════════════════════ */
const SURF = (() => {
  const cvs = $('surface-canvas');
  const hint = $('surface-hint');
  const ctx = cvs.getContext('2d');
  const S = COS.surface || {};
  const OBS = (S.observer && typeof S.observer === 'object') ? S.observer : null;
  const CAL = COS.calendar || {};
  const DAY_H = num(CAL.day_hours, 24) || 24;
  const MONTH_D = num(CAL.month_days, 30) || 30;
  const MAIN = IS_BODIES[0] || {};
  const TILT = num(MAIN.axial_tilt_deg, 0);
  // 只取内层双星：外层伴星躲得远，不该和主双星叠在同一方位
  const STARS = (() => {
    const orb = IS_STARS.filter(s => num(s.orbit && s.orbit.a_au, 0) > 0)
      .sort((a, b) => num(a.orbit.a_au, 0) - num(b.orbit.a_au, 0));
    if (orb.length >= 2) {
      const a0 = num(orb[0].orbit.a_au, 0);
      const inner = orb.filter(s => num(s.orbit.a_au, 0) <= a0 * 3);
      return inner.length >= 2 ? inner.slice(0, 2) : orb.slice(0, 2);
    }
    return IS_STARS.slice(0, 2);
  })();
  const GROUND = S.ground_color || '#2a3a4a';

  const sepAu = (() => {
    const orb = STARS.filter(s => num(s.orbit && s.orbit.a_au, 0) > 0);
    if (orb.length < 2) return 0;
    return num(orb[0].orbit.a_au, 0) + num(orb[1].orbit.a_au, 0);
  })();
  const planetA = num(MAIN.orbit && MAIN.orbit.a_au, 1) || 1;
  const rawSep = sepAu > 0 ? (sepAu / planetA) * 180 / Math.PI : 0;
  const SEP_DEG = rawSep > 0 ? clamp(rawSep * 1.9, 10, 70) : 0;

  let W = 0, H = 0, dpr = 1;
  let tHours = 0, playing = true, yearSpin = false, yearPhase = 0;
  let raf = 0, started = false, last = 0;

  const rad = d => d * Math.PI / 180;
  const deg = r => r * 180 / Math.PI;
  const FOV = rad(240);          // 超广角：太阳与影子相差 180°，还要各自容下两星的夹角
  let viewAz = 0;                // 可拖动转头
  const horizonY = () => H * 0.57;

  function mix(a, b, k) {
    return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k]
      .map(v => Math.round(v));
  }
  const rgb = c => `rgb(${c[0]},${c[1]},${c[2]})`;

  // 时角由行星自转决定。双星相距极近，从行星看两者时角基本一致——
  // 它们的分离体现在方位差（SEP_DEG），而不是反相 180°（那会变成一颗升另一颗落）。
  const PHASE0 = num(STARS[0] && STARS[0].orbit && STARS[0].orbit.phase_deg, 0);

  function hourAngle() {
    return (tHours / DAY_H) * Math.PI * 2 + rad(PHASE0);
  }
  function altOf(star) {
    const lat = rad(num(OBS && OBS.lat_deg, 0));
    const dec = rad(num(star.orbit && star.orbit.inclination_deg, 0) + TILT * Math.sin(yearPhase));
    const Hh = hourAngle();
    const s = Math.sin(lat) * Math.sin(dec) + Math.cos(lat) * Math.cos(dec) * Math.cos(Hh);
    return Math.asin(clamp(s, -1, 1));
  }
  function azOf(star) {
    const lat = rad(num(OBS && OBS.lat_deg, 0));
    const dec = rad(num(star.orbit && star.orbit.inclination_deg, 0) + TILT * Math.sin(yearPhase));
    const Hh = hourAngle();
    return Math.atan2(-Math.cos(dec) * Math.sin(Hh),
      Math.sin(dec) * Math.cos(lat) - Math.cos(dec) * Math.sin(lat) * Math.cos(Hh));
  }

  function positions() {
    const list = STARS.map(s => ({ s, alt: altOf(s), az: azOf(s) }));
    if (list.length >= 2 && SEP_DEG > 0) {
      // 双星互绕：一「月」走完一轮，两星方位差 = 角距，正午附近合拢
      const ph = (tHours / (MONTH_D * 24)) % 1;
      const dir = Math.cos(ph * Math.PI * 2);
      const base = list[0].az, half = rad(SEP_DEG) / 2;
      list[0].az = base + half * dir;
      list[1].az = base - half * dir;
    }
    return list;
  }

  function project(az, alt) {
    let d = az - viewAz;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    const hz = horizonY();
    return {
      x: W / 2 + (d / (FOV / 2)) * (W / 2),
      y: hz - (alt / (Math.PI / 2)) * hz,
      vis: Math.abs(d) < FOV / 2,
    };
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = cvs.clientWidth || window.innerWidth;
    H = cvs.clientHeight || (window.innerHeight - 76);
    cvs.width = Math.round(W * dpr); cvs.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function drawShadow(az, alt, color, blur) {
    if (alt <= rad(1.2)) return;
    let d = az + Math.PI - viewAz;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    const sx = W / 2 + (d / (FOV / 2)) * (W / 2);
    const len = clamp(H * 0.5 / Math.tan(Math.max(alt, rad(1.2))), 24, H * 2.2);
    ctx.save();
    ctx.globalAlpha = 0.82;
    if (blur) ctx.filter = `blur(${blur}px)`;
    ctx.beginPath();
    ctx.moveTo(W / 2 - 30, H);
    ctx.lineTo(W / 2 + 30, H);
    ctx.lineTo(sx + 18, H - len);
    ctx.lineTo(sx - 18, H - len);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
    ctx.restore();
  }

  function draw() {
    if (!W || !H) resize();
    const pos = positions();
    const maxAlt = Math.max(-1, ...pos.map(p => p.alt));
    const dayF = clamp(deg(maxAlt) / 32, 0, 1);
    const hz = horizonY();

    // 天空
    const g = ctx.createLinearGradient(0, 0, 0, hz);
    g.addColorStop(0, rgb(mix([5, 7, 16], [46, 68, 104], dayF)));
    g.addColorStop(0.72, rgb(mix([10, 13, 26], [126, 118, 118], dayF)));
    g.addColorStop(1, rgb(mix([18, 20, 30], [206, 150, 104], dayF)));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, hz);

    // 星点（天亮了就隐去）
    if (dayF < 0.85) {
      ctx.save();
      ctx.globalAlpha = (1 - dayF) * 0.85;
      for (let i = 0; i < 160; i++) {
        const x = ((i * 733) % 997) / 997 * W;
        const y = ((i * 419) % 613) / 613 * hz * 0.94;
        const r = 0.4 + ((i * 37) % 11) / 22;
        ctx.fillStyle = i % 7 === 0 ? '#ffd9a0' : '#cfe0ff';
        ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
      }
      ctx.restore();
    }

    // 地面
    const gc = GROUND.replace('#', '');
    const gr = parseInt(gc.slice(0, 2), 16) || 42;
    const gg = parseInt(gc.slice(2, 4), 16) || 58;
    const gb = parseInt(gc.slice(4, 6), 16) || 74;
    const gd = ctx.createLinearGradient(0, hz, 0, H);
    gd.addColorStop(0, rgb([gr + 14, gg + 16, gb + 18]));
    gd.addColorStop(1, rgb([gr - 10, gg - 12, gb - 12]));
    ctx.fillStyle = gd;
    ctx.fillRect(0, hz, W, H - hz);

    // 地平线
    ctx.strokeStyle = 'rgba(255,220,180,.28)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, hz); ctx.lineTo(W, hz); ctx.stroke();

    // 两道影子（先画，太阳盖在上面）
    pos.forEach((p, i) => {
      if (p.alt <= 0) return;
      const col = i === 0 ? 'rgba(3,5,9,.88)' : 'rgba(24,14,6,.72)';
      drawShadow(p.az, p.alt, col, i === 0 ? 0 : 5);
    });

    // 两颗太阳（vis 属于投影结果，不在原始点上）
    pos.forEach((p, i) => {
      if (p.alt < -rad(3)) return;
      const q = project(p.az, p.alt);
      const c = starColor(p.s);
      if (!q.vis) {
        // 出框了：在边缘留一个方位指示，别让太阳凭空消失
        let d = p.az - viewAz;
        while (d > Math.PI) d -= Math.PI * 2;
        while (d < -Math.PI) d += Math.PI * 2;
        const ex = d < 0 ? 16 : W - 16;
        const ey = clamp(q.y, 46, horizonY() - 8);
        ctx.save();
        ctx.globalAlpha = 0.8;
        ctx.fillStyle = c;
        ctx.beginPath(); ctx.arc(ex, ey, 6, 0, 6.2832); ctx.fill();
        ctx.globalAlpha = 0.32;
        ctx.beginPath(); ctx.arc(ex, ey, 15, 0, 6.2832); ctx.fill();
        ctx.restore();
        return;
      }
      const r = 16 + 10 * clamp(num(p.s.luminosity_solar, 1), 0.2, 3) / 3;
      const halo = ctx.createRadialGradient(q.x, q.y, 0, q.x, q.y, r * 4.2);
      halo.addColorStop(0, c);
      halo.addColorStop(0.18, c + 'aa');
      halo.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = halo;
      ctx.beginPath(); ctx.arc(q.x, q.y, r * 4.2, 0, 6.2832); ctx.fill();
      ctx.fillStyle = '#fffdf6';
      ctx.beginPath(); ctx.arc(q.x, q.y, r * 0.62, 0, 6.2832); ctx.fill();
    });

    // 观测者脚下的标记
    ctx.strokeStyle = 'rgba(255,255,255,.25)';
    ctx.beginPath();
    ctx.moveTo(W / 2 - 12, H - 8); ctx.lineTo(W / 2 + 12, H - 8);
    ctx.stroke();

    // 提示
    const names = pos.map((p, i) => `${p.s.name || ('恒星' + i)} ${deg(p.alt).toFixed(0)}°`).join(' · ');
    const ang = SEP_DEG > 0 ? (SEP_DEG * Math.abs(Math.cos((tHours / (MONTH_D * 24)) * Math.PI * 2))).toFixed(0) : '0';
    hint.innerHTML =
      `观察点 <b>${num(OBS && OBS.lat_deg, 0)}°</b> · 海拔 ${num(OBS && OBS.elev_m, 0)} m` +
      `　｜　一天 <b>${DAY_H}</b> 小时` +
      `<br>${names}` +
      `<br>两影夹角 <b>${ang}°</b>${SEP_DEG ? '' : '（单星世界，只有一道影）'}` +
      `<br><span style="opacity:.6">拖动画面可转头</span>`;
  }

  function loop(now) {
    const dt = Math.min((now - last) / 1000, 0.1);
    last = now;
    if (playing) tHours = (tHours + dt * (yearSpin ? 6 : 1.2)) % (yearSpin ? MONTH_D * 24 : DAY_H);
    if (yearSpin) yearPhase += dt * 0.9;
    const slider = $('sf-time');
    if (slider && !slider.dataset.drag) slider.value = String(Math.round((tHours % DAY_H) / DAY_H * 1000));
    $('sf-clock').textContent = `${Math.floor(tHours % DAY_H)}h / ${DAY_H}h`;
    draw();
    raf = requestAnimationFrame(loop);
  }

  function open() {
    if (!STARS.length) {
      UI.hideOverlays();
      $('surface-view').classList.add('show');
      cvs.getContext('2d');
      ctx.clearRect(0, 0, W, H);
      hint.innerHTML = '<span class="warn">这个世界的 cosmology.stars 为空，没有可观测的恒星。</span>';
      UI.mark('v-surface');
      return;
    }
    LIFE.close();
    if (CREATURE) CREATURE.close();
    $('surface-view').classList.add('show');
    UI.mark('v-surface');
    resize();
    if (!started) {
      started = true;
      $('sf-play').onclick = () => {
        playing = !playing;
        $('sf-play').textContent = playing ? '运行' : '暂停';
        $('sf-play').classList.toggle('on', playing);
      };
      $('sf-year').onclick = () => {
        yearSpin = !yearSpin;
        $('sf-year').classList.toggle('on', yearSpin);
      };
      const sl = $('sf-time');
      sl.addEventListener('input', () => {
        sl.dataset.drag = '1';
        tHours = (num(sl.value, 0) / 1000) * DAY_H;
        draw();
      });
      sl.addEventListener('change', () => { delete sl.dataset.drag; });
      // 默认视角：背对双星 100°，双日退到左缘、双影在右侧铺开，一屏同时可见
      const p0 = positions();
      if (p0.length) viewAz = p0[0].az + rad(100);
      let dragX = null;
      cvs.addEventListener('pointerdown', e => {
        dragX = e.clientX;
        try { cvs.setPointerCapture(e.pointerId); } catch (_) { }
      });
      cvs.addEventListener('pointermove', e => {
        if (dragX === null) return;
        viewAz -= (e.clientX - dragX) * 0.005;
        dragX = e.clientX;
        draw();
      });
      cvs.addEventListener('pointerup', () => { dragX = null; });
      cvs.addEventListener('pointercancel', () => { dragX = null; });
    }
    if (!raf) { last = performance.now(); raf = requestAnimationFrame(loop); }
  }

  function close() {
    $('surface-view').classList.remove('show');
    if (raf) { cancelAnimationFrame(raf); raf = 0; started = false; }
  }

  window.addEventListener('resize', () => { if ($('surface-view').classList.contains('show')) resize(); });

  return { open, close };
})();

/* ════════════════════════════════════════════════════════════════
   1.1 · 演化视图：2D 生态相 / 数据 / 环境状态监测
   与 Python 端同规则同参数同 seed —— 允许逐格不同，密度差 >5% 算 bug
   ════════════════════════════════════════════════════════════════ */
const LIFE = (() => {
  const EVO = (WORLD.biology && WORLD.biology.evolution) || null;
  const gcv = $('life-grid'), gctx = gcv.getContext('2d');
  const ccv = $('life-chart'), cctx = ccv.getContext('2d');
  const probe = $('life-probe');

  let prog = null, cells = null, rnd = null, rngSeed = 7;
  let step = 0, playing = true, speedIdx = 0, started = false, raf = 0, acc = 0, last = 0;
  const SPEEDS = [1, 2, 4, 8];
  let hist = [];          // [{dens:{id:v}, forcing:{id:v}}]
  let snapshots = [];     // 关键步存档用于 2D 显示

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function countOk(expr, v) {
    if (typeof expr === 'number') return v === expr;
    const s = String(expr || '').trim();
    let m = s.match(/^(\d+)\s*\.\.\s*(\d+)$/);
    if (m) return v >= +m[1] && v <= +m[2];
    m = s.match(/^(>=|<=|==|>|<)\s*(\d+)$/);
    if (m) {
      const k = +m[2];
      return { '>=': v >= k, '<=': v <= k, '==': v === k, '>': v > k, '<': v < k }[m[1]];
    }
    if (/^\d+$/.test(s)) return v === +s;
    return false;
  }

  // world.json 里写的是 neighbors.of（状态名），运行期要换成 of_index；
  // 漏了这一步，所有带邻居条件的规则都会静默失效。
  function normalizeWhen(w, byId) {
    if (!w || typeof w !== 'object') return null;
    const out = {};
    Object.keys(w).forEach(k => {
      const v = w[k];
      if (k === 'neighbors' && v && typeof v === 'object') {
        const nb = Object.assign({}, v);
        if (nb.of !== undefined && byId[nb.of] !== undefined) nb.of_index = byId[nb.of];
        out.neighbors = nb;
      } else if ((k === 'all_of' || k === 'any_of' || k === 'none_of') && Array.isArray(v)) {
        out[k] = v.map(x => normalizeWhen(x, byId)).filter(Boolean);
      } else if (k === 'forcing_above' || k === 'forcing_below') {
        out[k] = Object.assign({}, v);
      }
    });
    return out;
  }

  function whenOk(w, cnt, fv) {
    if (!w) return true;
    if (w.all_of && !w.all_of.every(x => whenOk(x, cnt, fv))) return false;
    if (w.any_of && !w.any_of.some(x => whenOk(x, cnt, fv))) return false;
    if (w.none_of && w.none_of.some(x => whenOk(x, cnt, fv))) return false;
    const nb = w.neighbors;
    if (nb && typeof nb === 'object') {
      const k = (nb.of_index !== undefined) ? nb.of_index : -1;
      if (!countOk(nb.count === undefined ? '>=1' : nb.count, cnt[k] || 0)) return false;
    }
    const fa = w.forcing_above;
    if (fa && (fv[fa.id] || 0) < num(fa.value, 0)) return false;
    const fb = w.forcing_below;
    if (fb && (fv[fb.id] || 0) > num(fb.value, 0)) return false;
    return true;
  }

  function forcingAt(e, tHours) {
    const out = {};
    (e.forcing || []).forEach(f => {
      const p = num(f.period_days, 0);
      if (p <= 0) { out[f.id] = num(f.amp, 1); return; }
      let ph = (tHours / (p * 24) + num(f.phase_deg, 0) / 360) % 1;
      if (ph < 0) ph += 1;
      out[f.id] = f.kind === 'pulse'
        ? (ph >= 0.93 ? num(f.amp, 1) : 0)
        : num(f.amp, 1) * (0.5 - 0.5 * Math.cos(2 * Math.PI * ph));
    });
    return out;
  }

  function build() {
    const e = EVO;
    const g = e.grid || {};
    const nx = Math.max(4, Math.min(512, num(g.nx, 120)));
    const ny = Math.max(4, Math.min(512, num(g.ny, 90)));
    const states = (e.states || []).map((s, i) => ({
      id: s.id, name: s.name || s.id, kind: s.kind || 'other',
      color: s.color || '#888', idx: i,
      share: Math.max(0, num(s.initial_share, 0)),
    }));
    const byId = {};
    states.forEach(s => byId[s.id] = s.idx);

    // initial 覆盖
    if (e.initial && typeof e.initial === 'object') {
      Object.keys(e.initial).forEach(k => {
        if (byId[k] !== undefined) states[byId[k]].share = Math.max(0, num(e.initial[k], 0));
      });
    }
    const tot = states.reduce((a, s) => a + s.share, 0) || 1;

    const rules = (e.rules || []).map(r => ({
      id: r.id, src: byId[r.from], dst: byId[r.to],
      prob: clamp(num(r.prob, 0), 0, 1),
      when: normalizeWhen(r.when, byId),
      forcing: r.forcing || '',
      gain: num(r.forcing_gain, 0),
      cost: (r.cost && typeof r.cost === 'object') ? num(r.cost.value, 0) : num(r.cost, 0),
    })).filter(r => r.src !== undefined && r.dst !== undefined);

    const bySrc = {};
    rules.forEach(r => (bySrc[r.src] = bySrc[r.src] || []).push(r));
    Object.keys(bySrc).forEach(k => bySrc[k].sort((a, b) =>
      (a.when ? 1 : 0) - (b.when ? 1 : 0) || b.prob - a.prob));

    let radius = 1;
    rules.forEach(r => {
      const nb = r.when && r.when.neighbors;
      if (nb) radius = Math.max(radius, num(nb.radius, 1));
    });
    radius = clamp(radius, 1, 2);

    prog = {
      nx, ny, states, byId, rules, bySrc, radius,
      hps: num(e.clock && e.clock.hours_per_step, 0.5) || 0.5,
      forcing: e.forcing || [],
      shape: 'moore',
    };
    // 统一用 moore（radius 1）
    return prog;
  }

  function reset() {
    if (!prog) build();
    rngSeed = num(EVO.seed, 7);
    rnd = mulberry32(rngSeed * 2654435761 >>> 0);
    const { nx, ny, states } = prog;
    const n = nx * ny;
    cells = new Uint8Array(n);
    const cuts = [];
    let a = 0;
    const tot = states.reduce((s, x) => s + x.share, 0) || 1;
    states.forEach(s => { a += s.share / tot; cuts.push([a, s.idx]); });
    for (let i = 0; i < n; i++) {
      const u = rnd();
      let put = cuts.length ? cuts[cuts.length - 1][1] : 0;
      for (const [c, idx] of cuts) { if (u <= c) { put = idx; break; } }
      cells[i] = put;
    }
    step = 0; hist = []; snapshots = [];
    record();
    drawAll();
  }

  function record() {
    const { nx, ny, states, hps, forcing } = prog;
    const n = nx * ny;
    const cnt = new Array(states.length).fill(0);
    for (let i = 0; i < n; i++) cnt[cells[i]] = (cnt[cells[i]] || 0) + 1;
    const dens = {};
    states.forEach((s, i) => dens[s.id] = cnt[i] / n);
    hist.push({ dens, fv: forcingAt({ forcing }, step * hps) });
    if (hist.length > 1200) hist.shift();
    if (step % 40 === 0 || step === 1) snapshots.push(Array.from(cells));
    if (snapshots.length > 6) snapshots.shift();
  }

  const offsets = (() => {
    const o = [];
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++)
      if (dx || dy) o.push([dx, dy]);
    return o;
  })();

  function advance() {
    const { nx, ny, bySrc, states, hps, forcing } = prog;
    const n = nx * ny;
    const cur = cells, nxt = new Uint8Array(cur);   // 同步更新：先拷贝
    const fv = forcingAt({ forcing }, step * hps);
    const ns = states.length;
    const cnt = new Array(ns + 1).fill(0);

    for (let y = 0; y < ny; y++) {
      const rowBase = y * nx;
      for (let x = 0; x < nx; x++) {
        const i = rowBase + x;
        const s = cur[i];
        const rs = bySrc[s];
        if (!rs) continue;
        let haveCnt = false;
        for (let k = 0; k < rs.length; k++) {
          const r = rs[k];
          if (r.when) {
            if (!haveCnt) {
              cnt.fill(0);
              for (const [dx, dy] of offsets) {
                let xx = x + dx, yy = y + dy;
                if (xx < 0) xx += nx; else if (xx >= nx) xx -= nx;   // 经度闭合
                if (yy < 0 || yy >= ny) continue;
                cnt[cur[yy * nx + xx]]++;
              }
              haveCnt = true;
            }
            if (!whenOk(r.when, cnt, fv)) continue;
          }
          let p = r.prob;
          if (r.forcing) p *= r.gain ? Math.pow(fv[r.forcing] || 0, r.gain) : (fv[r.forcing] || 1);
          if (p >= 1 || rnd() < p) { nxt[i] = r.dst; break; }
        }
      }
    }
    cells = nxt;
    step++;
    record();
  }

  /* ── 绘制 ── */
  function drawGrid() {
    const { nx, ny, states } = prog;
    gcv.width = nx; gcv.height = ny;
    const img = gctx.createImageData(nx, ny);
    const pal = states.map(s => {
      const h = String(s.color).replace('#', '');
      return [parseInt(h.slice(0, 2), 16) || 128,
              parseInt(h.slice(2, 4), 16) || 128,
              parseInt(h.slice(4, 6), 16) || 128];
    });
    for (let i = 0; i < nx * ny; i++) {
      const c = pal[cells[i]] || [128, 128, 128];
      img.data[i * 4] = c[0]; img.data[i * 4 + 1] = c[1];
      img.data[i * 4 + 2] = c[2]; img.data[i * 4 + 3] = 255;
    }
    gctx.putImageData(img, 0, 0);
  }

  function drawChart() {
    const w = ccv.clientWidth || 300, h = ccv.clientHeight || 200;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    ccv.width = w * dpr; ccv.height = h * dpr;
    const g = cctx;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, w, h);
    if (!hist.length) return;

    // 滚动窗口：只画最近 320 步，否则上千步的强迫虚线会糊成一片
    const view = hist.slice(-320);
    const pad = 26;
    const W2 = w - pad - 8, H2 = h - pad - 12;
    g.strokeStyle = 'rgba(140,170,210,.16)';
    g.lineWidth = 1;
    for (let i = 0; i <= 4; i++) {
      const y = 10 + H2 * i / 4;
      g.beginPath(); g.moveTo(pad, y); g.lineTo(pad + W2, y); g.stroke();
    }

    const cols = ['#7a4a8c', '#2f6f9e', '#c9a227', '#b5651d', '#8b1a1a', '#dcd7c9', '#1a1a1a', '#3b3a40'];
    prog.states.forEach((s, si) => {
      g.beginPath();
      view.forEach((pt, i) => {
        const x = pad + W2 * (view.length <= 1 ? 0 : i / (view.length - 1));
        const y = 10 + H2 * (1 - clamp(pt.dens[s.id] || 0, 0, 1));
        i ? g.lineTo(x, y) : g.moveTo(x, y);
      });
      g.strokeStyle = s.color || cols[si % cols.length];
      g.lineWidth = 1.4;
      g.stroke();
    });

    // 强迫项：只画总辐照类，虚线
    const f0 = (prog.forcing || [])[0];
    if (f0) {
      g.beginPath();
      view.forEach((pt, i) => {
        const x = pad + W2 * (view.length <= 1 ? 0 : i / (view.length - 1));
        // 强迫项压到图底 26% 的窄带里，别盖住密度曲线
        const y = 10 + H2 - H2 * 0.26 * clamp(pt.fv[f0.id] || 0, 0, 1);
        i ? g.lineTo(x, y) : g.moveTo(x, y);
      });
      g.strokeStyle = 'rgba(255,207,138,.5)';
      g.setLineDash([3, 3]);
      g.lineWidth = 1;
      g.stroke();
      g.setLineDash([]);
    }

    g.fillStyle = 'rgba(140,170,210,.65)';
    g.font = '9px sans-serif';
    g.fillText('1.0', 3, 14);
    g.fillText('0.0', 3, 10 + H2);
    g.fillText(`步 ${hist.length}`, pad, h - 4);
  }

  function drawProbe() {
    const { states } = prog;
    const last = hist[hist.length - 1] || { dens: {}, fv: {} };
    const n = prog.nx * prog.ny;
    const primary = states.find(s => s.kind === 'producer') || states[0];

    const sum = k => states.filter(s => s.kind === k)
      .reduce((a, s) => a + (last.dens[s.id] || 0), 0);

    const f0 = (prog.forcing || [])[0];
    const fv = f0 ? (last.fv[f0.id] || 0) : 0;
    const rows = [
      ['已跑步数', `${step}`],
      ['网格', `${prog.nx}×${prog.ny} = ${n}`],
      ['主状态', `${primary.name} ${(last.dens[primary.id] || 0).toFixed(3)}`],
      ['生产者合计', sum('producer').toFixed(3)],
      ['消费者合计', sum('consumer').toFixed(3)],
      ['裸地/基质', sum('substrate').toFixed(3)],
      ['灾变相', sum('hazard').toFixed(3)],
    ];
    if (f0) rows.push([`${f0.name || f0.id}`, fv.toFixed(2)]);

    const stable = num(EVO.summary && EVO.summary.steady_density, 0);
    const targetSteps = num(EVO.summary && EVO.summary.measured_at_step, 0);
    const now = last.dens[primary.id] || 0;
    // 还没跑到对账步数就比稳态，没有意义——必须先收敛再对账
    const converged = !targetSteps || step >= targetSteps * 0.75;
    // 8% 而非 5%：Python 用 Mersenne Twister，这里用 mulberry32，
    // 逐格轨迹必然不同，密度只剩统计涨落。超过 8% 才是规则对齐出了问题。
    const DRIFT_TOL = 0.08;
    const drift = (converged && stable > 0) ? Math.abs(now - stable) / stable : 0;
    const first = hist[0] ? (hist[0].dens[primary.id] || 0) : 0;
    const collapse = first > 0.02 && now < first * 0.2;

    let html = rows.map(([k, v]) =>
      `<div class="probe-row"><span>${k}</span><b>${v}</b></div>`).join('');
    html += `<div class="probe-row ${!converged ? '' : (drift > DRIFT_TOL ? 'bad' : 'good')}">` +
            `<span>与 summary 偏差</span>` +
            `<b>${!converged ? `收敛中 (${step}/${targetSteps})` : (drift * 100).toFixed(1) + '%'}</b></div>`;
    html += `<div class="probe-row ${collapse ? 'bad' : 'good'}">` +
            `<span>塌缩预警</span><b>${collapse ? '已跌破' : '正常'}</b></div>`;

    html += `<div class="probe-flag">`;
    if (!converged) {
      html += `还差 ${Math.max(0, targetSteps - step)} 步到达对账点（world.json 记的是第 ${targetSteps} 步）。` +
              `生态需要时间才能显出稳态，现在比没有意义。<br>`;
    } else if (drift > DRIFT_TOL) {
      html += `浏览器实跑与 world.json 的 summary 差 ${(drift * 100).toFixed(1)}%，超过 8% —— 规则可能没对齐。<br>`;
    }
    if (collapse) html += `主状态已跌到初值两成以下：这个世界的生态正在崩。<br>`;
    if (converged && drift <= DRIFT_TOL && !collapse) {
      html += `生态稳定。与 Python 端实跑相差 ${(drift * 100).toFixed(1)}%，` +
              `属跨语言 PRNG 的统计涨落（逐格轨迹不同是正常的）。<br>`;
    }

    // 状态图例
    html += `<div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:5px">` +
      states.map(s => `<span style="font-size:10px;color:var(--ink-dim)">` +
        `<i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${s.color};margin-right:4px"></i>` +
        `${s.name}</span>`).join('') + `</div>`;

    probe.innerHTML = html;
  }

  function drawAll() {
    if (!prog) return;
    drawGrid();
    drawChart();
    drawProbe();
    $('lf-clock').textContent = `第 ${step} 步`;
  }

  function loop(now) {
    const dt = Math.min((now - last) / 1000, 0.1);
    last = now;
    if (playing) {
      acc += dt * SPEEDS[speedIdx];
      let budget = 8;                    // 每帧最多 8 步，防卡死
      while (acc >= 1 / 45 && budget-- > 0) { advance(); acc -= 1 / 45; }
      drawAll();
    }
    raf = requestAnimationFrame(loop);
  }

  function open() {
    if (!EVO || !EVO.rules || !EVO.rules.length) {
      UI.hideOverlays();
      $('life-view').classList.add('show');
      probe.innerHTML = `<div class="probe-flag">这个世界的 biology.evolution 为空。<br>` +
        `先声明 states / rules / forcing，再用 <code>pangu.py ca</code> 编译。</div>`;
      UI.mark('v-life');
      return;
    }
    SURF.close();
    if (CREATURE) CREATURE.close();
    $('life-view').classList.add('show');
    UI.mark('v-life');
    if (!started) {
      started = true;
      $('lf-play').onclick = () => {
        playing = !playing;
        $('lf-play').textContent = playing ? '运行' : '暂停';
        $('lf-play').classList.toggle('on', playing);
      };
      $('lf-step').onclick = () => { playing = false; $('lf-play').textContent = '暂停'; advance(); drawAll(); };
      $('lf-reset').onclick = () => { reset(); drawAll(); };
      $('lf-spd').onclick = () => {
        speedIdx = (speedIdx + 1) % SPEEDS.length;
        $('lf-spd').textContent = SPEEDS[speedIdx] + '×';
      };
      build();
      reset();
    }
    if (!raf) { last = performance.now(); raf = requestAnimationFrame(loop); }
  }

  function close() {
    $('life-view').classList.remove('show');
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
  }

  window.addEventListener('resize', () => {
    if ($('life-view').classList.contains('show') && prog) drawAll();
  });

  return { open, close };
})();

/* ════════════════════════════════════════════════════════════════
   1.1.2 · 生物视角：寄宿一个物种，用它的眼睛走一段
   低多边形（Minecraft / 罪恶都市那一档）：方块躯干、四条腿、
   尾部两节、眼睛是两块自发光小方块。地形从 planet_map.coarse
   的 72×36 高程场双线性放大，海平面按海域格子的最高高程解出。
   ════════════════════════════════════════════════════════════════ */
let CREATURE = null;

function makeCreature(THREE) {
  const view = $('creature-view');
  const cvs = $('creature-canvas');
  const hint = $('cr-hint');
  const readout = $('cr-read');
  const sel = $('cr-species');

  const BIO = (WORLD.biology && typeof WORLD.biology === 'object') ? WORLD.biology : {};
  const BIC = (BIO.biochemistry && typeof BIO.biochemistry === 'object') ? BIO.biochemistry : {};
  const CHEM = (WORLD.chemistry && typeof WORLD.chemistry === 'object') ? WORLD.chemistry : {};
  const COMP = (CHEM.composition && typeof CHEM.composition === 'object') ? CHEM.composition : {};
  const ELS = (CHEM.fictional_elements || []).filter(e => e && typeof e === 'object');
  const ORGS = (BIO.organisms || []).filter(o => o && typeof o === 'object');
  const BODY = IS_BODIES[0] || {};
  const PM = (BODY.planet_map && typeof BODY.planet_map === 'object') ? BODY.planet_map : {};
  const COARSE = (PM.coarse && typeof PM.coarse === 'object') ? PM.coarse : {};
  const BIOMES = (BODY.biomes || []).filter(b => b && typeof b === 'object');

  const DEFAULT_ORG = {
    id: 'observer', name: '无名观察者', role: '未定义物种', playable: true,
    height_m: 1.7, length_m: 1.7, mass_kg: 70,
    body: { legs: 2, arms: 2, tail_segments: 0, head_scale: 1, torso: [0.8, 1.0, 0.6], stride: 0.9 },
    palette: ['#8a7a64', '#2b2320', '#e8dcc8'],
    locomotion: { speed_ms: 3.2, sprint_ms: 5.6, jump_m: 0.9 },
    senses: {},
  };
  const PLAYABLE = ORGS.filter(o => o.playable !== false);
  const LIST = PLAYABLE.length ? PLAYABLE : [DEFAULT_ORG];

  const W = 900;                       // 可视地形边长（米）
  const DIGITS = '0123456789abcdefghijklmnopqrstuvwxyz';
  let NX = Math.round(num(COARSE.nx, 0)) || 72;
  let NY = Math.round(num(COARSE.ny, 0)) || 36;

  function decodeArr(s, n) {
    s = String(s || '');
    if (!n || s.length !== n) return null;
    const a = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const k = DIGITS.indexOf(s[i]);
      a[i] = (k < 0 ? 0 : k) / 36;
    }
    return a;
  }
  function decodeOcean(s, n) {
    s = String(s || '');
    if (!n || s.length !== n) return null;
    const a = new Uint8Array(n);
    for (let i = 0; i < n; i++) a[i] = s[i] === '1' ? 1 : 0;
    return a;
  }

  let elevArr = decodeArr(COARSE.elevation, NX * NY);
  const oceanArr = decodeOcean(COARSE.ocean, NX * NY);

  if (!elevArr) {
    elevArr = new Float32Array(NX * NY);
    const sd = (META.id || META.name || 'pangu').length * 0.37;
    for (let j = 0; j < NY; j++) {
      for (let i = 0; i < NX; i++) {
        const u = i / NX * Math.PI * 2, v = j / NY * Math.PI;
        elevArr[j * NX + i] = 0.5
          + 0.22 * Math.sin(u * 2 + sd) * Math.cos(v * 1.7)
          + 0.10 * Math.sin(u * 5.3 + v * 2.1 + sd);
      }
    }
  }

  const SEA = (() => {
    if (oceanArr) {
      // 海域格子的最高高程就是海平面；0 也是合法值，不能再兜底成 0.45，
      // 否则整块大陆都会被判到水下（赫利孔这种 0–0.36 的高程场尤其明显）。
      let m = 0;
      for (let i = 0; i < elevArr.length; i++) if (oceanArr[i]) m = Math.max(m, elevArr[i]);
      return m;
    }
    return 0.45;
  })();

  function sample(arr, u, v) {
    const fx = clamp(u, 0, 0.999999) * (NX - 1);
    const fy = clamp(v, 0, 0.999999) * (NY - 1);
    const i0 = Math.floor(fx), j0 = Math.floor(fy);
    const i1 = Math.min(NX - 1, i0 + 1), j1 = Math.min(NY - 1, j0 + 1);
    const tx = fx - i0, ty = fy - j0;
    const a = arr[j0 * NX + i0] * (1 - tx) + arr[j0 * NX + i1] * tx;
    const b = arr[j1 * NX + i0] * (1 - tx) + arr[j1 * NX + i1] * tx;
    return a * (1 - ty) + b * ty;
  }
  const elevAt = (x, z) => sample(elevArr, x / W + 0.5, z / W + 0.5);
  const heightAt = (x, z) => (elevAt(x, z) - SEA) * 150;

  // 粗场的高程单位不一定归一到 0–1（赫利孔只到 0.36），所以群系不能按绝对值取，
  // 得先把陆地高程拉回 0–1 再分带；否则整块大陆都会被认成浅海。
  const LAND_BIOMES = BIOMES.filter(b => num(b.elevation, 0) > 0.4);
  const SEA_BIOMES = BIOMES.filter(b => num(b.elevation, 0) <= 0.4);
  let landMin = 0, landMax = 1;
  (() => {
    let lo = Infinity, hi = -Infinity;
    for (let i = 0; i < elevArr.length; i++) {
      const land = oceanArr ? !oceanArr[i] : elevArr[i] > SEA;
      if (!land) continue;
      lo = Math.min(lo, elevArr[i]); hi = Math.max(hi, elevArr[i]);
    }
    if (isFinite(lo) && isFinite(hi) && hi > lo) { landMin = lo; landMax = hi; }
    else { landMin = SEA; landMax = SEA + 0.1; }
  })();

  function biomeAt(e) {
    const land = e > SEA + 1e-9;
    if (!BIOMES.length) return { color: land ? '#6f6a5a' : '#2a4b63' };
    if (land) {
      const list = LAND_BIOMES.length ? LAND_BIOMES : BIOMES;
      const ln = clamp((e - landMin) / Math.max(1e-6, landMax - landMin), 0, 0.999);
      return list[clamp(Math.floor(ln * list.length), 0, list.length - 1)];
    }
    const list = SEA_BIOMES.length ? SEA_BIOMES : BIOMES;
    const dn = clamp(e / Math.max(1e-6, SEA), 0, 0.999);
    return list[clamp(Math.floor(dn * list.length), 0, list.length - 1)];
  }

  function mulberry(a) {
    a = (a | 0) || 1;
    return function () {
      a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function spawnPoint() {
    const target = SEA + (landMax - SEA) * 0.22;   // 低地，不是山脊
    let best = null;
    for (let j = 0; j < NY; j++) {
      for (let i = 0; i < NX; i++) {
        const e = elevArr[j * NX + i];
        const land = oceanArr ? !oceanArr[j * NX + i] : e > SEA;
        if (!land) continue;
        // 挑「离海不远、且脚下够平」的格子：第一人称不该出生在悬崖上
        let slope = 0;
        for (const [di, dj] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
          const ii = (i + di + NX) % NX;
          const jj = clamp(j + dj, 0, NY - 1);
          slope = Math.max(slope, Math.abs(elevArr[jj * NX + ii] - e));
        }
        const score = Math.abs(e - target) + slope * 3.2;
        if (!best || score < best.score) best = { i, j, score, e };
      }
    }
    if (!best) return { x: 0, z: 0 };
    return {
      x: ((best.i + 0.5) / NX - 0.5) * W,
      z: ((best.j + 0.5) / NY - 0.5) * W,
    };
  }

  function starHue(s) { return starColor(s || { temp_k: 5800 }); }

  let renderer = null, scene = null, camera = null;
  let raf = 0, started = false, last = 0;
  let model = null, hands = null, parts = null;
  let npcs = [];
  let species = LIST[0];
  let pos = null, vel = null, yaw = 0, pitch = 0, onGround = true;
  let third = false, moveT = 0, clock = 0;
  const keys = Object.create(null);
  let drag = null;

  function gauge(org) {
    const loco = org.locomotion || {};
    const g = Math.max(0.05, num(BODY.gravity_g, 1)) * 9.81;
    return {
      eyeH: Math.max(0.35, num(org.height_m, 1.7) * 0.92),
      walk: Math.max(0.2, num(loco.speed_ms, 3.2)),
      run: Math.max(0.4, num(loco.sprint_ms, num(loco.speed_ms, 3.2) * 1.7)),
      jump: Math.max(0.1, num(loco.jump_m, 0.9)),
      g,
    };
  }

  function buildModel(org) {
    const g = new THREE.Group();
    const b = (org.body && typeof org.body === 'object') ? org.body : {};
    const pal = (org.palette || []).filter(Boolean);
    const C = [pal[0] || '#8b1a1a', pal[1] || '#2b2320', pal[2] || '#d9c7a3'];
    const mats = C.map(c => new THREE.MeshLambertMaterial({ color: c, flatShading: true }));
    const H = Math.max(0.4, num(org.height_m, 1.8));
    const torso = (Array.isArray(b.torso) && b.torso.length === 3) ? b.torso : [0.9, 0.8, 1.8];
    const tw = torso[0] * H * 0.38;
    const th = torso[1] * H * 0.34;
    const tl = torso[2] * H * 0.38;
    const legs = clamp(Math.round(num(b.legs, num(org.legs, 4))), 0, 6);
    const tails = clamp(Math.round(num(b.tail_segments, num(org.tail, 0))), 0, 5);
    const headS = Math.max(0.12, num(b.head_scale, 1) * H * 0.25);
    const legL = Math.max(0.1, H * 0.40 - th * 0.4);

    const torsoMesh = new THREE.Mesh(new THREE.BoxGeometry(tw, th, tl), mats[1]);
    torsoMesh.position.set(0, legL + th / 2, 0);
    g.add(torsoMesh);

    const headZ = -(tl / 2 + headS * 0.42);
    const head = new THREE.Mesh(new THREE.BoxGeometry(headS * 0.86, headS * 0.8, headS), mats[0]);
    head.position.set(0, legL + th + headS * 0.36, headZ);
    g.add(head);
    const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffd27a });
    for (const s of [-1, 1]) {
      const eye = new THREE.Mesh(new THREE.BoxGeometry(headS * 0.16, headS * 0.12, headS * 0.06), eyeMat);
      eye.position.set(s * headS * 0.26, headS * 0.12, -headS * 0.52);
      head.add(eye);
    }
    const jaw = new THREE.Mesh(new THREE.BoxGeometry(headS * 0.66, headS * 0.16, headS * 0.72), mats[2]);
    jaw.position.set(0, -headS * 0.36, -headS * 0.06);
    head.add(jaw);

    // 背脊棘刺：硅质骨架的外显
    for (let i = 0; i < 3; i++) {
      const spike = new THREE.Mesh(new THREE.ConeGeometry(tw * 0.16, H * 0.16, 4), mats[2]);
      spike.position.set(0, legL + th + H * 0.06, -tl * 0.22 + i * tl * 0.22);
      g.add(spike);
    }

    const legPivots = [];
    const rows = legs === 6 ? [-tl * 0.32, 0, tl * 0.32]
      : (legs >= 4 ? [-tl * 0.3, tl * 0.3] : [0]);
    const cols = legs >= 4 ? [-tw * 0.36, tw * 0.36]
      : (legs === 2 ? [-tw * 0.3, tw * 0.3] : [0]);
    for (const rz of rows) {
      for (const cx of cols) {
        if (!legs) break;
        const pivot = new THREE.Group();
        pivot.position.set(cx, legL, rz);
        const limb = new THREE.Mesh(new THREE.BoxGeometry(H * 0.1, legL, H * 0.1), mats[0]);
        limb.position.y = -legL / 2;
        pivot.add(limb);
        const foot = new THREE.Mesh(new THREE.BoxGeometry(H * 0.12, H * 0.05, H * 0.16), mats[2]);
        foot.position.set(0, -legL + H * 0.02, -H * 0.03);
        pivot.add(foot);
        pivot.userData.moving = true;
        g.add(pivot);
        legPivots.push(pivot);
      }
    }

    const tailPivots = [];
    let parent = g;
    for (let i = 0; i < tails; i++) {
      const seg = new THREE.Group();
      seg.position.set(0, legL + th * 0.62, i === 0 ? tl / 2 : H * 0.2);
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(tw * (0.3 - i * 0.03), th * (0.24 - i * 0.02), H * 0.22),
        mats[0]);
      mesh.position.z = H * 0.11;
      seg.add(mesh);
      parent.add(seg);
      tailPivots.push(seg);
      parent = seg;
    }

    // 接地暗影：没有阴影的方块生物会像浮在空中
    const shadow = new THREE.Mesh(new THREE.CircleGeometry(H * 0.42, 16),
      new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.26, depthWrite: false }));
    shadow.rotation.x = -Math.PI / 2;
    shadow.position.y = 0.02;
    g.add(shadow);

    g.userData.parts = { legs: legPivots, tail: tailPivots, head };
    return g;
  }

  function buildHands(org) {
    const pal = (org.palette || []).filter(Boolean);
    const dark = new THREE.MeshLambertMaterial({ color: pal[1] || '#2b2320' });
    const claw = new THREE.MeshLambertMaterial({ color: pal[2] || '#d9c7a3' });
    const g = new THREE.Group();

    // 第一人称的「自己的身体」：两只前肢的末端从画面下缘探进来，
    // 走动时会跟着步伐轻摆。四足与两足通用，不做人手/兽爪的分叉。
    for (const s of [-1, 1]) {
      const paw = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.07, 0.26), dark);
      paw.position.set(0.46 * s, -0.6, -0.88);
      paw.rotation.x = -0.15;
      paw.rotation.y = 0.26 * s;
      g.add(paw);
      const tip = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.05, 0.06), claw);
      tip.position.set(0.5 * s, -0.62, -1.0);
      g.add(tip);
    }
    g.visible = false;
    return g;
  }

  function buildSky() {
    IS_STARS.slice(0, 3).forEach((s, i) => {
      const az = 0.7 + i * 2.1, el = 0.62 - i * 0.18, R = 280;
      const p = new THREE.Vector3(
        Math.cos(az) * Math.cos(el) * R, Math.sin(el) * R, Math.sin(az) * Math.cos(el) * R);
      const c = new THREE.Color(starHue(s));
      const core = new THREE.Mesh(new THREE.SphereGeometry(5 + i * 1.5, 12, 12),
        new THREE.MeshBasicMaterial({ color: c }));
      core.position.copy(p);
      scene.add(core);
      const halo = new THREE.Mesh(new THREE.SphereGeometry(15 + i * 4, 16, 16),
        new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: 0.16 }));
      halo.position.copy(p);
      scene.add(halo);
    });
  }

  function buildTerrain() {
    const seg = 96;
    const geo = new THREE.PlaneGeometry(W, W, seg, seg);
    geo.rotateX(-Math.PI / 2);
    const p = geo.attributes.position;
    const colors = new Float32Array(p.count * 3);
    const col = new THREE.Color();
    for (let i = 0; i < p.count; i++) {
      const x = p.getX(i), z = p.getZ(i);
      const e = elevAt(x, z);
      p.setY(i, (e - SEA) * 150);
      col.set(biomeAt(e).color || '#3a4a3a');
      const k = 0.86 + ((i * 37) % 23) / 100;
      colors[i * 3] = col.r * k;
      colors[i * 3 + 1] = col.g * k;
      colors[i * 3 + 2] = col.b * k;
    }
    geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
    geo.computeVertexNormals();
    scene.add(new THREE.Mesh(geo, new THREE.MeshLambertMaterial({
      vertexColors: true, flatShading: true,
    })));

    const wgeo = new THREE.PlaneGeometry(W, W);
    wgeo.rotateX(-Math.PI / 2);
    const wcol = (BIOMES[0] && BIOMES[0].color) || '#1E4058';
    const water = new THREE.Mesh(wgeo, new THREE.MeshLambertMaterial({
      color: new THREE.Color(wcol), transparent: true, opacity: 0.76,
    }));
    water.position.y = 0.02;
    scene.add(water);
  }

  function buildProps() {
    const rnd = mulberry((META.id || 'pangu').split('').reduce((a, c) => a + c.charCodeAt(0), 7));
    const hub = spawnPoint();
    const spread = 260;                 // 道具围着出生点铺，免得 900 m 里空得看不见
    const rockGeo = new THREE.DodecahedronGeometry(1, 0);
    const rockMat = new THREE.MeshLambertMaterial({ color: 0x6b6155, flatShading: true });
    for (let i = 0; i < 180; i++) {
      const x = clamp(hub.x + (rnd() - 0.5) * spread, -W / 2 + 6, W / 2 - 6);
      const z = clamp(hub.z + (rnd() - 0.5) * spread, -W / 2 + 6, W / 2 - 6);
      const h = heightAt(x, z);
      if (h < 0.8 || Math.hypot(x - hub.x, z - hub.z) < 8) continue;
      if (Math.abs(heightAt(x + 4, z) - h) + Math.abs(heightAt(x, z + 4) - h) > 3) continue;
      const s = 0.5 + rnd() * 1.7;
      const m = new THREE.Mesh(rockGeo, rockMat);
      m.position.set(x, h + s * 0.2, z);
      m.scale.set(s, s * (0.55 + rnd() * 0.6), s);
      m.rotation.set(rnd() * 3, rnd() * 6, rnd() * 3);
      scene.add(m);
    }
    for (let i = 0; i < 420; i++) {
      const x = clamp(hub.x + (rnd() - 0.5) * spread, -W / 2 + 6, W / 2 - 6);
      const z = clamp(hub.z + (rnd() - 0.5) * spread, -W / 2 + 6, W / 2 - 6);
      const h = heightAt(x, z);
      if (h < 0.6 || Math.hypot(x - hub.x, z - hub.z) < 7) continue;
      if (Math.abs(heightAt(x + 4, z) - h) + Math.abs(heightAt(x, z + 4) - h) > 2.5) continue;
      const e = elevAt(x, z);
      const c = new THREE.Color(biomeAt(e).color || '#4c5a33');
      c.offsetHSL(0, 0.05, 0.04);
      const hgt = 0.45 + rnd() * 1.1;
      const w = 0.16 + rnd() * 0.22;
      const stem = new THREE.Mesh(new THREE.BoxGeometry(w * 0.3, hgt, w * 0.3),
        new THREE.MeshLambertMaterial({ color: c.clone().offsetHSL(0, 0, -0.12), flatShading: true }));
      stem.position.set(x, h + hgt / 2 - 0.05, z);
      scene.add(stem);
      const canopy = new THREE.Mesh(new THREE.BoxGeometry(w, w * 1.5, w),
        new THREE.MeshLambertMaterial({ color: c, flatShading: true }));
      canopy.position.set(x, h + hgt + w * 0.55, z);
      canopy.rotation.y = rnd() * 6.28;
      scene.add(canopy);
    }
  }

  function buildNpcs() {
    npcs.forEach(n => scene.remove(n.obj));
    npcs = [];
    if (ORGS.length < 2) return;
    const others = ORGS.filter(o => o.playable !== false && o !== species).slice(0, 3);
    others.forEach((o, i) => {
      const obj = buildModel(o);
      scene.add(obj);
      const sp = spawnPoint();
      npcs.push({
        org: o, obj, pos: new THREE.Vector3(sp.x + (i - 1) * 6, 0, sp.z + (i - 1) * 5),
        dir: i * 2.1, next: 0, t: Math.random() * 5,
      });
    });
  }

  function resize() {
    if (!renderer) return;
    const w = cvs.clientWidth || view.clientWidth || window.innerWidth;
    const h = cvs.clientHeight || (window.innerHeight - 76);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(w, h, false);
    camera.aspect = w / Math.max(1, h);
    camera.updateProjectionMatrix();
  }

  function respawn() {
    if (!pos) { pos = new THREE.Vector3(); vel = new THREE.Vector3(); }
    const sp = spawnPoint();
    pos.set(sp.x, heightAt(sp.x, sp.z) + 0.05, sp.z);
    vel.set(0, 0, 0);
    yaw = 0.6; pitch = -0.05; onGround = true; moveT = 0;
  }

  function rebuild() {
    if (!scene) return;
    if (model) scene.remove(model);
    model = buildModel(species);
    scene.add(model);
    parts = model.userData.parts;
    if (hands) camera.remove(hands);
    hands = buildHands(species);
    camera.add(hands);
    buildNpcs();
    respawn();
    renderCard();
  }

  function init() {
    if (!THREE) return false;
    if (renderer) return true;
    try {
      renderer = new THREE.WebGLRenderer({ canvas: cvs, antialias: true });
    } catch (e) { renderer = null; return false; }
    scene = new THREE.Scene();
    const skyC = new THREE.Color(starHue(IS_STARS[0]));
    skyC.lerp(new THREE.Color(0x9fc0e8), 0.68);
    scene.background = skyC;
    scene.fog = new THREE.Fog(skyC, 150, 430);
    camera = new THREE.PerspectiveCamera(72, 1.5, 0.08, 1400);
    camera.rotation.order = 'YXZ';
    scene.add(camera);

    scene.add(new THREE.HemisphereLight(0xbfd6ff, 0x241a12, 0.9));
    const l1 = new THREE.DirectionalLight(new THREE.Color(starHue(IS_STARS[0])), 1.1);
    l1.position.set(70, 110, 40);
    scene.add(l1);
    if (IS_STARS[1]) {
      const l2 = new THREE.DirectionalLight(new THREE.Color(starHue(IS_STARS[1])), 0.45);
      l2.position.set(-80, 60, -50);
      scene.add(l2);
    }
    buildSky();
    buildTerrain();
    buildProps();
    camera.add(new THREE.PointLight(0xffffff, 0.15, 8));
    resize();
    return true;
  }

  function togglePov() {
    third = !third;
    $('cr-pov').classList.toggle('on', !third);
    $('cr-pov').textContent = third ? '第三人称' : '第一人称';
    if (model) model.visible = third;
    if (hands) hands.visible = !third;
  }

  function glyphBox(e) {
    const m = String(e.glyph || '').match(/⿸气⿰钅([\u4e00-\u9fa5])$/);
    const ch = m ? m[1] : '?';
    return `<span class="feglyph" title="${e.glyph || ''}">` +
      `<span class="gqi">气</span>` +
      `<span class="gin"><span class="gjin">钅</span><span>${ch}</span></span></span>`;
  }

  function renderCard() {
    const org = species;
    $('cr-name').textContent = org.name || '未命名物种';
    const subs = [org.role, BIC.base ? ('基座 ' + BIC.base) : ''].filter(Boolean);
    $('cr-sub').textContent = subs.join(' · ') || '未声明生化基座';

    const g = gauge(org);
    const rows = [
      ['主元素', BIC.primary_element || '—'],
      ['结构元素', BIC.structural_element || '—'],
      ['体高', num(org.height_m, 0) ? num(org.height_m).toFixed(2) + ' m' : '—'],
      ['眼高', g.eyeH.toFixed(2) + ' m'],
      ['步速 / 疾走', g.walk.toFixed(1) + ' / ' + g.run.toFixed(1) + ' m/s'],
      ['表面重力', num(BODY.gravity_g, 1).toFixed(2) + ' g'],
    ].map(([k, v]) => `<div class="cr-row"><span>${k}</span><b>${v}</b></div>`).join('');

    const mix = (org.composition && typeof org.composition === 'object')
      ? org.composition : (BIC.composition || {});
    const entries = Object.entries(mix)
      .filter(([, v]) => typeof v === 'number')
      .sort((a, b) => b[1] - a[1]).slice(0, 5);
    const bars = entries.map(([k, v]) =>
      `<div class="cr-row"><span>${k}</span><b>${(v * 100).toFixed(1)}%</b></div>` +
      `<div class="cr-bar"><i style="width:${Math.max(0, Math.min(100, v * 100))}%"></i></div>`).join('');

    const chips = ELS.map(e =>
      `<span class="fe" title="${(e.role || '').replace(/"/g, '')}">${glyphBox(e)}` +
      `<b>${e.symbol || ''}</b><span style="opacity:.55">` +
      `${e.phase_at_surface ? '· ' + e.phase_at_surface : ''}</span></span>`).join('');

    $('cr-body').innerHTML = rows +
      (bars ? `<div class="cr-cap">体成分</div>${bars}` : '') +
      (chips ? `<div class="cr-cap">本地新元素</div><div class="cr-els">${chips}</div>` : '');
  }

  function tick(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now; clock += dt;
    update(dt);
    renderer.render(scene, camera);
    raf = requestAnimationFrame(tick);
  }

  function update(dt) {
    const org = species;
    const g = gauge(org);
    const sprint = !!keys['shift'];
    const speed = sprint ? g.run : g.walk;

    let ix = 0, iz = 0;
    if (keys['w'] || keys['arrowup']) iz -= 1;
    if (keys['s'] || keys['arrowdown']) iz += 1;
    if (keys['a'] || keys['arrowleft']) ix -= 1;
    if (keys['d'] || keys['arrowright']) ix += 1;
    const moving = (ix !== 0 || iz !== 0);

    if (moving) {
      const len = Math.hypot(ix, iz); ix /= len; iz /= len;
      const fx = -Math.sin(yaw), fz = -Math.cos(yaw);
      const rx = Math.cos(yaw), rz = -Math.sin(yaw);
      const dx = fx * (-iz) + rx * ix;
      const dz = fz * (-iz) + rz * ix;
      pos.x = clamp(pos.x + dx * speed * dt, -W / 2 + 3, W / 2 - 3);
      pos.z = clamp(pos.z + dz * speed * dt, -W / 2 + 3, W / 2 - 3);
      moveT += dt * (sprint ? 1.5 : 1);
    }

    vel.y -= g.g * dt;
    pos.y += vel.y * dt;
    const gy = heightAt(pos.x, pos.z);
    if (pos.y <= gy) { pos.y = gy; vel.y = 0; onGround = true; } else { onGround = false; }

    const bob = (moving && onGround) ? Math.sin(moveT * 9) * 0.04 : 0;
    if (!third) {
      camera.position.set(pos.x, pos.y + g.eyeH + bob, pos.z);
      camera.rotation.set(pitch, yaw, 0);
      if (model) model.visible = false;
      if (hands) {
        hands.visible = true;
        hands.position.y = moving ? Math.sin(moveT * 9) * 0.02 : 0;
      }
    } else {
      const dist = 3.4 + g.eyeH * 1.35;
      const cp = Math.cos(pitch);
      const cx = pos.x + Math.sin(yaw) * dist * cp;
      const cz = pos.z + Math.cos(yaw) * dist * cp;
      let cy = pos.y + g.eyeH + Math.sin(-pitch) * dist * 0.8 + 0.55;
      // 相机不许埋进山脊：沿玩家到相机的连线逐步抬到地面之上
      for (let k = 1; k <= 8; k++) {
        const t = k / 8;
        const tx = pos.x + (cx - pos.x) * t;
        const tz = pos.z + (cz - pos.z) * t;
        cy = Math.max(cy, heightAt(tx, tz) + 0.85);
      }
      cy = Math.max(cy, pos.y + 0.7);
      camera.position.set(cx, cy, cz);
      camera.lookAt(pos.x, pos.y + g.eyeH * 0.85, pos.z);
      if (model) model.visible = true;
      if (hands) hands.visible = false;
    }

    if (model) {
      model.position.set(pos.x, pos.y + (moving ? Math.abs(Math.sin(moveT * 7)) * 0.045 : 0), pos.z);
      model.rotation.y = yaw;
      animate(model, clock, moving, speed);
    }
    npcs.forEach(n => {
      n.t += dt;
      if (n.t > n.next) { n.dir = Math.random() * 6.283; n.next = n.t + 2 + Math.random() * 3; }
      n.pos.x = clamp(n.pos.x + Math.cos(n.dir) * 0.9 * dt, -W / 2 + 3, W / 2 - 3);
      n.pos.z = clamp(n.pos.z + Math.sin(n.dir) * 0.9 * dt, -W / 2 + 3, W / 2 - 3);
      const y = heightAt(n.pos.x, n.pos.z);
      n.obj.position.set(n.pos.x, y, n.pos.z);
      n.obj.rotation.y = Math.atan2(-Math.cos(n.dir), -Math.sin(n.dir));
      animate(n.obj, clock + n.t, true, 1.2);
    });

    if (Math.floor(clock * 5) !== Math.floor((clock - dt) * 5)) {
      readout.textContent =
        `${heightAt(pos.x, pos.z).toFixed(1)} m · ${(sprint ? speed : speed).toFixed(1)} m/s` +
        ` · ${third ? '第三人称' : '第一人称'}`;
    }
  }

  function animate(g, t, moving, speed) {
    const p = g.userData && g.userData.parts;
    if (!p) return;
    const amp = moving ? 0.55 : 0.05;
    const w = t * (moving ? 5.2 + Math.min(speed, 12) * 0.45 : 1.2);
    p.legs.forEach((leg, i) => {
      leg.rotation.x = Math.sin(w + (i % 2 ? Math.PI : 0) + Math.floor(i / 2) * 0.9) * amp;
    });
    p.tail.forEach((seg, i) => { seg.rotation.y = Math.sin(t * 1.6 + i * 0.8) * 0.2; });
    if (p.head) p.head.rotation.x = Math.sin(w * 0.5) * 0.04;
  }

  function bindOnce() {
    window.addEventListener('keydown', e => {
      if (!view.classList.contains('show')) return;
      const k = e.key.toLowerCase();
      keys[k] = true;
      if (['w', 'a', 's', 'd', ' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) {
        e.preventDefault();
      }
      if (k === 'f') togglePov();
      if (k === 'r') respawn();
      if (k === ' ' && onGround) {
        const g = gauge(species);
        vel.y = Math.sqrt(2 * g.g * g.jump);
        onGround = false;
      }
    });
    window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

    cvs.addEventListener('pointerdown', e => {
      drag = { x: e.clientX, y: e.clientY, id: e.pointerId };
      try { cvs.setPointerCapture(e.pointerId); } catch (_) { }
    });
    cvs.addEventListener('pointermove', e => {
      if (!drag || drag.id !== e.pointerId) return;
      yaw -= (e.clientX - drag.x) * 0.0042;
      pitch = clamp(pitch - (e.clientY - drag.y) * 0.0032, -1.15, 0.85);
      drag.x = e.clientX; drag.y = e.clientY;
    });
    const stop = () => { drag = null; };
    cvs.addEventListener('pointerup', stop);
    cvs.addEventListener('pointercancel', stop);

    $('cr-reset').onclick = () => respawn();
    $('cr-pov').onclick = () => togglePov();
    sel.onchange = () => {
      const i = Math.max(0, sel.selectedIndex);
      species = LIST[i] || LIST[0];
      third = false;
      $('cr-pov').textContent = '第一人称';
      $('cr-pov').classList.add('on');
      rebuild();
    };
  }

  function fillSelect() {
    sel.innerHTML = LIST.map((o, i) =>
      `<option value="${i}">${o.name || ('物种 ' + (i + 1))}</option>`).join('');
    sel.selectedIndex = Math.max(0, LIST.indexOf(species));
  }

  function open() {
    if (!init()) {
      view.classList.add('show');
      UI.mark('v-creature');
      hint.innerHTML = '<span class="warn">3D 未加载（离线或 WebGL 不可用）——这一页只剩物种卡。</span>';
      renderCard();
      return;
    }
    SURF.close();
    LIFE.close();
    view.classList.add('show');
    UI.mark('v-creature');
    if (!started) {
      started = true;
      fillSelect();
      bindOnce();
      rebuild();
    } else {
      resize();
      renderCard();
    }
    hint.innerHTML =
      'WASD / 方向键移动 · Shift 疾走 · 空格跳跃 · 拖动转头 · <b>F</b> 切视角 · <b>R</b> 重生' +
      '<br><span style="opacity:.6">地形由 72×36 粗场放大，非真实比例；物种眼高与步速来自 world.json</span>';
    if (!raf) { last = performance.now(); raf = requestAnimationFrame(tick); }
  }

  function close() {
    view.classList.remove('show');
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
    drag = null;
  }

  function canOpen() {
    return LIST.length > 0 || !!BIC.base;
  }

  window.addEventListener('resize', () => {
    if (view.classList.contains('show')) resize();
  });

  return { open, close, canOpen, get ready() { return !!renderer; } };
}

/* ══ 1.1.5 · 账本：把「错多少」画出来（纯 DOM，不动 3D）══ */
const BOOKS = (function () {
  const view = $('books-view');
  const grid = $('bk-grid');
  const chipsBox = $('bk-chips');
  const subEl = $('bk-sub');
  const foot = $('bk-foot');
  let DATA = null, built = false;

  const esc = s => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  const KIND = [
    ['computed', '算出来的', '#7fe0a8'],
    ['mixed', '半算半填', '#ffcf8a'],
    ['empirical', '经验式', '#7fb6d9'],
    ['declared', '作者拍的', '#8a7bd6'],
  ];

  function fmt(v) {
    if (typeof v === 'string') return v;
    if (v == null || !isFinite(v)) return '—';
    const a = Math.abs(v);
    if (a >= 1e9) return (v / 1e8).toFixed(1) + ' 亿';
    if (a >= 1e5) return (v / 1e4).toFixed(0) + ' 万';
    if (a >= 100) return v.toFixed(0);
    if (a >= 1) return String(+v.toFixed(2));
    if (a >= 0.01) return String(+v.toFixed(3));
    return String(+v.toPrecision(2));
  }

  function card(title, meta, body, cls) {
    return `<section class="bk-card${cls ? ' ' + cls : ''}">
      <h3>${esc(title)}${meta ? `<em>${esc(meta)}</em>` : ''}</h3>
      <div class="bk-body">${body}</div></section>`;
  }

  /* ── 适用域：环形 + 四类堆叠 ── */
  function cardCertify(c) {
    if (!c || c.error) return card('适用域 · 这些数从哪来', '算不出', `<div class="bk-note">${esc(c && c.error || '缺数据')}</div>`);
    const bk = c.by_kind || {};
    const parts = KIND.map(([k, label, color]) => ({ k, label, color, n: (bk[k] || []).length }));
    const total = c.total || parts.reduce((s, p) => s + p.n, 0) || 1;
    const shots = (c.rows || []).filter(r => r.kind === 'declared' || r.kind === 'mixed').slice(0, 4);
    const list = shots.length
      ? `<div class="bk-note"><b>不是算出来的：</b>` +
        shots.map(r => `<br>· ${esc(r.name)}${r.kind === 'mixed' ? '（半算）' : ''} — ${esc(r.note || '作者设定值')}`).join('') +
        `</div>`
      : '';
    const body = `
      <div class="bk-donut"><canvas id="bk-donut" width="152" height="152"></canvas>
        <div class="mid"><b>${Math.round((c.coverage || 0) * 100)}%</b><span>算出来的</span></div></div>
      <div class="bk-stack">${parts.map(p => `<i style="width:${(p.n / total * 100).toFixed(2)}%;background:${p.color};opacity:${p.n ? 1 : .16}"></i>`).join('')}</div>
      <div class="bk-legend">${parts.map(p => `<div class="row"><span class="sw" style="background:${p.color}"></span>${p.label}<span class="n">${p.n}</span></div>`).join('')}</div>
      ${list}`;
    return card('适用域 · 这些数从哪来', `${c.total || 0} 条关键结论`, body);
  }

  /* ── 误差：值 ± ── */
  function cardUq(u) {
    const rows = (u && u.rows) || [];
    if (!rows.length) {
      return card('误差 · 每个数带 ±', '缺输入',
        `<div class="bk-note">${esc(u && u.error || '没有可推的派生量（缺半径 / 质量 / 大气）')}</div>`);
    }
    const maxRel = Math.max.apply(null, rows.map(r => r.rel || 0).concat([0.01]));
    const tr = rows.map(r => {
      const drv = (r.drivers || []).map(d => `${d.label}（${d.d > 0 ? '+' : ''}${(d.d).toFixed(1)}${esc(r.unit || '')}）`).join(' ｜ ');
      return `<tr title="${esc(drv)}">
        <td class="nm">${esc(r.name)}</td>
        <td class="num r">${fmt(r.value)} <span style="color:var(--ink-faint)">± ${fmt(r.pm)} ${esc(r.unit || '')}</span></td>
        <td class="r" style="width:30%">
          <div class="bk-bar"><i class="ok" style="width:${Math.min(100, (r.rel / maxRel) * 100).toFixed(0)}%"></i></div>
          <div style="font-size:9.5px;color:var(--ink-faint);margin-top:3px;font-variant-numeric:tabular-nums">${(r.rel * 100).toFixed(1)}%</div>
        </td></tr>`;
    }).join('');
    const body = `<table class="bk-tbl">
        <tr><th>量</th><th class="r">值 ±</th><th class="r">相对</th></tr>${tr}</table>
      <div class="bk-note">按 <b>假定输入区间</b> 传播（反照率 ±0.05、光度 ±1%、半径/质量 ±1%、CO₂ ±20%）。${esc(u.note || '')}。</div>`;
    const top = rows[0] && rows[0].drivers && rows[0].drivers[0];
    return card('误差 · 每个数带 ±', top ? '最大来源 ' + top.label : '一阶线性', body);
  }

  /* ── 守恒：残差与容差 ── */
  function cardLedger(l) {
    if (!l || l.error) return card('守恒账本', '算不出', `<div class="bk-note">${esc(l && l.error || '缺数据')}</div>`);
    const rows = l.rows || [];
    if (!rows.length) return card('守恒账本', '无账可算', '<div class="bk-note">缺半径 / 大气 / 水量，账本开不起来。</div>');
    const bar = r => {
      const tol = r.tol || 0.01;
      const ratio = Math.abs(r.residual || 0) / tol;
      const w = Math.min(100, ratio * 50);
      const cls = r.status === 'warn' ? 'warn' : r.status === 'info' ? 'info'
        : r.status === 'skip' ? 'skip' : 'ok';
      return `<div class="bk-bar"><i class="${cls}" style="width:${w.toFixed(0)}%"></i><u style="left:50%"></u></div>`;
    };
    const tr = rows.map(r => {
      const ic = r.status === 'warn' ? '!' : r.status === 'skip' ? '·' : '✓';
      const col = r.status === 'warn' ? '#ffb26b' : r.status === 'skip' ? 'var(--ink-faint)' : '#7fe0a8';
      return `<tr title="${esc(r.note)}">
        <td style="color:${col};width:14px">${ic}</td>
        <td class="nm">${esc(r.id)} ${esc(r.name)}</td>
        <td class="num r">${r.status === 'skip' ? '—' : (r.residual >= 0 ? '+' : '') + (r.residual * 100).toFixed(1) + '%'}</td>
        <td class="r" style="width:30%">${bar(r)}</td></tr>`;
    }).join('');
    const bad = (l.bad || []).length;
    const expl = (l.explained || []).length;
    const tail = l.ok ? '全部配平。'
      : (expl ? `${bad} 本不平，其中 ${expl} 本由声明压过模型（只报不改）。` : `${bad} 本不平。`);
    return card('守恒账本', `${l.scored || 0} 本可算 ｜ ${l.info || 0} 本储库`,
      `<table class="bk-tbl"><tr><th></th><th>账</th><th class="r">残差</th><th class="r">容差</th></tr>${tr}</table>
       <div class="bk-note">${esc(tail)} 竖线 = 容差；条越过竖线就是不平。</div>`);
  }

  /* ── 八个内核 ── */
  function cardKernel(k) {
    if (!k) return card('物理内核 · 1.2–1.8', '--fast 跳过',
      '<div class="bk-note">本次用 --fast 生成：内核自检没跑。去掉 --fast 重跑 preview 就能看到。</div>', 'span2');
    if (k.error) return card('物理内核 · 1.2–1.8', '跑不起来', `<div class="bk-note">${esc(k.error)}</div>`, 'span2');
    const rows = k.rows || [];
    const tiles = rows.map((r, i) => `<button class="kn ${r.ok ? 'ok' : 'bad'}" data-i="${i}">
        <div class="f">${r.ok ? '✓' : '×'}</div>
        <div class="m">${esc(r.label)}</div>
        <div class="s">${esc(r.module)}.py · 自 ${esc(r.since)}</div></button>`).join('');
    const body = `<div class="bk-kern">${tiles}</div><pre class="bk-pre" id="bk-pre"></pre>`;
    return card('物理内核 · 1.2–1.8', `${k.passed || 0}/${k.total || 0} 通过`, body, 'span2');
  }

  /* ── 可复算 ── */
  function cardReplay(r) {
    if (!r) return card('可复算 · 同 seed 重放', '--fast 跳过',
      '<div class="bk-note">本次用 --fast 生成：重放没跑。</div>');
    const rows = r.rows || [];
    if (!rows.length) return card('可复算 · 同 seed 重放', '无',
      `<div class="bk-note">${esc(r.error || '没有 map / ca 存档可以重放')}</div>`);
    const tr = rows.map(x => {
      const ic = x.status === 'ok' ? '✓' : x.status === 'fail' ? '×' : '·';
      const col = x.status === 'ok' ? '#7fe0a8' : x.status === 'fail' ? '#ff7a6b' : 'var(--ink-faint)';
      return `<tr title="${esc(x.note)}">
        <td style="color:${col};width:14px">${ic}</td>
        <td class="nm">${esc(x.layer)}</td>
        <td class="num">${esc(String(x.seed))}</td>
        <td class="num" style="color:var(--ink-faint)">${esc(String(x.stored).slice(0, 8))}</td>
        <td class="num">${esc(String(x.got).slice(0, 8))}</td></tr>`;
    }).join('');
    const tail = r.verified
      ? '同 seed 逐位一致，才算「可复算」——存档被手改过就在这里露馅。'
      : '本次只读存档 hash，<b>没有重算</b>。要真核一遍：<code>pangu replay &lt;world&gt;</code>，或 <code>preview --replay</code>（约两分钟）。';
    return card('可复算 · 同 seed 重放', r.verified ? (r.ok ? '逐位一致' : '对不上') : '未重算',
      `<table class="bk-tbl"><tr><th></th><th>层</th><th>seed</th><th>存档</th><th>重放</th></tr>${tr}</table>
       <div class="bk-note">${tail}</div>`);
  }

  /* ── 量纲硬域 ── */
  function cardUnits(u) {
    const rows = (u && u.rows) || [];
    if (!rows.length) return card('量纲硬域', '无', '<div class="bk-note">量纲层不可用。</div>');
    const tr = rows.map(r => {
      const short = String(r.path || '').split('.').pop();
      const col = r.got === 'hard' ? '#ffb26b' : r.got === 'soft' ? '#ffcf8a' : 'var(--ink-faint)';
      const val = (typeof r.value === 'number' && Math.abs(r.value) >= 1e6)
        ? r.value.toExponential(0) : fmt(r.value);
      return `<tr title="${esc(r.path)}">
        <td class="nm">${esc(short)}</td>
        <td class="num r">${esc(val)}</td>
        <td class="r" style="color:${col}">${esc(r.got)}${r.ok ? '' : ' ×'}</td></tr>`;
    }).join('');
    return card('量纲硬域 · 什么数会被拒', `${(u.bad || 0) === 0 ? '全部按预期' : (u.bad + ' 条不符')}`,
      `<table class="bk-tbl"><tr><th>字段</th><th class="r">给的数</th><th class="r">判定</th></tr>${tr}</table>
       <div class="bk-note">hard = 直接拒绝写盘（patch 退出码 2）；soft = 提示；ok = 放行。</div>`);
  }

  /* ── 定量体检 ── */
  function cardChecks(list, cert) {
    if (!list || !list.length) return card('定量体检', '无', '<div class="bk-note">缺数据。</div>');
    const rows = list.map(c => `<div class="chk ${c.verdict}">
        <span class="id">${esc(c.id)}</span>
        <span class="q">${esc(c.question)}<br><span style="color:var(--ink-faint)">${esc(c.note || '')}</span></span>
        <span class="v">${esc(c.verdict)}</span></div>`).join('');
    const nm = cert && cert.domains && cert.domains.not_modeled;
    const tail = nm && nm.length
      ? `<div class="bk-note"><b>没建模：</b>${esc(nm.join('；'))}</div>` : '';
    const warn = list.filter(c => c.verdict === 'warn' || c.verdict === 'fatal').length;
    return card('定量体检 · C / D', warn ? `${warn} 项要留意` : '全绿',
      `<div class="bk-checks">${rows}</div>${tail}`);
  }

  /* ── 基准偏差 ── */
  function cardBench(c) {
    const dev = (c && c.deviations) || [];
    if (!dev.length) return '';
    const tr = dev.map(x => {
      const col = x.ok ? '#7fe0a8' : (x.ok === false ? '#ffb26b' : 'var(--ink-faint)');
      return `<tr title="${esc(x.curve)}（${esc(x.unit || '')}）">
        <td style="color:${col};width:14px">${x.ok ? '✓' : (x.ok === false ? '!' : '·')}</td>
        <td class="nm">${esc(x.target || '')} · ${esc(x.curve)}</td>
        <td class="num r" style="color:var(--ink-faint)">${esc(fmt(x.reference))}<span style="font-size:9px"> ${esc(x.unit || '')}</span></td>
        <td class="num r">${esc(fmt(x.model))}<span style="font-size:9px;color:var(--ink-faint)"> ${esc(x.unit || '')}</span></td></tr>`;
    }).join('');
    const okN = dev.filter(x => x.ok).length;
    return card('基准对表 · ' + dev.length + ' 条', `${okN}/${dev.length} 达标`,
      `<div class="bk-scroll"><table class="bk-tbl">
        <tr><th></th><th>靶 · 曲线</th><th class="r">参考</th><th class="r">实测</th></tr>${tr}</table></div>
       <div class="bk-note">地球与火星是仅有的两个"知道答案"的靶；偏差表是回归网，不是宣传图。--fast 时只算火星那一条。</div>`);
  }

  function drawDonut(cert) {
    const cv = $('bk-donut');
    if (!cv || !cert || !cert.by_kind) return;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const W = 152;
    cv.width = W * dpr; cv.height = W * dpr;
    cv.style.width = W + 'px'; cv.style.height = W + 'px';
    const g = cv.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, W, W);
    const parts = KIND.map(([k, , color]) => ({ n: (cert.by_kind[k] || []).length, color }));
    const total = parts.reduce((s, p) => s + p.n, 0) || 1;
    const cx = W / 2, cy = W / 2, R = 68, r = 54, gap = 0.03;
    let a0 = -Math.PI / 2;
    parts.forEach(p => {
      const a1 = a0 + (p.n / total) * Math.PI * 2;
      if (p.n) {
        g.beginPath();
        g.arc(cx, cy, R, a0 + gap, Math.max(a0 + gap, a1 - gap));
        g.arc(cx, cy, r, Math.max(a0 + gap, a1 - gap), a0 + gap, true);
        g.closePath();
        g.fillStyle = p.color;
        g.globalAlpha = .9;
        g.fill();
        g.globalAlpha = 1;
      }
      a0 = a1;
    });
  }

  function build() {
    const d = DATA || {};
    const kn = d.kernel || null;
    const lg = d.ledger || null;
    const uq = d.uq || null;
    const ct = d.certify || null;
    const rp = d.replay || null;
    const un = d.units || null;

    const bits = [];
    if (d.fast) bits.push('--fast：内核自检与地球基准未跑');
    if (rp && !rp.verified) bits.push('重放未核（只读存档 hash）');
    bits.push('账本只报不改', '± 是敏感度不是置信区间');
    subEl.textContent = bits.join(' ｜ ');

    // 顶部徽章
    const chips = [];
    if (kn && kn.total) {
      chips.push(`<span class="chip ${kn.ok ? 'ok' : 'bad'}"><span class="dot"></span>内核 <b>${kn.passed}/${kn.total}</b></span>`);
    }
    if (lg && lg.scored) {
      const bad = (lg.bad || []).length, expl = (lg.explained || []).length;
      const cls = bad - expl === 0 ? 'ok' : 'warn';
      chips.push(`<span class="chip ${cls}"><span class="dot"></span>账本 <b>${lg.scored - bad}/${lg.scored}</b> 平</span>`);
    }
    if (ct && ct.total) {
      const cov = ct.coverage || 0;
      chips.push(`<span class="chip ${cov >= .5 ? 'ok' : cov >= .3 ? 'warn' : 'bad'}"><span class="dot"></span>算出来 <b>${Math.round(cov * 100)}%</b></span>`);
    }
    if (rp && (rp.rows || []).length) {
      const txt = rp.verified ? (rp.ok ? '可复算' : '复算对不上') : 'hash 已记录';
      const cls = rp.verified ? (rp.ok ? 'ok' : 'bad') : '';
      chips.push(`<span class="chip ${cls}"><span class="dot"></span>${txt}</span>`);
    }
    const warnN = (d.checks || []).filter(c => c.verdict === 'warn' || c.verdict === 'fatal').length;
    if ((d.checks || []).length) {
      chips.push(`<span class="chip ${warnN ? 'warn' : 'ok'}"><span class="dot"></span>` +
        (warnN ? `体检 <b>${warnN}</b> 项留意` : '体检全绿') + `</span>`);
    }
    chipsBox.innerHTML = chips.join('');

    grid.innerHTML = [
      cardCertify(ct),
      cardUq(uq),
      cardLedger(lg),
      cardKernel(kn),
      cardReplay(rp),
      cardUnits(un),
      cardChecks(d.checks, ct),
      cardBench(ct),
    ].join('');

    drawDonut(ct);

    // 内核格子：点一下看它的报告
    const tiles = Array.from(grid.querySelectorAll('.kn'));
    const pre = $('bk-pre');
    const pick = i => {
      tiles.forEach((t, j) => t.classList.toggle('sel', j === i));
      const r = (kn.rows || [])[i];
      pre.textContent = r ? r.report : '';
      pre.scrollTop = 0;
    };
    tiles.forEach((t, i) => { t.onclick = () => pick(i); });
    if (tiles.length) {
      const firstBad = (kn.rows || []).findIndex(r => !r.ok);
      pick(firstBad >= 0 ? firstBad : 0);
    }

    foot.innerHTML = '口径：<b>±</b> 是敏感度，不是置信区间（一阶线性、按独立处理，强非线性处偏低）；' +
      '<b>账本</b> 只报不改，不平点出来由你定夺；<b>覆盖率</b> 低于 30% 时，这个世界的数字大多还是「拍的」，别当模型用。';

    built = true;
  }

  function open() {
    if (!DATA) {
      const el = $('pangu-books');
      try { DATA = JSON.parse((el && el.textContent) || '{}'); } catch (e) { DATA = {}; }
    }
    if (!DATA || (!DATA.ledger && !DATA.certify && !DATA.kernel)) {
      // 没有任何账本数据：不显示这个视图
      return false;
    }
    if (!built) build();
    SURF.close();
    LIFE.close();
    if (CREATURE) CREATURE.close();
    view.classList.add('show');
    UI.mark('v-books');
    return true;
  }

  function close() { view.classList.remove('show'); }

  return { open, close, get ready() { return built; } };
})();

/* ══════════════════════════════════════════════════════════════

if (!THREE) {
