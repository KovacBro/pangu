<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>__PANGU_TITLE__ · 盘古 3D 预览</title>
<style>
  :root{
    --ink:#e8eef7;
    --ink-dim:#8fa0b8;
    --ink-faint:#5a6a80;
    --line:rgba(140,170,210,.16);
    --glass:rgba(10,16,28,.62);
    --glass-hi:rgba(20,30,48,.78);
    --accent:#ffcf8a;
    --accent2:#7fb6d9;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#04060c;color:var(--ink);font-family:var(--font)}
  #scene{display:block;width:100%;height:100%;cursor:grab}
  #scene.dragging{cursor:grabbing}

  .fade-in{animation:fade .9s cubic-bezier(.22,.9,.28,1) both}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* ── 左上 · 世界标头 ── */
  #hud{position:fixed;top:0;left:0;padding:26px 30px;pointer-events:none;max-width:min(46vw,520px)}
  #hud .kicker{font-size:10.5px;letter-spacing:.34em;color:var(--ink-faint);text-transform:uppercase;margin-bottom:12px}
  #hud h1{margin:0;font-size:clamp(24px,3.2vw,40px);font-weight:600;letter-spacing:.14em;line-height:1.16;
          text-shadow:0 2px 26px rgba(0,0,0,.85)}
  #hud .sub{margin-top:9px;font-size:12.5px;letter-spacing:.22em;color:var(--accent);opacity:.92}
  #hud .tag{margin-top:15px;font-size:13px;line-height:1.85;color:var(--ink-dim);max-width:34em}
  #hud .tag::before{content:"";display:inline-block;width:16px;height:1px;background:var(--accent);
                    vertical-align:middle;margin-right:9px;opacity:.7}

  /* ── 右上 · 评分 ── */
  #score{position:fixed;top:26px;right:30px;text-align:right;pointer-events:none}
  #score .n{font-size:30px;font-weight:300;letter-spacing:.02em;line-height:1;
            font-variant-numeric:tabular-nums}
  #score .n small{font-size:12px;color:var(--ink-faint);margin-left:2px}
  #score .g{font-size:10px;letter-spacing:.28em;color:var(--ink-faint);margin-top:7px}
  #score .bar{width:92px;height:2px;background:rgba(255,255,255,.09);margin:11px 0 0 auto;overflow:hidden}
  #score .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));
                width:__PANGU_SCORE__%;transition:width 1.2s cubic-bezier(.22,.9,.28,1)}

  /* ── 右侧 · 天体列表 ── */
  #legend{position:fixed;right:30px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;
          gap:7px;align-items:flex-end;max-height:56vh;overflow-y:auto;scrollbar-width:none}
  #legend::-webkit-scrollbar{display:none}
  .lg{display:flex;align-items:center;gap:9px;padding:6px 11px;border-radius:20px;
      background:var(--glass);border:1px solid transparent;cursor:pointer;
      transition:.28s cubic-bezier(.22,.9,.28,1);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
      font-size:11.5px;letter-spacing:.06em;color:var(--ink-dim);white-space:nowrap}
  .lg:hover{background:var(--glass-hi);color:var(--ink);border-color:var(--line)}
  .lg.on{color:var(--ink);border-color:rgba(255,207,138,.42);background:rgba(40,32,20,.7)}
  .lg .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 9px currentColor}
  .lg .ty{font-size:9px;color:var(--ink-faint);letter-spacing:.14em}

  /* ── 底部 · 控制条 ── */
  #dock{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);display:flex;align-items:center;
        gap:3px;padding:7px;border-radius:14px;background:var(--glass);border:1px solid var(--line);
        backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
        box-shadow:0 14px 44px rgba(0,0,0,.55)}
  #dock button{appearance:none;border:0;background:transparent;color:var(--ink-dim);font-family:var(--font);
        font-size:11.5px;letter-spacing:.1em;padding:8px 13px;border-radius:9px;cursor:pointer;transition:.2s}
  #dock button:hover{background:rgba(255,255,255,.07);color:var(--ink)}
  #dock button.on{background:rgba(255,207,138,.15);color:var(--accent)}
  #dock .sep{width:1px;height:18px;background:var(--line);margin:0 4px}
  #dock .spd{font-variant-numeric:tabular-nums;min-width:44px}

  /* ── 右下 · 声明 ── */
  #note{position:fixed;right:30px;bottom:28px;font-size:10px;color:var(--ink-faint);
        letter-spacing:.08em;text-align:right;line-height:1.7;pointer-events:none}
  #note b{color:var(--ink-dim);font-weight:500}

  /* ── 加载 / 降级 ── */
  #boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
        gap:22px;background:#04060c;z-index:50;transition:opacity .8s,visibility 0s .8s}
  #boot .ring{width:44px;height:44px;border:1px solid rgba(255,207,138,.16);border-top-color:var(--accent);
              border-radius:50%;animation:spin 1.1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #boot .t{font-size:11px;letter-spacing:.34em;color:var(--ink-faint)}
  #boot.done{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .8s,visibility 0s .8s}

  #fallback{position:fixed;inset:0;z-index:60;background:#04060c;overflow-y:auto;padding:56px 8vw;display:none}
  #fallback.show{display:block}
  #fallback h2{font-size:22px;letter-spacing:.16em;margin:0 0 10px}
  #fallback .warn{color:#ffb26b;font-size:12.5px;line-height:1.9;border-left:2px solid #ffb26b;
                  padding-left:14px;margin-bottom:30px;max-width:60ch}
  #fallback table{width:100%;max-width:760px;border-collapse:collapse;font-size:12.5px;margin:12px 0 28px}
  #fallback th,#fallback td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line)}
  #fallback th{color:var(--ink-faint);font-weight:500;letter-spacing:.1em;font-size:10.5px}
  #fallback ul{max-width:760px;line-height:2;font-size:13px;color:var(--ink-dim);padding-left:20px}
  #fallback .fb-go{appearance:none;border:1px solid var(--line);background:var(--glass-hi);
                   color:var(--ink);font-family:var(--font);font-size:12px;letter-spacing:.1em;
                   padding:9px 16px;border-radius:9px;cursor:pointer;transition:.2s}
  #fallback .fb-go:hover{border-color:rgba(255,207,138,.42);color:var(--accent)}

  @media (max-width:760px){
    #hud{padding:18px 18px;max-width:78vw}
    #hud .tag{display:none}
    #score{top:18px;right:18px}
    #score .n{font-size:22px}
    #legend{right:14px;gap:5px;max-height:40vh}
    .lg{padding:5px 9px;font-size:10.5px}
    .lg .ty{display:none}
    #dock{bottom:14px;padding:5px}
    #dock button{padding:7px 9px;font-size:10.5px;letter-spacing:.04em}
    #note{display:none}
  }

  /* ══ 1.1 · 地面视角 / 演化视图 ══ */
  .overlay{position:fixed;inset:0 0 76px 0;z-index:8;display:none;background:#04060c}
  .overlay.show{display:block}
  #surface-canvas{display:block;width:100%;height:100%}
  .ov-hint{position:absolute;left:26px;top:22px;font-size:11px;letter-spacing:.14em;
           color:var(--ink-faint);pointer-events:none;line-height:2}
  .ov-hint b{color:var(--accent);font-weight:500}
  .ov-hint .warn{color:#ffb26b}
  .ov-ctrl{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;
           gap:4px;align-items:center;padding:6px;border-radius:12px;background:var(--glass);
           border:1px solid var(--line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
  .ov-ctrl button{appearance:none;border:0;background:transparent;color:var(--ink-dim);
                  font-family:var(--font);font-size:11px;letter-spacing:.06em;
                  padding:6px 11px;border-radius:8px;cursor:pointer;transition:.2s}
  .ov-ctrl button:hover{background:rgba(255,255,255,.07);color:var(--ink)}
  .ov-ctrl button.on{background:rgba(255,207,138,.15);color:var(--accent)}
  .ov-ctrl input[type=range]{width:170px;accent-color:#ffcf8a;background:transparent}
  .ov-ctrl .read{font-size:11px;color:var(--ink-faint);min-width:82px;text-align:right;
                 font-variant-numeric:tabular-nums}

  #life-view{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr) minmax(0,.82fr);
             grid-template-rows:minmax(0,1fr) auto;gap:12px;padding:16px}
  #life-view.show{display:grid}
  .life-panel{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;
              background:rgba(8,12,20,.72);display:flex;flex-direction:column;min-height:0}
  .life-panel h3{margin:0;padding:9px 12px;font-size:10px;letter-spacing:.2em;
                 color:var(--ink-faint);font-weight:500;border-bottom:1px solid var(--line);flex:0 0 auto}
  .life-panel canvas{display:block;width:100%;flex:1 1 auto;min-height:0;
                     image-rendering:pixelated}
  #life-probe{overflow-y:auto;padding:6px 12px 12px;scrollbar-width:thin}
  .probe-row{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;
             padding:5px 0;border-bottom:1px dashed rgba(140,170,210,.1);color:var(--ink-dim)}
  .probe-row b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
  .probe-row.bad b{color:#ff7a6b}
  .probe-row.good b{color:#7fe0a8}
  .probe-flag{margin-top:9px;font-size:11px;line-height:1.75;color:#ffb26b}
  #life-ctrl{grid-column:1/-1;position:static;transform:none;justify-self:center}

  /* ══ 1.1.4 · 今夜星图卡片（Canvas 2D，不改默认 3D 视图）══ */
  #sky-card{position:absolute;left:18px;bottom:18px;width:206px;padding:9px 10px 8px;
            border:1px solid var(--line);border-radius:12px;background:var(--glass);
            backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);z-index:6;
            transition:opacity .3s}
  #sky-card.hide{opacity:0;pointer-events:none}
  #sky-card h3{margin:0 0 6px;font-size:9.5px;letter-spacing:.2em;color:var(--ink-faint);
               font-weight:500;display:flex;justify-content:space-between}
  #sky-card h3 b{color:var(--accent);font-weight:500;letter-spacing:.06em}
  #sky-canvas{display:block;width:186px;height:186px;border-radius:50%;
              background:radial-gradient(circle at 50% 50%,#05070d 40%,#0a1220 100%)}
  #sky-ctrl{display:flex;align-items:center;gap:6px;margin-top:6px}
  #sky-ctrl input{flex:1 1 auto;width:0;accent-color:#ffcf8a;background:transparent}
  #sky-read{font-size:10px;color:var(--ink-faint);font-variant-numeric:tabular-nums;
            min-width:64px;text-align:right}

  /* ══ 1.1.2 · 生物视角 / 虚构元素字形 ══ */
  #creature-canvas{display:block;width:100%;height:100%}
  #cr-card{position:absolute;right:24px;top:22px;width:min(330px,44vw);padding:14px 16px;
           border:1px solid var(--line);border-radius:14px;background:rgba(6,10,18,.74);
           backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);pointer-events:none}
  #cr-card h3{margin:0 0 3px;font-size:15px;letter-spacing:.1em;color:var(--ink);font-weight:600}
  #cr-card .cr-sub{font-size:10.5px;letter-spacing:.1em;color:var(--ink-faint);margin-bottom:9px}
  .cr-row{display:flex;justify-content:space-between;gap:10px;font-size:11px;color:var(--ink-dim);
          padding:2px 0;font-variant-numeric:tabular-nums}
  .cr-row b{color:var(--accent);font-weight:500}
  .cr-cap{font-size:9.5px;letter-spacing:.2em;color:#5a6a80;margin:10px 0 3px}
  .cr-bar{height:4px;border-radius:2px;background:rgba(255,255,255,.08);margin:2px 0 6px;overflow:hidden}
  .cr-bar i{display:block;height:100%;background:linear-gradient(90deg,#7fb2ff,#ffcf8a)}
  .cr-els{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .fe{display:inline-flex;align-items:center;gap:6px;padding:4px 8px 4px 5px;border-radius:9px;
      background:rgba(255,255,255,.05);border:1px solid rgba(140,170,210,.16);
      font-size:10.5px;color:var(--ink-dim)}
  .fe b{color:var(--ink);font-weight:500}
  .feglyph{position:relative;display:inline-block;width:1.55em;height:1.55em;line-height:1;
           font-size:14px;color:#ffdca8;flex:0 0 auto}
  .feglyph .gqi{position:absolute;left:-.02em;top:.04em;font-size:1.12em;line-height:1}
  .feglyph .gin{position:absolute;left:.44em;top:.34em;font-size:.6em;line-height:1;
                display:flex;align-items:baseline;letter-spacing:-.04em}
  .feglyph .gin .gjin{font-size:.94em}
  .sp-select{appearance:none;background:rgba(255,255,255,.06);border:1px solid var(--line);
             color:var(--ink);border-radius:8px;padding:6px 9px;
             font-family:var(--font);font-size:11px;letter-spacing:.04em}

  /* ══ 1.1.5 · 账本：定量体检 / 误差 / 守恒 / 内核 / 重放 ══ */
  #books-view{display:none;overflow-y:auto;overscroll-behavior:contain}
  #books-view.show{display:block}
  #books-view::-webkit-scrollbar{width:9px}
  #books-view::-webkit-scrollbar-thumb{background:rgba(140,170,210,.22);border-radius:9px}
  .bk-wrap{max-width:1240px;margin:0 auto;padding:24px 24px 88px}
  .bk-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px;margin-bottom:16px}
  .bk-head .t{font-size:10px;letter-spacing:.32em;color:var(--ink-faint);text-transform:uppercase}
  .bk-head h2{margin:7px 0 0;font-size:22px;font-weight:600;letter-spacing:.1em}
  .bk-head .sub{margin-top:6px;font-size:11.5px;color:var(--ink-dim);letter-spacing:.06em}
  .bk-chips{display:flex;flex-wrap:wrap;gap:7px;margin-left:auto}
  .chip{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:20px;
        border:1px solid var(--line);background:var(--glass);font-size:11px;color:var(--ink-dim);
        letter-spacing:.05em;font-variant-numeric:tabular-nums;white-space:nowrap}
  .chip b{color:var(--ink);font-weight:500}
  .chip.ok{border-color:rgba(127,224,168,.32);color:#9fe9bf}
  .chip.warn{border-color:rgba(255,178,107,.34);color:#ffc38a}
  .chip.bad{border-color:rgba(255,122,107,.38);color:#ff9d92}
  .chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}

  .bk-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;align-items:start}
  .bk-card{border:1px solid var(--line);border-radius:14px;background:rgba(8,12,20,.74);overflow:hidden}
  .bk-card.span2{grid-column:span 2}
  .bk-card h3{margin:0;padding:10px 14px;font-size:9.5px;letter-spacing:.22em;color:var(--ink-faint);
              font-weight:500;border-bottom:1px solid var(--line);display:flex;
              justify-content:space-between;gap:10px;align-items:baseline}
  .bk-card h3 em{font-style:normal;letter-spacing:.04em;color:var(--ink-faint);font-size:10px;
                 font-variant-numeric:tabular-nums;white-space:nowrap}
  .bk-body{padding:13px 14px 15px}

  .bk-donut{position:relative;width:152px;height:152px;margin:2px auto 12px}
  .bk-donut canvas{display:block}
  .bk-donut .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
                 justify-content:center;pointer-events:none}
  .bk-donut .mid b{font-size:26px;font-weight:300;letter-spacing:.01em;font-variant-numeric:tabular-nums}
  .bk-donut .mid span{font-size:9px;letter-spacing:.22em;color:var(--ink-faint);margin-top:5px}
  .bk-stack{display:flex;height:7px;border-radius:5px;overflow:hidden;background:rgba(255,255,255,.06);margin:0 0 10px}
  .bk-stack i{height:100%;display:block}
  .bk-legend{display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--ink-dim)}
  .bk-legend .row{display:flex;align-items:center;gap:8px}
  .bk-legend .sw{width:8px;height:8px;border-radius:2px;flex:0 0 auto}
  .bk-legend .n{margin-left:auto;color:var(--ink);font-variant-numeric:tabular-nums}

  .bk-tbl{width:100%;border-collapse:collapse;font-size:11.5px}
  .bk-tbl th{text-align:left;font-weight:500;font-size:9px;letter-spacing:.16em;color:var(--ink-faint);
             padding:0 8px 7px 0;white-space:nowrap}
  .bk-tbl th.r,.bk-tbl td.r{text-align:right}
  .bk-tbl td{padding:6px 8px 6px 0;border-top:1px solid rgba(140,170,210,.09);color:var(--ink-dim);
             vertical-align:middle}
  .bk-tbl tr:first-child td{border-top:0}
  .bk-tbl td.num{font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap}
  .bk-tbl td.nm{color:var(--ink)}

  .bk-bar{position:relative;height:5px;border-radius:3px;background:rgba(255,255,255,.07);min-width:70px}
  .bk-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
  .bk-bar i.ok{background:linear-gradient(90deg,#3f9d70,#7fe0a8)}
  .bk-bar i.warn{background:linear-gradient(90deg,#c07f36,#ffb26b)}
  .bk-bar i.info{background:linear-gradient(90deg,#41536b,#7b8ea8)}
  .bk-bar i.skip{background:rgba(255,255,255,.14)}
  .bk-bar u{position:absolute;top:-2px;bottom:-2px;width:1px;background:rgba(232,238,247,.55)}

  .bk-kern{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .kn{position:relative;padding:9px 10px;border:1px solid var(--line);border-radius:10px;
      background:rgba(255,255,255,.03);cursor:pointer;transition:.18s;text-align:left;
      font-family:var(--font);color:var(--ink-dim)}
  .kn:hover{background:rgba(255,207,138,.07);border-color:rgba(255,207,138,.28)}
  .kn.sel{border-color:rgba(255,207,138,.55);background:rgba(255,207,138,.1)}
  .kn .m{font-size:11.5px;color:var(--ink);letter-spacing:.03em;padding-right:14px}
  .kn .s{font-size:9px;color:var(--ink-faint);margin-top:4px;letter-spacing:.14em}
  .kn .f{position:absolute;right:8px;top:7px;font-size:11px}
  .kn.ok .f{color:#7fe0a8}
  .kn.bad .f{color:#ff7a6b}
  .bk-pre{margin:10px 0 0;padding:10px 12px;border-radius:9px;background:rgba(0,0,0,.34);
          border:1px solid rgba(140,170,210,.1);font-size:10.5px;line-height:1.85;
          color:var(--ink-dim);white-space:pre-wrap;max-height:180px;overflow:auto;
          font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .bk-pre::-webkit-scrollbar{width:7px}
  .bk-pre::-webkit-scrollbar-thumb{background:rgba(140,170,210,.2);border-radius:7px}

  .bk-checks{display:flex;flex-direction:column;gap:6px}
  .chk{display:flex;gap:9px;padding:7px 10px;border-radius:9px;background:rgba(255,255,255,.028);
       border-left:2px solid var(--line);font-size:11px;color:var(--ink-dim);line-height:1.65}
  .chk.pass{border-left-color:#5fc98f}
  .chk.warn{border-left-color:#ffb26b}
  .chk.fatal{border-left-color:#ff7a6b}
  .chk.skip{border-left-color:#41536b}
  .chk .id{color:var(--ink);font-variant-numeric:tabular-nums;flex:0 0 auto}
  .chk .q{flex:1 1 auto}
  .chk .v{flex:0 0 auto;font-size:9.5px;letter-spacing:.14em;color:var(--ink-faint)}
  .chk.pass .v{color:#7fe0a8}
  .chk.warn .v{color:#ffb26b}
  .chk.fatal .v{color:#ff7a6b}

  .bk-note{margin-top:11px;font-size:10.5px;line-height:1.85;color:var(--ink-faint)}
  .bk-note b{color:var(--ink-dim);font-weight:500}
  .bk-scroll{max-height:236px;overflow-y:auto;padding-right:4px}
  .bk-scroll::-webkit-scrollbar{width:7px}
  .bk-scroll::-webkit-scrollbar-thumb{background:rgba(140,170,210,.2);border-radius:7px}
  .bk-flag{margin-top:9px;font-size:10.5px;line-height:1.8;color:#ffb26b}

  @media (max-width:900px){
    .bk-grid{grid-template-columns:1fr}
    .bk-card.span2{grid-column:auto}
    .bk-wrap{padding:16px 14px 80px}
    .bk-chips{margin-left:0}
  }

  @media (max-width:900px){
    #life-view{grid-template-columns:1fr;grid-template-rows:1.3fr 1fr auto auto;overflow-y:auto}
    .ov-hint{font-size:10px}
    #cr-card{left:12px;right:12px;top:auto;bottom:74px;width:auto;padding:10px 12px}
    #cr-card .cr-cap,#cr-card .cr-els{display:none}
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div id="hud" class="fade-in">
