function boot(THREE) {

  /* ── 渲染器 ─────────────────────────────────────────────── */
  const canvas = $('scene');
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
  } catch (e) {
    showFallback('此浏览器不支持 WebGL。');
    return;
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  if ('outputColorSpace' in renderer) renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.NoToneMapping;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.5, 6000);

  /* ── 星空 ───────────────────────────────────────────────── */
  (function buildStars() {
    const N = 5000, pos = new Float32Array(N * 3), col = new Float32Array(N * 3);
    const c = new THREE.Color();
    for (let i = 0; i < N; i++) {
      const u = Math.random() * 2 - 1;
      const th = Math.random() * Math.PI * 2;
      const r = Math.sqrt(1 - u * u);
      const R = 900 + Math.random() * 260;
      pos[i * 3]     = Math.cos(th) * r * R;
      pos[i * 3 + 1] = u * R;
      pos[i * 3 + 2] = Math.sin(th) * r * R;
      const w = 0.55 + Math.random() * 0.45;
      c.setRGB(w, w * (0.94 + Math.random() * 0.06), w * (0.88 + Math.random() * 0.12));
      col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setAttribute('color', new THREE.BufferAttribute(col, 3));
    const m = new THREE.PointsMaterial({
      size: 1.7, sizeAttenuation: false, vertexColors: true,
      transparent: true, opacity: 0.9, depthWrite: false
    });
    scene.add(new THREE.Points(g, m));
  })();

  /* ── 辉光贴图（程序生成，零外部资源） ───────────────────── */
  const GLOW_TEX = (() => {
    const S = 256, cv = document.createElement('canvas');
    cv.width = cv.height = S;
    const ctx = cv.getContext('2d');
    const g = ctx.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
    g.addColorStop(0.00, 'rgba(255,255,255,1)');
    g.addColorStop(0.14, 'rgba(255,255,255,0.72)');
    g.addColorStop(0.32, 'rgba(255,255,255,0.22)');
    g.addColorStop(0.62, 'rgba(255,255,255,0.05)');
    g.addColorStop(1.00, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, S, S);
    const t = new THREE.CanvasTexture(cv);
    if ('colorSpace' in t) t.colorSpace = THREE.SRGBColorSpace;
    return t;
  })();

  /* ── GLSL 公共噪声 ──────────────────────────────────────── */
  const NOISE = `
vec3 mod289(vec3 x){ return x - floor(x*(1.0/289.0))*289.0; }
vec4 mod289(vec4 x){ return x - floor(x*(1.0/289.0))*289.0; }
vec4 permute(vec4 x){ return mod289(((x*34.0)+1.0)*x); }
vec4 taylorInvSqrt(vec4 r){ return 1.79284291400159 - 0.85373472095314*r; }
float snoise(vec3 v){
  const vec2 C = vec2(1.0/6.0, 1.0/3.0);
  const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
  vec3 i  = floor(v + dot(v, C.yyy));
  vec3 x0 = v - i + dot(i, C.xxx);
  vec3 g = step(x0.yzx, x0.xyz);
  vec3 l = 1.0 - g;
  vec3 i1 = min(g.xyz, l.zxy);
  vec3 i2 = max(g.xyz, l.zxy);
  vec3 x1 = x0 - i1 + C.xxx;
  vec3 x2 = x0 - i2 + C.yyy;
  vec3 x3 = x0 - D.yyy;
  i = mod289(i);
  vec4 p = permute(permute(permute(
       i.z + vec4(0.0, i1.z, i2.z, 1.0))
     + i.y + vec4(0.0, i1.y, i2.y, 1.0))
     + i.x + vec4(0.0, i1.x, i2.x, 1.0));
  float n_ = 0.142857142857;
  vec3 ns = n_ * D.wyz - D.xzx;
  vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
  vec4 x_ = floor(j * ns.z);
  vec4 y_ = floor(j - 7.0 * x_);
  vec4 x = x_ * ns.x + ns.yyyy;
  vec4 y = y_ * ns.x + ns.yyyy;
  vec4 h = 1.0 - abs(x) - abs(y);
  vec4 b0 = vec4(x.xy, y.xy);
  vec4 b1 = vec4(x.zw, y.zw);
  vec4 s0 = floor(b0)*2.0 + 1.0;
  vec4 s1 = floor(b1)*2.0 + 1.0;
  vec4 sh = -step(h, vec4(0.0));
  vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
  vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
  vec3 p0 = vec3(a0.xy, h.x);
  vec3 p1 = vec3(a0.zw, h.y);
  vec3 p2 = vec3(a1.xy, h.z);
  vec3 p3 = vec3(a1.zw, h.w);
  vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
  p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
  vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
  m = m * m;
  return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
}
float fbm(vec3 p, int oct){
  float a = 0.5, f = 1.0, s = 0.0;
  for (int i = 0; i < 6; i++){
    if (i >= oct) break;
    s += a * snoise(p * f);
    f *= 2.02; a *= 0.5;
  }
  return s;
}
float ridged(vec3 p){
  float n = snoise(p);
  return (1.0 - abs(n)) * (1.0 - abs(n)) - 0.5;
}
`;

  /* ── 行星材质 ───────────────────────────────────────────── */
  const SUN_MAX = 4;
  const allSunPos = [], allSunColor = [], allSunPower = [];

  function makePlanetMaterial(body, idx) {
    const biomes = (body.biomes || []).filter(b => b && b.color).slice(0, 8);
    const colors = [], stops = [];
    if (biomes.length) {
      for (const b of biomes) {
        colors.push(new THREE.Color(b.color));
        stops.push(clamp(num(b.elevation, 0), 0, 1));
      }
      stops[0] = 0;
    } else {
      colors.push(new THREE.Color('#6d7c72'));
      stops.push(0);
    }
    while (colors.length < 8) { colors.push(colors[colors.length - 1].clone()); stops.push(1.0); }
    while (stops.length < 8) { stops.push(1.0); }

    const atm = body.atmosphere || {};
    const polar = body.polar_color ? new THREE.Color(body.polar_color) : new THREE.Color('#dfe9f5');
    const seaLevel = clamp(num(body.sea_level, 0.42), 0, 1);

    return new THREE.ShaderMaterial({
      uniforms: {
        uSunPos:    { value: allSunPos.length ? allSunPos : [new THREE.Vector3(1, 0, 0)] },
        uSunColor:  { value: allSunColor.length ? allSunColor : [new THREE.Color('#ffffff')] },
        uSunPower:  { value: allSunPower.length ? allSunPower : [1.0] },
        uSunCount: { value: SUN_COUNT },
        uBiomeColors: { value: colors },
        uBiomeStops:  { value: stops },
        uBiomeCount:  { value: Math.max(1, Math.min(8, biomes.length || 1)) },
        uSeaLevel:  { value: seaLevel },
        uPolarColor:{ value: polar },
        uPolarAmt:  { value: clamp(num(body.polar_amount, 0.55), 0, 1) },
        uAmbient:   { value: new THREE.Color('#0b1220') },
        uSeed:      { value: idx * 37.13 + 11.7 },
        uTime:      { value: 0 }
      },
      vertexShader: `
        varying vec3 vObj;
        varying vec3 vN;
        varying vec3 vW;
        void main(){
          vObj = position;
          vN = normalize(mat3(modelMatrix) * normal);
          vec4 wp = modelMatrix * vec4(position, 1.0);
          vW = wp.xyz;
          gl_Position = projectionMatrix * viewMatrix * wp;
        }
      `,
      fragmentShader: NOISE + `
        uniform vec3  uSunPos[${SUN_MAX}];
        uniform vec3  uSunColor[${SUN_MAX}];
        uniform float uSunPower[${SUN_MAX}];
        uniform int   uSunCount;
        uniform vec3  uBiomeColors[8];
        uniform float uBiomeStops[8];
        uniform int   uBiomeCount;
        uniform float uSeaLevel;
        uniform vec3  uPolarColor;
        uniform float uPolarAmt;
        uniform vec3  uAmbient;
        uniform float uSeed;
        uniform float uTime;
        varying vec3 vObj;
        varying vec3 vN;
        varying vec3 vW;

        void main(){
          vec3 p = normalize(vObj);
          /* 双层地形：低频定大陆轮廓，高频只做细节，避免「迷彩」感 */
          float cont   = fbm(p * 1.65 + uSeed, 4) * 0.5 + 0.5;
          float detail = fbm(p * 5.20 + uSeed * 2.3, 3) * 0.5 + 0.5;
          float ridge  = ridged(p * 8.0 + uSeed * 1.7);
          float h = cont * 0.74 + detail * 0.26 + ridge * 0.09;
          h = clamp(h * 1.38 - 0.20, 0.0, 1.0);

          vec3 col = uBiomeColors[0];
          for (int i = 1; i < 8; i++){
            if (i >= uBiomeCount) break;
            col = mix(col, uBiomeColors[i], smoothstep(uBiomeStops[i] - 0.07, uBiomeStops[i] + 0.07, h));
          }

          /* 极冠：纬度 + 高度扰动，避免生硬的圆环 */
          float lat = abs(p.y);
          float cap = smoothstep(0.74, 0.965, lat + (h - 0.5) * 0.22) * uPolarAmt;
          col = mix(col, uPolarColor, cap);

          /* 海洋：低洼处压暗并加蓝 */
          float sea = smoothstep(uSeaLevel + 0.02, uSeaLevel - 0.06, h);
          col = mix(col, col * vec3(0.55, 0.72, 1.05), sea * 0.85);

          vec3 N = normalize(vN);
          vec3 lit = vec3(0.0);
          for (int i = 0; i < ${SUN_MAX}; i++){
            if (i >= uSunCount) break;
            vec3 L = normalize(uSunPos[i] - vW);
            float d = max(dot(N, L), 0.0);
            lit += uSunColor[i] * uSunPower[i] * (d * 0.9 + d * d * 0.14);
          }

          vec3 outc = col * (lit + uAmbient);

          /* 海面镜面高光（双光源各出一道，这正是「双日双影」的视觉根源） */
          vec3 V = normalize(cameraPosition - vW);
          for (int i = 0; i < ${SUN_MAX}; i++){
            if (i >= uSunCount) break;
            vec3 L = normalize(uSunPos[i] - vW);
            vec3 H = normalize(L + V);
            float spec = pow(max(dot(N, H), 0.0), 42.0) * sea * 0.55;
            outc += uSunColor[i] * spec * uSunPower[i];
          }

          gl_FragColor = vec4(outc, 1.0);
        }
      `
    });
  }

  /* ── 云层 ───────────────────────────────────────────────── */
  function makeCloudMaterial(idx) {
    return new THREE.ShaderMaterial({
      uniforms: {
        uSunPos:   { value: allSunPos.length ? allSunPos : [new THREE.Vector3(1, 0, 0)] },
        uSunColor: { value: allSunColor.length ? allSunColor : [new THREE.Color('#ffffff')] },
        uSunPower: { value: allSunPower.length ? allSunPower : [1.0] },
        uSunCount: { value: SUN_COUNT },
        uSeed:     { value: idx * 61.7 + 3.3 },
        uTime:     { value: 0 },
        uOpacity:  { value: 0.62 }
      },
      vertexShader: `
        varying vec3 vObj; varying vec3 vN; varying vec3 vW;
        void main(){
          vObj = position;
          vN = normalize(mat3(modelMatrix) * normal);
          vec4 wp = modelMatrix * vec4(position, 1.0);
          vW = wp.xyz;
          gl_Position = projectionMatrix * viewMatrix * wp;
        }
      `,
      fragmentShader: NOISE + `
        uniform vec3  uSunPos[${SUN_MAX}];
        uniform vec3  uSunColor[${SUN_MAX}];
        uniform float uSunPower[${SUN_MAX}];
        uniform int   uSunCount;
        uniform float uSeed;
        uniform float uTime;
        uniform float uOpacity;
        varying vec3 vObj; varying vec3 vN; varying vec3 vW;
        void main(){
          vec3 p = normalize(vObj);
          float n = fbm(p * 3.1 + uSeed + vec3(uTime * 0.008), 4) * 0.5 + 0.5;
          float a = smoothstep(0.52, 0.78, n);
          a *= uOpacity;
          if (a < 0.012) discard;

          vec3 N = normalize(vN);
          float lit = 0.0;
          for (int i = 0; i < ${SUN_MAX}; i++){
            if (i >= uSunCount) break;
            vec3 L = normalize(uSunPos[i] - vW);
            lit += max(dot(N, L), 0.0) * uSunPower[i];
          }
          lit = clamp(lit, 0.0, 1.6);
          vec3 shade = mix(vec3(0.16, 0.20, 0.30), vec3(1.0, 0.99, 0.96), clamp(lit, 0.0, 1.0));
          gl_FragColor = vec4(shade, a);
        }
      `,
      transparent: true,
      depthWrite: false,
      side: THREE.FrontSide
    });
  }

  /* ── 大气辉光 ───────────────────────────────────────────── */
  function makeAtmoMaterial(color, strength) {
    return new THREE.ShaderMaterial({
      uniforms: {
        uColor:    { value: new THREE.Color(color) },
        uStrength: { value: strength },
        uSunPos:   { value: allSunPos.length ? allSunPos : [new THREE.Vector3(1, 0, 0)] },
        uSunPower: { value: allSunPower.length ? allSunPower : [1.0] },
        uSunCount: { value: SUN_COUNT }
      },
      vertexShader: `
        varying vec3 vN; varying vec3 vW;
        void main(){
          vN = normalize(mat3(modelMatrix) * normal);
          vec4 wp = modelMatrix * vec4(position, 1.0);
          vW = wp.xyz;
          gl_Position = projectionMatrix * viewMatrix * wp;
        }
      `,
      fragmentShader: `
        uniform vec3  uColor;
        uniform float uStrength;
        uniform vec3  uSunPos[${SUN_MAX}];
        uniform float uSunPower[${SUN_MAX}];
        uniform int   uSunCount;
        varying vec3 vN; varying vec3 vW;
        void main(){
          vec3 N = normalize(vN);
          vec3 V = normalize(cameraPosition - vW);
          float rim = pow(1.0 - abs(dot(N, V)), 2.8);
          float lit = 0.0;
          for (int i = 0; i < ${SUN_MAX}; i++){
            if (i >= uSunCount) break;
            vec3 L = normalize(uSunPos[i] - vW);
            lit += max(dot(N, L), 0.0) * uSunPower[i];
          }
          lit = clamp(lit, 0.0, 1.0);
          gl_FragColor = vec4(uColor, rim * uStrength * (0.16 + 0.84 * lit));
        }
      `,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      side: THREE.BackSide
    });
  }

  /* ── 场景装配 ───────────────────────────────────────────── */
  const orbitRoot = new THREE.Group();
  scene.add(orbitRoot);

  const pickables = [];          // 可点击对象
  const nodes = {};              // id -> {group, body, kind}
  const orbitLines = [];
  const ambient = new THREE.AmbientLight(0x223044, 1.0);
  scene.add(ambient);

  /* 恒星 */
  const sunPositionsWorld = [];
  const SUN_COUNT = Math.max(1, IS_STARS.length);
  const L_TOT = IS_STARS.reduce((a, s) => a + num(s.luminosity_solar, 1), 0) || 1;
  IS_STARS.forEach((s, i) => {
    const R = visStarRadius(s);
    const g = new THREE.Group();
    const col = new THREE.Color(starColor(s));

    const core = new THREE.Mesh(
      new THREE.SphereGeometry(R, 40, 28),
      new THREE.MeshBasicMaterial({ color: col })
    );
    core.userData.pick = { kind: 'star', id: s.id || ('star' + i), name: s.name || ('恒星' + i), body: s };
    g.add(core);
    pickables.push(core);

    // 两层辉光
    const glow1 = new THREE.Sprite(new THREE.SpriteMaterial({
      map: GLOW_TEX, color: col, transparent: true,
      blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.92
    }));
    glow1.scale.setScalar(R * 7.0);
    g.add(glow1);

    const glow2 = new THREE.Sprite(new THREE.SpriteMaterial({
      map: GLOW_TEX, color: col, transparent: true,
      blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.26
    }));
    glow2.scale.setScalar(R * 17.0);
    g.add(glow2);

    // 光源（供卫星/环等标准材质使用）
    const lum = num(s.luminosity_solar, 1);
    const power = clamp(0.85 * Math.pow(lum / L_TOT, 0.4), 0.04, 1.2);
    const L = new THREE.PointLight(col, power * 2.2, 0, 0);
    g.add(L);

    nodes[s.id || ('star' + i)] = { group: g, kind: 'star', body: s, radius: R };
    orbitRoot.add(g);

    allSunColor.push(col);
    allSunPower.push(power);
    allSunPos.push(new THREE.Vector3());   // 每帧更新
    sunPositionsWorld.push(g);
  });

  /* 无恒星时的微弱环境；并补齐 uniform 数组到编译期长度 */
  if (!IS_STARS.length) {
    allSunColor.push(new THREE.Color('#33445c'));
    allSunPower.push(0.12);
    allSunPos.push(new THREE.Vector3(0, 0, 1));
  }
  while (allSunColor.length < SUN_MAX) {
    allSunColor.push(new THREE.Color('#000000'));
    allSunPower.push(0);
    allSunPos.push(new THREE.Vector3(0, 0, 1));
  }

  /* 物体 */
  const bodyNodes = [];
  IS_BODIES.forEach((b, i) => {
    const R = visRadius(b);
    const g = new THREE.Group();

    const mat = makePlanetMaterial(b, i);
    const surface = new THREE.Mesh(new THREE.SphereGeometry(R, 72, 48), mat);
    surface.userData.pick = { kind: 'body', id: b.id || ('body' + i), name: b.name || '天体', body: b };
    g.add(surface);
    pickables.push(surface);

    // 云
    let cloud = null;
    if (b.atmosphere) {
      cloud = new THREE.Mesh(new THREE.SphereGeometry(R * 1.016, 48, 32), makeCloudMaterial(i));
      g.add(cloud);
    }

    // 大气
    let atmo = null;
    if (b.atmosphere) {
      const aCol = b.atmosphere.color || '#88bbdd';
      const press = num(b.atmosphere.surface_pressure_kpa, 100);
      const strength = clamp(0.35 + Math.log10(press + 1) * 0.55, 0.25, 1.35);
      atmo = new THREE.Mesh(new THREE.SphereGeometry(R * 1.055, 48, 32), makeAtmoMaterial(aCol, strength));
      g.add(atmo);
    }

    // 行星环
    if (b.rings) {
      const rr = b.rings;
      const inner = R * num(rr.inner_r, 1.4);
      const outer = R * num(rr.outer_r, 2.2);
      const ringGeo = new THREE.RingGeometry(inner, outer, 128, 1);
      // 修 UV，让径向贴图可读
      const pos = ringGeo.attributes.position;
      const uv = ringGeo.attributes.uv;
      const v3 = new THREE.Vector3();
      for (let k = 0; k < pos.count; k++) {
        v3.fromBufferAttribute(pos, k);
        const t = (v3.length() - inner) / Math.max(1e-6, outer - inner);
        uv.setXY(k, t, 0.5);
      }
      const ringMat = new THREE.MeshBasicMaterial({
        color: new THREE.Color(rr.color || '#c9b79a'),
        transparent: true, opacity: clamp(num(rr.opacity, 0.55), 0, 1),
        side: THREE.DoubleSide, depthWrite: false
      });
      const ring = new THREE.Mesh(ringGeo, ringMat);
      ring.rotation.x = Math.PI / 2;
      ring.rotation.z = 0.18;
      g.add(ring);
    }

    scene.add(g);
    nodes[b.id || ('body' + i)] = { group: g, kind: 'body', body: b, radius: R, surface, cloud, mat };
    bodyNodes.push({ node: nodes[b.id || ('body' + i)], data: b, index: i });
  });

  /* 轨道：先算位置关系，再画线 */
  function orbitRadius(entry) {
    const a = num(entry.orbit && entry.orbit.a_au, 0);
    return a > 0 ? a * ORBIT_SCALE : 0;
  }

  // 恒星轨道（绕质心）
  const starOrbiters = IS_STARS.map((s, i) => ({ s, i, a: orbitRadius(s), period: num(s.orbit && s.orbit.period_days, 0) }));
  const starParent = new Set(starOrbiters.map(o => String(o.s.orbit && o.s.orbit.parent || 'bary')));

  // 天体轨道：若 parent 是某天体，挂到该天体组下；否则绕质心
  bodyNodes.forEach(({ node, data }) => {
    const parentId = String((data.orbit && data.orbit.parent) || '');
    const host = nodes[parentId];
    if (host && host.kind === 'body') {
      // 卫星：挂到母星组
      let d = orbitRadius(data);
      d = Math.max(d, host.radius * 2.15);   // 防穿模
      node.orbitHost = host.group;
      node.orbitDist = d;
      node.orbitPeriod = num(data.orbit && data.orbit.period_days, 0);
      host.group.add(node.group);
      node.group.position.set(d, 0, 0);
    } else {
      orbitRoot.add(node.group);
      node.orbitHost = orbitRoot;
      node.orbitDist = orbitRadius(data);
      node.orbitPeriod = num(data.orbit && data.orbit.period_days, 0);
      node.group.position.set(node.orbitDist, 0, 0);
    }
  });

  /* 轨道线 */
  function addOrbitLine(dist, color, opacity, tilt) {
    if (!(dist > 0)) return;
    // 远处轨道（如 12 AU 的层级伴星）在系统视图里会横穿画面，按距离衰减
    const fade = clamp(120 / dist, 0.1, 1);
    const pts = [];
    for (let i = 0; i <= 220; i++) {
      const a = (i / 220) * Math.PI * 2;
      pts.push(new THREE.Vector3(Math.cos(a) * dist, 0, Math.sin(a) * dist));
    }
    const geo = new THREE.BufferGeometry().setFromPoints(pts);
    const mat = new THREE.LineBasicMaterial({
      color: new THREE.Color(color), transparent: true,
      opacity: opacity * fade, depthWrite: false
    });
    const line = new THREE.Line(geo, mat);
    if (tilt) line.rotation.x = tilt;
    orbitRoot.add(line);
    orbitLines.push(line);
  }

  starOrbiters.forEach(o => {
    if (o.a > 0) addOrbitLine(o.a, starColor(o.s), 0.26, 0);
  });
  bodyNodes.forEach(({ node, data }) => {
    if (node.orbitHost === orbitRoot && node.orbitDist > 0) {
      const tilt = num(data.orbit && data.orbit.inclination_deg, 0) * Math.PI / 180;
      addOrbitLine(node.orbitDist, data.biomes && data.biomes[0] ? data.biomes[0].color : '#7fb6d9', 0.30, tilt);
    }
  });

  /* ── 时间 ───────────────────────────────────────────────────
     真实周期比跨度过大（卫星 29 天 / 行星 356 天），直接线性映射会让
     行星几乎静止。改用平方根压缩：既保住快慢次序，又让所有运动可读。 */
  const periods = bodyNodes.map(b => b.node.orbitPeriod).filter(p => p > 0);
  const starP = starOrbiters.map(o => o.period).filter(p => p > 0);
  const REF_P = Math.min(...periods.concat(starP).concat([365])) || 365;
  const OMEGA_UNIT = (Math.PI * 2) / 12;   // 基准周期 = 12 秒一圈
  const omegaFor = P => (P > 0 ? OMEGA_UNIT * Math.sqrt(REF_P / P) : 0);

  let t = 0, playing = true, speed = 1;
  const SPEEDS = [0.25, 1, 4, 16];
  let speedIdx = 1;

  /* ── 相机控制器（自研，零 addons 依赖） ─────────────────── */
  class OrbitLite {
    constructor(cam, dom) {
      this.cam = cam; this.dom = dom;
      this.target = new THREE.Vector3();
      this.tTarget = new THREE.Vector3();
      this.theta = 0.95; this.phi = 1.15; this.radius = 90;
      this.tTheta = 0.95; this.tPhi = 1.15; this.tRadius = 90;
      this.minR = 6; this.maxR = 900;
      this.dragging = false; this.moved = 0;
      this.px = 0; this.py = 0;
      this._bind();
    }
    _bind() {
      const d = this.dom;
      d.addEventListener('pointerdown', e => {
        this.dragging = true; this.moved = 0;
        this.px = e.clientX; this.py = e.clientY;
        d.classList.add('dragging');
        d.setPointerCapture && d.setPointerCapture(e.pointerId);
      });
      d.addEventListener('pointermove', e => {
        if (!this.dragging) return;
        const dx = e.clientX - this.px, dy = e.clientY - this.py;
        this.px = e.clientX; this.py = e.clientY;
        this.moved += Math.abs(dx) + Math.abs(dy);
        this.tTheta -= dx * 0.0055;
        this.tPhi = clamp(this.tPhi - dy * 0.0050, 0.06 * Math.PI, 0.94 * Math.PI);
        this.theta = this.tTheta; this.phi = this.tPhi;   // 拖拽时立即跟手
      });
      const up = e => {
        this.dragging = false;
        d.classList.remove('dragging');
        if (e && e.pointerId != null && d.releasePointerCapture) {
          try { d.releasePointerCapture(e.pointerId); } catch (_) {}
        }
      };
      d.addEventListener('pointerup', up);
      d.addEventListener('pointercancel', up);
      d.addEventListener('wheel', e => {
        e.preventDefault();
        this.tRadius = clamp(this.tRadius * (1 + Math.sign(e.deltaY) * 0.11), this.minR, this.maxR);
      }, { passive: false });

      // 双指缩放
      let pinch = 0;
      d.addEventListener('touchmove', e => {
        if (e.touches.length === 2) {
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          const dist = Math.hypot(dx, dy);
          if (pinch) this.tRadius = clamp(this.tRadius * (pinch / dist), this.minR, this.maxR);
          pinch = dist;
        }
      }, { passive: true });
      d.addEventListener('touchend', () => { pinch = 0; });
    }
    setTarget(v, r) {
      this.tTarget.copy(v);
      if (r) this.tRadius = clamp(r, this.minR, this.maxR);
    }
    reset() {
      this.theta = this.tTheta; this.phi = this.tPhi;
      this.radius = this.tRadius;
    }
    update() {
      const k = 0.14;
      this.theta += (this.tTheta - this.theta) * k;
      this.phi += (this.tPhi - this.phi) * k;
      this.radius += (this.tRadius - this.radius) * k;
      this.target.lerp(this.tTarget, k);
      const sp = Math.sin(this.phi);
      this.cam.position.set(
        this.target.x + this.radius * sp * Math.sin(this.theta),
        this.target.y + this.radius * Math.cos(this.phi),
        this.target.z + this.radius * sp * Math.cos(this.theta)
      );
      this.cam.lookAt(this.target);
    }
  }

  const ctrl = new OrbitLite(camera, canvas);

  /* ── 视角 ───────────────────────────────────────────────── */
  const main = bodyNodes[0] || null;
  const mainDist = main ? (main.node.orbitDist || 40) : 40;
  const farDist = Math.max(
    120,
    ...bodyNodes.map(b => b.node.orbitDist || 0),
    ...starOrbiters.map(o => o.a * 2.6)
  );

  function viewSys() {
    UI.hideOverlays();
    ctrl.setTarget(new THREE.Vector3(0, 0, 0), mainDist * 2.55);
    ctrl.tPhi = 1.15; ctrl.tTheta = 0.95;
    markView('v-sys');
  }
  function viewBody() {
    if (!main) return viewSys();
    UI.hideOverlays();
    const p = new THREE.Vector3();
    main.node.group.getWorldPosition(p);
    ctrl.setTarget(p, main.node.radius * 3.6);
    // 相机移到行星的向阳面：视线偏移方向 = 从行星指向恒星（原点）
    const dir = p.clone().multiplyScalar(-1);
    if (dir.lengthSq() > 1e-6) {
      ctrl.tTheta = Math.atan2(dir.x, dir.z);
      ctrl.tPhi = 1.22;
    }
    markView('v-body');
  }
  function viewFar() {
    UI.hideOverlays();
    ctrl.setTarget(new THREE.Vector3(0, 0, 0), farDist * 1.55);
    ctrl.tPhi = 0.72; ctrl.tTheta = 0.5;
    markView('v-far');
  }
  function markView(id) {
    UI.mark(id);
  }

  /* ── 图例 ───────────────────────────────────────────────── */
  const KIND_CN = {
    planet: '行星', moon: '卫星', ring: '环', station: '空间站',
    shell: '壳世界', anomaly: '异常体', star: '恒星'
  };
  (function buildLegend() {
    const box = $('legend');
    const items = [];
    IS_STARS.forEach((s, i) => items.push({
      id: s.id || ('star' + i), name: s.name || ('恒星' + i), kind: '恒星',
      color: starColor(s), type: 'star'
    }));
    bodyNodes.forEach(({ node, data }) => items.push({
      id: data.id || '?', name: data.name || '天体',
      kind: KIND_CN[data.kind] || data.kind || '天体',
      color: (data.biomes && data.biomes[0] && data.biomes[0].color) || '#8899aa',
      type: 'body'
    }));

    items.forEach(it => {
      const el = document.createElement('div');
      el.className = 'lg';
      el.innerHTML = `<span>${it.name}</span><span class="ty">${it.kind}</span>` +
                     `<span class="dot" style="background:${it.color};color:${it.color}"></span>`;
      el.onclick = () => {
        const n = nodes[it.id];
        if (!n) return;
        const p = new THREE.Vector3();
        n.group.getWorldPosition(p);
        ctrl.setTarget(p, n.radius * 3.6);
        document.querySelectorAll('.lg').forEach(x => x.classList.remove('on'));
        el.classList.add('on');
        UI.hideOverlays();
        ['v-sys', 'v-body', 'v-far'].forEach(x => $(x).classList.remove('on'));
      };
      box.appendChild(el);
    });
  })();

  /* ── 点击拾取 ───────────────────────────────────────────── */
  const ray = new THREE.Raycaster();
  const ndc = new THREE.Vector2();
  canvas.addEventListener('click', e => {
    if (ctrl.moved > 6) return;    // 拖拽结束的误触
    const r = canvas.getBoundingClientRect();
    ndc.x = ((e.clientX - r.left) / r.width) * 2 - 1;
    ndc.y = -((e.clientY - r.top) / r.height) * 2 + 1;
    ray.setFromCamera(ndc, camera);
    const hit = ray.intersectObjects(pickables, false)[0];
    if (hit && hit.object.userData.pick) {
      const n = nodes[hit.object.userData.pick.id];
      if (n) {
        const p = new THREE.Vector3();
        n.group.getWorldPosition(p);
        ctrl.setTarget(p, n.radius * 3.6);
      }
    }
  });

  /* ── 控制条 ─────────────────────────────────────────────── */
  $('btn-play').onclick = () => {
    playing = !playing;
    $('btn-play').textContent = playing ? '运行' : '暂停';
    $('btn-play').classList.toggle('on', playing);
  };
  $('btn-spd').onclick = () => {
    speedIdx = (speedIdx + 1) % SPEEDS.length;
    speed = SPEEDS[speedIdx];
    $('btn-spd').textContent = speed + '×';
  };
  $('v-sys').onclick = viewSys;
  $('v-body').onclick = viewBody;
  $('v-far').onclick = viewFar;
  $('btn-reset').onclick = () => {
    const n = bodyNodes.length ? bodyNodes[0].data : (IS_STARS[0] || {});
    viewSys();
  };

  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); $('btn-play').click(); }
    if (e.key === '1') viewSys();
    if (e.key === '2') viewBody();
    if (e.key === '3') viewFar();
    if (e.key === '4') SURF.open();
    if (e.key === '5') LIFE.open();
    if (e.key === 'r' || e.key === 'R') $('btn-reset').click();
  });

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  /* ── 初始视角 ───────────────────────────────────────────── */
  ctrl.tRadius = ctrl.radius = mainDist * 2.55;
  viewSys();
  ctrl.radius = ctrl.tRadius;   // 首帧不做缩放动画

  /* ── 动画 ───────────────────────────────────────────────── */
  const clock = new THREE.Clock();
  let fpsAcc = 0, fpsN = 0, downgraded = false;

  function tick() {
    const dt = Math.min(clock.getDelta(), 0.05);
    const step = playing ? dt * speed : 0;
    t += step;

    // 恒星绕质心
    starOrbiters.forEach((o, idx) => {
      const node = nodes[o.s.id || ('star' + idx)];
      if (!node) return;
      if (o.a > 0 && o.period > 0) {
        const w = omegaFor(o.period);
        const ang = t * w + idx * Math.PI;
        node.group.position.set(Math.cos(ang) * o.a, 0, Math.sin(ang) * o.a);
      }
    });

    // 天体公转 + 自转
    bodyNodes.forEach(({ node, data }, idx) => {
      let orbitW = 0;
      if (node.orbitDist > 0 && node.orbitPeriod > 0) {
        orbitW = omegaFor(node.orbitPeriod);
        const ang = t * orbitW + idx * 1.7;
        node.group.position.set(Math.cos(ang) * node.orbitDist, 0, Math.sin(ang) * node.orbitDist);
      }
      // 潮汐锁定：自转角速度 = 公转角速度
      const rotH = data.rotation_hours;
      let spin;
      if (rotH === null || rotH === undefined) {
        spin = orbitW || omegaFor(node.orbitPeriod || REF_P);
      } else {
        spin = (Math.PI * 2) / Math.max(4, (num(rotH, 24) / 24) * 8);
      }
      if (node.surface) node.surface.rotation.y += spin * step;
      if (node.cloud) node.cloud.rotation.y += spin * step * 1.12;

      if (node.mat) node.mat.uniforms.uTime.value = t;
    });

    // 更新太阳世界坐标（着色器用）
    const tmp = new THREE.Vector3();
    for (let i = 0; i < Math.min(allSunPos.length, IS_STARS.length); i++) {
      const s = IS_STARS[i];
      const node = nodes[s.id || ('star' + i)];
      if (node) {
        node.group.getWorldPosition(tmp);
        allSunPos[i].copy(tmp);
      }
    }

    ctrl.update();
    renderer.render(scene, camera);

    // 自适应降级
    fpsAcc += dt; fpsN++;
    if (!downgraded && fpsN > 120) {
      const fps = fpsN / fpsAcc;
      if (fps < 30 && renderer.getPixelRatio() > 1) {
        renderer.setPixelRatio(1);
        downgraded = true;
      }
      fpsAcc = 0; fpsN = 0;
    }

    requestAnimationFrame(tick);
  }

  /* ── 启动 ───────────────────────────────────────────────── */
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      $('boot').classList.add('done');
      document.getElementById('hud').classList.add('fade-in');
    });
  });
  tick();
}
/* ── 1.1.4 · 今夜星图卡片（独立于 3D 视图，缺数据就整块隐藏）── */
(function initSkyCard() {
  const host = document.getElementById('sky-card');
  const raw = document.getElementById('pangu-sky');
  if (!host || !raw) return;
  let data = null;
  try { data = JSON.parse(raw.textContent || '{}'); } catch (e) { data = null; }
  if (!data || !data.frames || !data.frames.length) { host.classList.add('hide'); return; }
  const cvs = document.getElementById('sky-canvas');
  const ctx = cvs.getContext('2d');
  const slider = document.getElementById('sky-time');
  const read = document.getElementById('sky-read');
  const tag = document.getElementById('sky-tag');
  slider.max = String(data.frames.length - 1);
  const TAU = Math.PI * 2;

  function project(alt, az, R, cx, cy) {
    const rad = R * (90 - Math.max(0, Math.min(90, alt))) / 90;
    const a = az * Math.PI / 180;
    return [cx + rad * Math.sin(a), cy - rad * Math.cos(a)];
  }

  function draw(i) {
    const f = data.frames[i] || {};
    const W = cvs.width, H = cvs.height, cx = W / 2, cy = H / 2, R = W / 2 - 6;
    ctx.clearRect(0, 0, W, H);
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, R);
    g.addColorStop(0, '#04060b'); g.addColorStop(0.75, '#070d18'); g.addColorStop(1, '#0c1826');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.fill();

    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(120,150,190,.16)';
    [30, 60].forEach(function (a) {
      ctx.beginPath(); ctx.arc(cx, cy, R * (90 - a) / 90, 0, TAU); ctx.stroke();
    });
    ctx.strokeStyle = 'rgba(150,180,215,.38)';
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.stroke();

    (f.stars || []).forEach(function (s) {
      const p = project(s[1], s[0], R, cx, cy);
      const m = s[2];
      ctx.fillStyle = 'rgba(222,233,255,' + (m < 2 ? 0.95 : m < 4 ? 0.68 : 0.42) + ')';
      ctx.beginPath(); ctx.arc(p[0], p[1], m < 1 ? 2.4 : m < 3 ? 1.5 : 1.0, 0, TAU); ctx.fill();
    });
    (f.suns || []).forEach(function (s) {
      if (s[1] <= 0) return;
      const p = project(s[1], s[0], R, cx, cy);
      ctx.fillStyle = s[3] || '#fff6e2';
      ctx.beginPath(); ctx.arc(p[0], p[1], 6, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,246,226,.16)';
      ctx.beginPath(); ctx.arc(p[0], p[1], 13, 0, TAU); ctx.fill();
    });
    (f.moons || []).forEach(function (m) {
      if (m[1] <= 0) return;
      const p = project(m[1], m[0], R, cx, cy);
      ctx.fillStyle = 'rgba(214,222,235,.9)';
      ctx.beginPath(); ctx.arc(p[0], p[1], 3.4, 0, TAU); ctx.fill();
    });

    tag.textContent = f.label || '—';
    read.textContent = (f.limit_mag ? f.limit_mag.toFixed(1) : '—') + ' 等 · ' +
                       (Math.round(f.visible || 0)) + ' 颗' +
                       (f.milky_way ? ' · 银河' : '');
  }

  slider.addEventListener('input', function () { draw(Number(slider.value) || 0); });
  draw(0);
})();
</script>
</body>
</html>
