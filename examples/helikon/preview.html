<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>赫利孔 · 盘古 3D 预览</title>
<style>
  :root{
    --ink:#e8eef7;
    --ink-dim:#8fa0b8;
    --ink-faint:#5a6a80;
    --line:rgba(140,170,210,.16);
    --glass:rgba(10,16,28,.62);
    --glass-hi:rgba(20,30,48,.78);
    --accent:#ffcf8a;
    --accent2:#7fb6d9;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#04060c;color:var(--ink);font-family:var(--font)}
  #scene{display:block;width:100%;height:100%;cursor:grab}
  #scene.dragging{cursor:grabbing}

  .fade-in{animation:fade .9s cubic-bezier(.22,.9,.28,1) both}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* ── 左上 · 世界标头 ── */
  #hud{position:fixed;top:0;left:0;padding:26px 30px;pointer-events:none;max-width:min(46vw,520px)}
  #hud .kicker{font-size:10.5px;letter-spacing:.34em;color:var(--ink-faint);text-transform:uppercase;margin-bottom:12px}
  #hud h1{margin:0;font-size:clamp(24px,3.2vw,40px);font-weight:600;letter-spacing:.14em;line-height:1.16;
          text-shadow:0 2px 26px rgba(0,0,0,.85)}
  #hud .sub{margin-top:9px;font-size:12.5px;letter-spacing:.22em;color:var(--accent);opacity:.92}
  #hud .tag{margin-top:15px;font-size:13px;line-height:1.85;color:var(--ink-dim);max-width:34em}
  #hud .tag::before{content:"";display:inline-block;width:16px;height:1px;background:var(--accent);
                    vertical-align:middle;margin-right:9px;opacity:.7}

  /* ── 右上 · 评分 ── */
  #score{position:fixed;top:26px;right:30px;text-align:right;pointer-events:none}
  #score .n{font-size:30px;font-weight:300;letter-spacing:.02em;line-height:1;
            font-variant-numeric:tabular-nums}
  #score .n small{font-size:12px;color:var(--ink-faint);margin-left:2px}
  #score .g{font-size:10px;letter-spacing:.28em;color:var(--ink-faint);margin-top:7px}
  #score .bar{width:92px;height:2px;background:rgba(255,255,255,.09);margin:11px 0 0 auto;overflow:hidden}
  #score .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));
                width:100%;transition:width 1.2s cubic-bezier(.22,.9,.28,1)}

  /* ── 右侧 · 天体列表 ── */
  #legend{position:fixed;right:30px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;
          gap:7px;align-items:flex-end;max-height:56vh;overflow-y:auto;scrollbar-width:none}
  #legend::-webkit-scrollbar{display:none}
  .lg{display:flex;align-items:center;gap:9px;padding:6px 11px;border-radius:20px;
      background:var(--glass);border:1px solid transparent;cursor:pointer;
      transition:.28s cubic-bezier(.22,.9,.28,1);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
      font-size:11.5px;letter-spacing:.06em;color:var(--ink-dim);white-space:nowrap}
  .lg:hover{background:var(--glass-hi);color:var(--ink);border-color:var(--line)}
  .lg.on{color:var(--ink);border-color:rgba(255,207,138,.42);background:rgba(40,32,20,.7)}
  .lg .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 9px currentColor}
  .lg .ty{font-size:9px;color:var(--ink-faint);letter-spacing:.14em}

  /* ── 底部 · 控制条 ── */
  #dock{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);display:flex;align-items:center;
        gap:3px;padding:7px;border-radius:14px;background:var(--glass);border:1px solid var(--line);
        backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
        box-shadow:0 14px 44px rgba(0,0,0,.55)}
  #dock button{appearance:none;border:0;background:transparent;color:var(--ink-dim);font-family:var(--font);
        font-size:11.5px;letter-spacing:.1em;padding:8px 13px;border-radius:9px;cursor:pointer;transition:.2s}
  #dock button:hover{background:rgba(255,255,255,.07);color:var(--ink)}
  #dock button.on{background:rgba(255,207,138,.15);color:var(--accent)}
  #dock .sep{width:1px;height:18px;background:var(--line);margin:0 4px}
  #dock .spd{font-variant-numeric:tabular-nums;min-width:44px}

  /* ── 右下 · 声明 ── */
  #note{position:fixed;right:30px;bottom:28px;font-size:10px;color:var(--ink-faint);
        letter-spacing:.08em;text-align:right;line-height:1.7;pointer-events:none}
  #note b{color:var(--ink-dim);font-weight:500}

  /* ── 加载 / 降级 ── */
  #boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
        gap:22px;background:#04060c;z-index:50;transition:opacity .8s,visibility 0s .8s}
  #boot .ring{width:44px;height:44px;border:1px solid rgba(255,207,138,.16);border-top-color:var(--accent);
              border-radius:50%;animation:spin 1.1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #boot .t{font-size:11px;letter-spacing:.34em;color:var(--ink-faint)}
  #boot.done{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .8s,visibility 0s .8s}

  #fallback{position:fixed;inset:0;z-index:60;background:#04060c;overflow-y:auto;padding:56px 8vw;display:none}
  #fallback.show{display:block}
  #fallback h2{font-size:22px;letter-spacing:.16em;margin:0 0 10px}
  #fallback .warn{color:#ffb26b;font-size:12.5px;line-height:1.9;border-left:2px solid #ffb26b;
                  padding-left:14px;margin-bottom:30px;max-width:60ch}
  #fallback table{width:100%;max-width:760px;border-collapse:collapse;font-size:12.5px;margin:12px 0 28px}
  #fallback th,#fallback td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line)}
  #fallback th{color:var(--ink-faint);font-weight:500;letter-spacing:.1em;font-size:10.5px}
  #fallback ul{max-width:760px;line-height:2;font-size:13px;color:var(--ink-dim);padding-left:20px}
  #fallback .fb-go{appearance:none;border:1px solid var(--line);background:var(--glass-hi);
                   color:var(--ink);font-family:var(--font);font-size:12px;letter-spacing:.1em;
                   padding:9px 16px;border-radius:9px;cursor:pointer;transition:.2s}
  #fallback .fb-go:hover{border-color:rgba(255,207,138,.42);color:var(--accent)}

  @media (max-width:760px){
    #hud{padding:18px 18px;max-width:78vw}
    #hud .tag{display:none}
    #score{top:18px;right:18px}
    #score .n{font-size:22px}
    #legend{right:14px;gap:5px;max-height:40vh}
    .lg{padding:5px 9px;font-size:10.5px}
    .lg .ty{display:none}
    #dock{bottom:14px;padding:5px}
    #dock button{padding:7px 9px;font-size:10.5px;letter-spacing:.04em}
    #note{display:none}
  }

  /* ══ 1.1 · 地面视角 / 演化视图 ══ */
  .overlay{position:fixed;inset:0 0 76px 0;z-index:8;display:none;background:#04060c}
  .overlay.show{display:block}
  #surface-canvas{display:block;width:100%;height:100%}
  .ov-hint{position:absolute;left:26px;top:22px;font-size:11px;letter-spacing:.14em;
           color:var(--ink-faint);pointer-events:none;line-height:2}
  .ov-hint b{color:var(--accent);font-weight:500}
  .ov-hint .warn{color:#ffb26b}
  .ov-ctrl{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;
           gap:4px;align-items:center;padding:6px;border-radius:12px;background:var(--glass);
           border:1px solid var(--line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
  .ov-ctrl button{appearance:none;border:0;background:transparent;color:var(--ink-dim);
                  font-family:var(--font);font-size:11px;letter-spacing:.06em;
                  padding:6px 11px;border-radius:8px;cursor:pointer;transition:.2s}
  .ov-ctrl button:hover{background:rgba(255,255,255,.07);color:var(--ink)}
  .ov-ctrl button.on{background:rgba(255,207,138,.15);color:var(--accent)}
  .ov-ctrl input[type=range]{width:170px;accent-color:#ffcf8a;background:transparent}
  .ov-ctrl .read{font-size:11px;color:var(--ink-faint);min-width:82px;text-align:right;
                 font-variant-numeric:tabular-nums}

  #life-view{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr) minmax(0,.82fr);
             grid-template-rows:minmax(0,1fr) auto;gap:12px;padding:16px}
  #life-view.show{display:grid}
  .life-panel{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;
              background:rgba(8,12,20,.72);display:flex;flex-direction:column;min-height:0}
  .life-panel h3{margin:0;padding:9px 12px;font-size:10px;letter-spacing:.2em;
                 color:var(--ink-faint);font-weight:500;border-bottom:1px solid var(--line);flex:0 0 auto}
  .life-panel canvas{display:block;width:100%;flex:1 1 auto;min-height:0;
                     image-rendering:pixelated}
  #life-probe{overflow-y:auto;padding:6px 12px 12px;scrollbar-width:thin}
  .probe-row{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;
             padding:5px 0;border-bottom:1px dashed rgba(140,170,210,.1);color:var(--ink-dim)}
  .probe-row b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
  .probe-row.bad b{color:#ff7a6b}
  .probe-row.good b{color:#7fe0a8}
  .probe-flag{margin-top:9px;font-size:11px;line-height:1.75;color:#ffb26b}
  #life-ctrl{grid-column:1/-1;position:static;transform:none;justify-self:center}

  @media (max-width:900px){
    #life-view{grid-template-columns:1fr;grid-template-rows:1.3fr 1fr auto auto;overflow-y:auto}
    .ov-hint{font-size:10px}
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div id="hud" class="fade-in">
  <div class="kicker">盘古 · 世界模型</div>
  <h1 id="w-name">赫利孔</h1>
  <div class="sub" id="w-sub"></div>
  <div class="tag" id="w-tag"></div>
</div>

<div id="score" class="fade-in">
  <div class="n">100<small>/100</small></div>
  <div class="g">可发表</div>
  <div class="bar"><i></i></div>
</div>

<div id="legend"></div>

<div id="dock">
  <button id="btn-play" class="on" title="空格">运行</button>
  <button id="btn-spd" class="spd" title="速度">1×</button>
  <div class="sep"></div>
  <button id="v-sys" class="on">系统</button>
  <button id="v-body">天体</button>
  <button id="v-far">远景</button>
  <div class="sep"></div>
  <button id="v-surface">地面</button>
  <button id="v-life">演化</button>
  <div class="sep"></div>
  <button id="btn-reset" title="R">复位</button>
</div>

<div id="note">
  示意视图 · <b>天体与轨道非真实比例</b><br>
  行星半径与轨道采用双尺度压缩
</div>

<!-- 1.1 · 地面视角：站在地表抬头，两颗星按真实方位角/高度角走 -->
<div id="surface-view" class="overlay">
  <canvas id="surface-canvas"></canvas>
  <div class="ov-hint" id="surface-hint"></div>
  <div class="ov-ctrl">
    <button id="sf-play" class="on">运行</button>
    <input id="sf-time" type="range" min="0" max="1000" value="0">
    <span class="read" id="sf-clock">—</span>
    <button id="sf-year">一年快进</button>
  </div>
</div>

<!-- 1.1 · 演化视图：2D 生态相 / 数据 / 环境状态监测 -->
<div id="life-view" class="overlay">
  <div class="life-panel"><h3>演化 · 2D 生态相</h3><canvas id="life-grid"></canvas></div>
  <div class="life-panel"><h3>数据 · 密度与天文强迫</h3><canvas id="life-chart"></canvas></div>
  <div class="life-panel"><h3>环境状态监测</h3><div id="life-probe"></div></div>
  <div class="ov-ctrl" id="life-ctrl">
    <button id="lf-play" class="on">运行</button>
    <button id="lf-step">单步</button>
    <button id="lf-reset">重置</button>
    <button id="lf-spd">1×</button>
    <span class="read" id="lf-clock">第 0 步</span>
  </div>
</div>

<div id="boot">
  <div class="ring"></div>
  <div class="t" id="boot-t">正在开天</div>
</div>

<div id="fallback">
  <h2 id="fb-name">世界</h2>
  <div class="warn" id="fb-warn"></div>
  <div id="fb-body"></div>
</div>

ollapse_prob":0.0,"measured_at_step":800,"primary_state":"rustmoss","energy_spent":38858.9,"max_drawdown":0.235,"resilience":1.0,"area_weighted":true,"map_coupled":true,"final_hash":"ba802447","state_density":{"bare":0.067,"rustmoss":0.344,"alga":0.183,"ventmat":0.173,"grazer":0.123,"hunter":0.059,"salt":0.035,"char":0.016}},"figures":["out/helikon/ca-t0.png","out/helikon/ca-t400.png","out/helikon/ca-t800.png","examples/helikon/map/ca-t0.png","examples/helikon/map/ca-t400.png","examples/helikon/map/ca-t800.png"],"impacts":[{"target":"biology.trophic_levels[0].share","before":0.82,"after":0.761,"note":"CA 实测三个生产者稳态合计 0.761，取代纸面的 0.82"},{"target":"biology.trophic_levels[1].share","before":0.13,"after":0.111,"note":"初级消费者由捕食转化与自然死亡共同平衡，低于原估值"},{"target":"biology.trophic_levels[2].share","before":0.038,"after":0.057,"note":"CA 暴露：原纸面 0.038 低估了捕食效率，实测次级消费者更高"},{"target":"biology.trophic_levels[4]","before":null,"after":0.059,"note":"CA 未建模分解者，守恒差额暴露出一整层缺失的生态位"}],"status":"ok","map_coupling":{"field":"habitat","initial_from_map":true,"initial_bias":0.8,"growth_gain":0.8,"rules":["R1","R3","R10","R14","R15"]}},"sentient":{"exists":true,"name":"灰民","note":"唯一已知智慧物种。因长期生活在 1.76 g 下，身高仅 1.2 米，骨骼密度是人类的 2.4 倍，无颈——头部直接嵌入肩胛。视觉有四色感光细胞，能分辨两道影子的色温差，这是他们最古老的天文仪器"},"mass_extinctions":["大氧化事件（约 21 亿年前）：双峰藻把大气氧含量推到 19%，硫铁簇代谢者大批灭绝，深层生态被迫退守裂缝","双星合灾变（约 40 万年前）：一次罕见的双星近距互食使全球气温在 90 分钟内下降 27 度，87% 的陆生大型动物灭绝，灰民由此从采集转向储热定居","长夜之疫（约 1200 年前）：厄瑞玻斯轨道共振引发的潮汐高峰，全球地震频发，文明一度退回到石器时代"]},"civilization":{"exists":true,"name":"灰阶诸城","tech_path":"跳过冶铜与青铜，直接从天然赤铜进入冷锻工艺；因 G' 较低而无法造出高精度弹簧与齿轮，机械技术停在凸轮与杠杆阶段，转而把全部工程天赋投向「热」——盐墙储热、地息导流、曜岩定向反光","timekeeping":"以双星合为「月」，一月 44.49 天，一年八个「暗月」。他们不需要闰日：一年恰好是八个双星周期，这是几何的必然（周期比 = (a_行星/a_双星)^1.5 = 4^1.5 = 8），而非巧合。历法由祭司阶层垄断，因为他们掌握唯一能预测互食时刻的曜岩日晷","energy_source":"双星辐照（主要用于盐墙储热）+ 地息燃烧（深层化能产物）+ 潮汐摩擦热（地热供暖）","social_shape":"沿晨昏温差带分布的城邦联盟。社会阶层按「影子清晰度」划分：能在正午看清自己两道影子边界的人属上层（意味着视力好、从事天文或祭司职业）；影子糊成一团者为底层。这一划分并非迷信——四色视觉确实与营养状况强相关","taboo":"「不可直视双星合的正中时刻」。在互食的 90 分钟里，短烛的边缘会掠过长明，产生瞬间的强偏振光，直视会造成不可逆的视网膜灼伤。这条禁忌有明确的物理依据，是全球唯一被所有城邦共同遵守的法律"},"history":{"eras":[{"name":"双源纪","span":"约 21 亿年前 – 40 万年前","summary":"双源生态的黄金时代。地表光合与深层化能两条食物链并行繁荣，生物多样性达到峰值。此期无智慧生命，只有大量巨型六足类"},{"name":"落火纪","span":"40 万年前 – 1200 年前","summary":"双星合灾变后，幸存者退守地热裂缝。灰民学会用重盐砌墙储热，第一批永久定居点沿断裂带建立。纪元名来自灾变当日天空的颜色"},{"name":"灰阶纪","span":"1200 年前 – 当下","summary":"长夜之疫后重建。八座城邦沿晨昏温差带结成联盟，曜岩日晷与八分历法成为共同语言。当下正处在一次罕见的天文事件前夜：远灯将于 12 年后穿过双星连线，三方引力叠加，可能触发新一轮潮汐高峰"}],"revisions":[{"version":"1.0","date":"2026-10-27","change":"初版：确立 G'=0.60G、双星 0.30 AU、行星 1.20 AU、八分历法"},{"version":"1.1","date":"2026-10-29","change":"加第一人称切片 / 地面视角 / 红队审查 / 世界原生元胞自动机（17 条规则由本世界设定编译）；营养级份额按 CA 实跑结果修正，并补出缺失的分解者层"},{"version":"1.1.1","date":"2026-10-31","change":"补 greenhouse_delta_k=33 K（10% CO2 / 118 kPa 的温室项），新增行星地图与地图耦合 CA；海平面由水量与盆地容积求解"}]},"consistency":{"score":100,"checks":[],"open_issues":[],"redteam":[{"id":"RT01","q":"表面重力 1.76 g、半径 3.0 R⊕、密度 5.391 g/cc，地壳屈服强度撑得住这个密度差吗？给一个数量级。","target":"cosmology.bodies[0].gravity_g","template":"数量级","verdict":"accepted","answer":"接受。1.76 g 下 3R⊕ 的静岩压力约为地球的 5 倍，硅酸盐地壳会进入韧性流动。赫利孔的解释是 G′=0.60G 使核内库仑排斥减弱、铁镍核占比更高（已写在 physics.constants[0].why），但原 note 没交代地壳刚度。已在 cosmology.bodies[0].note 补上重盐—石英复合相机制。","fix":"cosmology.bodies[0].note=补高重力下的地壳刚度机制"},{"id":"RT02","q":"逃逸速度 33.19 km/s，表面温度 255.1 K——这个组合下，大气在亿年尺度上留得住吗？光致逃逸通量是多少？","target":"cosmology.bodies[0].mass_earth","template":"边界条件","verdict":"answered","answer":"33.19 km/s 的逃逸速度是地球的 2.96 倍，Jeans 逃逸参数远大于 1，热逃逸可忽略。真正的威胁是水的光解后氢逃逸，但 118 kPa 的大气柱在 10 亿年尺度上足以维持。不构成矛盾。"},{"id":"RT03","q":"系统总光度 1.468 L☉ 摊到 26.4 M⊕，初级生产者份额 0.761，这条能量预算能撑住 5 层消费者吗？","target":"biology.trophic_levels[0].share","template":"能量收支","verdict":"accepted","answer":"接受，而且元胞自动机已经把它跑出来了。1.468 L☉ 摊到 26.4 M⊕ 的预算撑不住纸面的 0.82/0.13/0.038/0.012。实跑 800 步稳态为 0.761/0.111/0.057，并暴露出一整层缺失的分解者。营养级份额已按 CA 结果修正。","fix":"biology.trophic_levels[0].share=按 CA 实跑结果修正"},{"id":"RT04","q":"「每个人在天亮后有两个影子：长明的影子边缘锐利、色偏冷灰；短烛的影子边缘模糊、边缘…」从地面怎么观测？观测时刻表能不能提前预报？历法月长 44.49 天，对得上吗？","target":"cosmology.calendar.month_days","template":"观测一致性","verdict":"answered","answer":"能预报。双星互绕周期 44.49 天恰是历法月长，一年 8 个月即 8 个双星周期，这是周期比 (a/a_b)^1.5 = 8 的几何必然。祭司阶层垄断曜岩日晷正是因为他们读得懂这个相位；预报误差主要来自轨道偏心率 0.03。"},{"id":"RT05","q":"「两道影子的夹角随双星互绕而每日变化，正午时几乎重合成一个厚影…」在 31.4 小时的一天里，居民什么时候能看到它？看不到的那部分时间，设定靠什么成立？","target":"cosmology.sky_phenomena","template":"观测一致性","verdict":"answered","answer":"两影夹角由双星相位决定，一个自转周期（31.4 小时）内走完一轮，正午相位差最小、两影合拢。居民在每个白天都能看到夹角的连续变化——这正是痕迹律要的那种抬头可见、且随时间可读的异常。"}]},"narrative":{"three_seconds":"天上两个太阳，一大一小，一冷一暖，绕着彼此转。地上每个人都有两道影子，一道锐利，一道模糊。一年不是十二个月，是八个「暗月」——每四十四天，小的走到大的前面，天在九十分钟里暗下去，全城停摆，祭司登塔。他们的历法从不误差，因为一年恰好是八个双星周期，这是几何的必然，不是巧合。","setpiece":"双星合的那九十分钟。天空从琥珀色一层层褪到铁灰，气温骤降十一度，两道影子在广场石板上缓缓合拢成一个厚影。所有人停下手中的活，背对天空站立——不是因为敬畏，是因为直视会瞎。祭司在塔顶用曜岩日晷记录那一刻的精确角度，而城墙上的盐砖开始放出白天存下的热，白色的雾气顺着墙面升起，整座城像在呼吸。","hook":"他们从不校准历法。历法自己就是对的——因为一年正好是八个双星周期，这是开普勒第三定律替他们签好的契约。","slice":{"text":"我醒在第 31 小时。天还没亮，盐墙的余温贴着后背，像一只手把我按住。睁眼第一件事不是看天，是看墙——曜岩外墙由白转橙，说明短烛已经绕到长明前面，今天有双影。我摸黑走到坡顶，两个影子已经铺在脚下了：一个边缘像刀，冷灰；一个边缘像毛边纸，泛着琥珀。我数它们之间的夹角，八指宽，比昨天窄。四色眼睛能看见那道色温差，这是灰民最古老的钟。正午两星并照，影子合成一个厚团，我低头，不敢看天——曜岩石面在那一刻会亮得发白。日落前最后一小时最难熬，光从铁灰里退出去，我缩回盐墙后面。躺下时我摸了摸影子刚才待过的地方，石头还是热的。","cites":["cosmology.calendar.day_hours","cosmology.sky_phenomena[0]","cosmology.sky_phenomena[1]","biology.sentient.note","chemistry.signature_materials[0]","chemistry.signature_materials[2]"],"hours":[0.0,31.4],"status":"ok"}}}</script>

<script type="module">
/* ════════════════════════════════════════════════════════════════
   盘古 3D 预览层
   单文件 / 零构建 / 零外部资源（除 three 从 CDN 动态加载）
   ════════════════════════════════════════════════════════════════ */

const WORLD = (() => {
  try { return JSON.parse(document.getElementById('pangu-world').textContent); }
  catch (e) { return {}; }
})();

const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const num = (v, d = 0) => (typeof v === 'number' && isFinite(v)) ? v : d;

/* ── 数据抽取（全部容错，缺字段不抛错） ───────────────────────── */
const META = WORLD.meta || {};
const COS  = WORLD.cosmology || {};
const IS_STARS = (COS.stars || []).filter(s => s && typeof s === 'object');
const IS_BODIES = (COS.bodies || []).filter(b => b && typeof b === 'object');

function starColor(s) {
  if (s.color) return s.color;
  const t = num(s.temp_k, 5800);
  if (t < 3700) return '#ff8f5e';
  if (t < 5200) return '#ffc98a';
  if (t < 6000) return '#fff4e2';
  if (t < 7500) return '#eef3ff';
  return '#cfe0ff';
}
const visRadius = b => {
  if (num(b.visual_radius, 0) > 0) return num(b.visual_radius);
  const re = num(b.radius_earth, 0) || (num(b.radius_km, 0) / 6371) || 1;
  return clamp(1.0 + 1.5 * Math.log10(re + 1), 0.6, 6);
};
const visStarRadius = s => clamp(1.4 * Math.pow(num(s.radius_solar, 1), 0.7), 0.8, 4);

const ORBIT_SCALE = 26;

/* ── 标头填充 ───────────────────────────────────────────────── */
$('w-name').textContent = META.name || '未命名世界';
$('w-sub').textContent  = META.subtitle || '';
$('w-tag').textContent  = META.tagline || '';

/* ════════════════════════════════════════════════════════════════
   1.1 · 地面视角：站在地表抬头
   方位角/高度角用球面三角真算，影子方向 = 恒星方位 + 180°
   ════════════════════════════════════════════════════════════════ */
const SURF = (() => {
  const cvs = $('surface-canvas');
  const hint = $('surface-hint');
  const ctx = cvs.getContext('2d');
  const S = COS.surface || {};
  const OBS = (S.observer && typeof S.observer === 'object') ? S.observer : null;
  const CAL = COS.calendar || {};
  const DAY_H = num(CAL.day_hours, 24) || 24;
  const MONTH_D = num(CAL.month_days, 30) || 30;
  const MAIN = IS_BODIES[0] || {};
  const TILT = num(MAIN.axial_tilt_deg, 0);
  // 只取内层双星：外层伴星躲得远，不该和主双星叠在同一方位
  const STARS = (() => {
    const orb = IS_STARS.filter(s => num(s.orbit && s.orbit.a_au, 0) > 0)
      .sort((a, b) => num(a.orbit.a_au, 0) - num(b.orbit.a_au, 0));
    if (orb.length >= 2) {
      const a0 = num(orb[0].orbit.a_au, 0);
      const inner = orb.filter(s => num(s.orbit.a_au, 0) <= a0 * 3);
      return inner.length >= 2 ? inner.slice(0, 2) : orb.slice(0, 2);
    }
    return IS_STARS.slice(0, 2);
  })();
  const GROUND = S.ground_color || '#2a3a4a';

  const sepAu = (() => {
    const orb = STARS.filter(s => num(s.orbit && s.orbit.a_au, 0) > 0);
    if (orb.length < 2) return 0;
    return num(orb[0].orbit.a_au, 0) + num(orb[1].orbit.a_au, 0);
  })();
  const planetA = num(MAIN.orbit && MAIN.orbit.a_au, 1) || 1;
  const rawSep = sepAu > 0 ? (sepAu / planetA) * 180 / Math.PI : 0;
  const SEP_DEG = rawSep > 0 ? clamp(rawSep * 1.9, 10, 70) : 0;

  let W = 0, H = 0, dpr = 1;
  let tHours = 0, playing = true, yearSpin = false, yearPhase = 0;
  let raf = 0, started = false, last = 0;

  const rad = d => d * Math.PI / 180;
  const deg = r => r * 180 / Math.PI;
  const FOV = rad(240);          // 超广角：太阳与影子相差 180°，还要各自容下两星的夹角
  let viewAz = 0;                // 可拖动转头
  const horizonY = () => H * 0.57;

  function mix(a, b, k) {
    return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k]
      .map(v => Math.round(v));
  }
  const rgb = c => `rgb(${c[0]},${c[1]},${c[2]})`;

  // 时角由行星自转决定。双星相距极近，从行星看两者时角基本一致——
  // 它们的分离体现在方位差（SEP_DEG），而不是反相 180°（那会变成一颗升另一颗落）。
  const PHASE0 = num(STARS[0] && STARS[0].orbit && STARS[0].orbit.phase_deg, 0);

  function hourAngle() {
    return (tHours / DAY_H) * Math.PI * 2 + rad(PHASE0);
  }
  function altOf(star) {
    const lat = rad(num(OBS && OBS.lat_deg, 0));
    const dec = rad(num(star.orbit && star.orbit.inclination_deg, 0) + TILT * Math.sin(yearPhase));
    const Hh = hourAngle();
    const s = Math.sin(lat) * Math.sin(dec) + Math.cos(lat) * Math.cos(dec) * Math.cos(Hh);
    return Math.asin(clamp(s, -1, 1));
  }
  function azOf(star) {
    const lat = rad(num(OBS && OBS.lat_deg, 0));
    const dec = rad(num(star.orbit && star.orbit.inclination_deg, 0) + TILT * Math.sin(yearPhase));
    const Hh = hourAngle();
    return Math.atan2(-Math.cos(dec) * Math.sin(Hh),
      Math.sin(dec) * Math.cos(lat) - Math.cos(dec) * Math.sin(lat) * Math.cos(Hh));
  }

  function positions() {
    const list = STARS.map(s => ({ s, alt: altOf(s), az: azOf(s) }));
    if (list.length >= 2 && SEP_DEG > 0) {
      // 双星互绕：一「月」走完一轮，两星方位差 = 角距，正午附近合拢
      const ph = (tHours / (MONTH_D * 24)) % 1;
      const dir = Math.cos(ph * Math.PI * 2);
      const base = list[0].az, half = rad(SEP_DEG) / 2;
      list[0].az = base + half * dir;
      list[1].az = base - half * dir;
    }
    return list;
  }

  function project(az, alt) {
    let d = az - viewAz;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    const hz = horizonY();
    return {
      x: W / 2 + (d / (FOV / 2)) * (W / 2),
      y: hz - (alt / (Math.PI / 2)) * hz,
      vis: Math.abs(d) < FOV / 2,
    };
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = cvs.clientWidth || window.innerWidth;
    H = cvs.clientHeight || (window.innerHeight - 76);
    cvs.width = Math.round(W * dpr); cvs.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function drawShadow(az, alt, color, blur) {
    if (alt <= rad(1.2)) return;
    let d = az + Math.PI - viewAz;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    const sx = W / 2 + (d / (FOV / 2)) * (W / 2);
    const len = clamp(H * 0.5 / Math.tan(Math.max(alt, rad(1.2))), 24, H * 2.2);
    ctx.save();
    ctx.globalAlpha = 0.82;
    if (blur) ctx.filter = `blur(${blur}px)`;
    ctx.beginPath();
    ctx.moveTo(W / 2 - 30, H);
    ctx.lineTo(W / 2 + 30, H);
    ctx.lineTo(sx + 18, H - len);
    ctx.lineTo(sx - 18, H - len);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
    ctx.restore();
  }

  function draw() {
    if (!W || !H) resize();
    const pos = positions();
    const maxAlt = Math.max(-1, ...pos.map(p => p.alt));
    const dayF = clamp(deg(maxAlt) / 32, 0, 1);
    const hz = horizonY();

    // 天空
    const g = ctx.createLinearGradient(0, 0, 0, hz);
    g.addColorStop(0, rgb(mix([5, 7, 16], [46, 68, 104], dayF)));
    g.addColorStop(0.72, rgb(mix([10, 13, 26], [126, 118, 118], dayF)));
    g.addColorStop(1, rgb(mix([18, 20, 30], [206, 150, 104], dayF)));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, hz);

    // 星点（天亮了就隐去）
    if (dayF < 0.85) {
      ctx.save();
      ctx.globalAlpha = (1 - dayF) * 0.85;
      for (let i = 0; i < 160; i++) {
        const x = ((i * 733) % 997) / 997 * W;
        const y = ((i * 419) % 613) / 613 * hz * 0.94;
        const r = 0.4 + ((i * 37) % 11) / 22;
        ctx.fillStyle = i % 7 === 0 ? '#ffd9a0' : '#cfe0ff';
        ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
      }
      ctx.restore();
    }

    // 地面
    const gc = GROUND.replace('#', '');
    const gr = parseInt(gc.slice(0, 2), 16) || 42;
    const gg = parseInt(gc.slice(2, 4), 16) || 58;
    const gb = parseInt(gc.slice(4, 6), 16) || 74;
    const gd = ctx.createLinearGradient(0, hz, 0, H);
    gd.addColorStop(0, rgb([gr + 14, gg + 16, gb + 18]));
    gd.addColorStop(1, rgb([gr - 10, gg - 12, gb - 12]));
    ctx.fillStyle = gd;
    ctx.fillRect(0, hz, W, H - hz);

    // 地平线
    ctx.strokeStyle = 'rgba(255,220,180,.28)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, hz); ctx.lineTo(W, hz); ctx.stroke();

    // 两道影子（先画，太阳盖在上面）
    pos.forEach((p, i) => {
      if (p.alt <= 0) return;
      const col = i === 0 ? 'rgba(3,5,9,.88)' : 'rgba(24,14,6,.72)';
      drawShadow(p.az, p.alt, col, i === 0 ? 0 : 5);
    });

    // 两颗太阳（vis 属于投影结果，不在原始点上）
    pos.forEach((p, i) => {
      if (p.alt < -rad(3)) return;
      const q = project(p.az, p.alt);
      const c = starColor(p.s);
      if (!q.vis) {
        // 出框了：在边缘留一个方位指示，别让太阳凭空消失
        let d = p.az - viewAz;
        while (d > Math.PI) d -= Math.PI * 2;
        while (d < -Math.PI) d += Math.PI * 2;
        const ex = d < 0 ? 16 : W - 16;
        const ey = clamp(q.y, 46, horizonY() - 8);
        ctx.save();
        ctx.globalAlpha = 0.8;
        ctx.fillStyle = c;
        ctx.beginPath(); ctx.arc(ex, ey, 6, 0, 6.2832); ctx.fill();
        ctx.globalAlpha = 0.32;
        ctx.beginPath(); ctx.arc(ex, ey, 15, 0, 6.2832); ctx.fill();
        ctx.restore();
        return;
      }
      const r = 16 + 10 * clamp(num(p.s.luminosity_solar, 1), 0.2, 3) / 3;
      const halo = ctx.createRadialGradient(q.x, q.y, 0, q.x, q.y, r * 4.2);
      halo.addColorStop(0, c);
      halo.addColorStop(0.18, c + 'aa');
      halo.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = halo;
      ctx.beginPath(); ctx.arc(q.x, q.y, r * 4.2, 0, 6.2832); ctx.fill();
      ctx.fillStyle = '#fffdf6';
      ctx.beginPath(); ctx.arc(q.x, q.y, r * 0.62, 0, 6.2832); ctx.fill();
    });

    // 观测者脚下的标记
    ctx.strokeStyle = 'rgba(255,255,255,.25)';
    ctx.beginPath();
    ctx.moveTo(W / 2 - 12, H - 8); ctx.lineTo(W / 2 + 12, H - 8);
    ctx.stroke();

    // 提示
    const names = pos.map((p, i) => `${p.s.name || ('恒星' + i)} ${deg(p.alt).toFixed(0)}°`).join(' · ');
    const ang = SEP_DEG > 0 ? (SEP_DEG * Math.abs(Math.cos((tHours / (MONTH_D * 24)) * Math.PI * 2))).toFixed(0) : '0';
    hint.innerHTML =
      `观察点 <b>${num(OBS && OBS.lat_deg, 0)}°</b> · 海拔 ${num(OBS && OBS.elev_m, 0)} m` +
      `　｜　一天 <b>${DAY_H}</b> 小时` +
      `<br>${names}` +
      `<br>两影夹角 <b>${ang}°</b>${SEP_DEG ? '' : '（单星世界，只有一道影）'}` +
      `<br><span style="opacity:.6">拖动画面可转头</span>`;
  }

  function loop(now) {
    const dt = Math.min((now - last) / 1000, 0.1);
    last = now;
    if (playing) tHours = (tHours + dt * (yearSpin ? 6 : 1.2)) % (yearSpin ? MONTH_D * 24 : DAY_H);
    if (yearSpin) yearPhase += dt * 0.9;
    const slider = $('sf-time');
    if (slider && !slider.dataset.drag) slider.value = String(Math.round((tHours % DAY_H) / DAY_H * 1000));
    $('sf-clock').textContent = `${Math.floor(tHours % DAY_H)}h / ${DAY_H}h`;
    draw();
    raf = requestAnimationFrame(loop);
  }

  function open() {
    if (!STARS.length) {
      UI.hideOverlays();
      $('surface-view').classList.add('show');
      cvs.getContext('2d');
      ctx.clearRect(0, 0, W, H);
      hint.innerHTML = '<span class="warn">这个世界的 cosmology.stars 为空，没有可观测的恒星。</span>';
      UI.mark('v-surface');
      return;
    }
    LIFE.close();
    $('surface-view').classList.add('show');
    UI.mark('v-surface');
    resize();
    if (!started) {
      started = true;
      $('sf-play').onclick = () => {
        playing = !playing;
        $('sf-play').textContent = playing ? '运行' : '暂停';
        $('sf-play').classList.toggle('on', playing);
      };
      $('sf-year').onclick = () => {
        yearSpin = !yearSpin;
        $('sf-year').classList.toggle('on', yearSpin);
      };
      const sl = $('sf-time');
      sl.addEventListener('input', () => {
        sl.dataset.drag = '1';
        tHours = (num(sl.value, 0) / 1000) * DAY_H;
        draw();
      });
      sl.addEventListener('change', () => { delete sl.dataset.drag; });
      // 默认视角：背对双星 100°，双日退到左缘、双影在右侧铺开，一屏同时可见
      const p0 = positions();
      if (p0.length) viewAz = p0[0].az + rad(100);
      let dragX = null;
      cvs.addEventListener('pointerdown', e => {
        dragX = e.clientX;
        try { cvs.setPointerCapture(e.pointerId); } catch (_) { }
      });
      cvs.addEventListener('pointermove', e => {
        if (dragX === null) return;
        viewAz -= (e.clientX - dragX) * 0.005;
        dragX = e.clientX;
        draw();
      });
      cvs.addEventListener('pointerup', () => { dragX = null; });
      cvs.addEventListener('pointercancel', () => { dragX = null; });
    }
    if (!raf) { last = performance.now(); raf = requestAnimationFrame(loop); }
  }

  function close() {
    $('surface-view').classList.remove('show');
    if (raf) { cancelAnimationFrame(raf); raf = 0; started = false; }
  }

  window.addEventListener('resize', () => { if ($('surface-view').classList.contains('show')) resize(); });

  return { open, close };
})();

/* ════════════════════════════════════════════════════════════════
   1.1 · 演化视图：2D 生态相 / 数据 / 环境状态监测
   与 Python 端同规则同参数同 seed —— 允许逐格不同，密度差 >5% 算 bug
   ════════════════════════════════════════════════════════════════ */
const LIFE = (() => {
  const EVO = (WORLD.biology && WORLD.biology.evolution) || null;
  const gcv = $('life-grid'), gctx = gcv.getContext('2d');
  const ccv = $('life-chart'), cctx = ccv.getContext('2d');
  const probe = $('life-probe');

  let prog = null, cells = null, rnd = null, rngSeed = 7;
  let step = 0, playing = true, speedIdx = 0, started = false, raf = 0, acc = 0, last = 0;
  const SPEEDS = [1, 2, 4, 8];
  let hist = [];          // [{dens:{id:v}, forcing:{id:v}}]
  let snapshots = [];     // 关键步存档用于 2D 显示

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function countOk(expr, v) {
    if (typeof expr === 'number') return v === expr;
    const s = String(expr || '').trim();
    let m = s.match(/^(\d+)\s*\.\.\s*(\d+)$/);
    if (m) return v >= +m[1] && v <= +m[2];
    m = s.match(/^(>=|<=|==|>|<)\s*(\d+)$/);
    if (m) {
      const k = +m[2];
      return { '>=': v >= k, '<=': v <= k, '==': v === k, '>': v > k, '<': v < k }[m[1]];
    }
    if (/^\d+$/.test(s)) return v === +s;
    return false;
  }

  // world.json 里写的是 neighbors.of（状态名），运行期要换成 of_index；
  // 漏了这一步，所有带邻居条件的规则都会静默失效。
  function normalizeWhen(w, byId) {
    if (!w || typeof w !== 'object') return null;
    const out = {};
    Object.keys(w).forEach(k => {
      const v = w[k];
      if (k === 'neighbors' && v && typeof v === 'object') {
        const nb = Object.assign({}, v);
        if (nb.of !== undefined && byId[nb.of] !== undefined) nb.of_index = byId[nb.of];
        out.neighbors = nb;
      } else if ((k === 'all_of' || k === 'any_of' || k === 'none_of') && Array.isArray(v)) {
        out[k] = v.map(x => normalizeWhen(x, byId)).filter(Boolean);
      } else if (k === 'forcing_above' || k === 'forcing_below') {
        out[k] = Object.assign({}, v);
      }
    });
    return out;
  }

  function whenOk(w, cnt, fv) {
    if (!w) return true;
    if (w.all_of && !w.all_of.every(x => whenOk(x, cnt, fv))) return false;
    if (w.any_of && !w.any_of.some(x => whenOk(x, cnt, fv))) return false;
    if (w.none_of && w.none_of.some(x => whenOk(x, cnt, fv))) return false;
    const nb = w.neighbors;
    if (nb && typeof nb === 'object') {
      const k = (nb.of_index !== undefined) ? nb.of_index : -1;
      if (!countOk(nb.count === undefined ? '>=1' : nb.count, cnt[k] || 0)) return false;
    }
    const fa = w.forcing_above;
    if (fa && (fv[fa.id] || 0) < num(fa.value, 0)) return false;
    const fb = w.forcing_below;
    if (fb && (fv[fb.id] || 0) > num(fb.value, 0)) return false;
    return true;
  }

  function forcingAt(e, tHours) {
    const out = {};
    (e.forcing || []).forEach(f => {
      const p = num(f.period_days, 0);
      if (p <= 0) { out[f.id] = num(f.amp, 1); return; }
      let ph = (tHours / (p * 24) + num(f.phase_deg, 0) / 360) % 1;
      if (ph < 0) ph += 1;
      out[f.id] = f.kind === 'pulse'
        ? (ph >= 0.93 ? num(f.amp, 1) : 0)
        : num(f.amp, 1) * (0.5 - 0.5 * Math.cos(2 * Math.PI * ph));
    });
    return out;
  }

  function build() {
    const e = EVO;
    const g = e.grid || {};
    const nx = Math.max(4, Math.min(512, num(g.nx, 120)));
    const ny = Math.max(4, Math.min(512, num(g.ny, 90)));
    const states = (e.states || []).map((s, i) => ({
      id: s.id, name: s.name || s.id, kind: s.kind || 'other',
      color: s.color || '#888', idx: i,
      share: Math.max(0, num(s.initial_share, 0)),
    }));
    const byId = {};
    states.forEach(s => byId[s.id] = s.idx);

    // initial 覆盖
    if (e.initial && typeof e.initial === 'object') {
      Object.keys(e.initial).forEach(k => {
        if (byId[k] !== undefined) states[byId[k]].share = Math.max(0, num(e.initial[k], 0));
      });
    }
    const tot = states.reduce((a, s) => a + s.share, 0) || 1;

    const rules = (e.rules || []).map(r => ({
      id: r.id, src: byId[r.from], dst: byId[r.to],
      prob: clamp(num(r.prob, 0), 0, 1),
      when: normalizeWhen(r.when, byId),
      forcing: r.forcing || '',
      gain: num(r.forcing_gain, 0),
      cost: (r.cost && typeof r.cost === 'object') ? num(r.cost.value, 0) : num(r.cost, 0),
    })).filter(r => r.src !== undefined && r.dst !== undefined);

    const bySrc = {};
    rules.forEach(r => (bySrc[r.src] = bySrc[r.src] || []).push(r));
    Object.keys(bySrc).forEach(k => bySrc[k].sort((a, b) =>
      (a.when ? 1 : 0) - (b.when ? 1 : 0) || b.prob - a.prob));

    let radius = 1;
    rules.forEach(r => {
      const nb = r.when && r.when.neighbors;
      if (nb) radius = Math.max(radius, num(nb.radius, 1));
    });
    radius = clamp(radius, 1, 2);

    prog = {
      nx, ny, states, byId, rules, bySrc, radius,
      hps: num(e.clock && e.clock.hours_per_step, 0.5) || 0.5,
      forcing: e.forcing || [],
      shape: 'moore',
    };
    // 统一用 moore（radius 1）
    return prog;
  }

  function reset() {
    if (!prog) build();
    rngSeed = num(EVO.seed, 7);
    rnd = mulberry32(rngSeed * 2654435761 >>> 0);
    const { nx, ny, states } = prog;
    const n = nx * ny;
    cells = new Uint8Array(n);
    const cuts = [];
    let a = 0;
    const tot = states.reduce((s, x) => s + x.share, 0) || 1;
    states.forEach(s => { a += s.share / tot; cuts.push([a, s.idx]); });
    for (let i = 0; i < n; i++) {
      const u = rnd();
      let put = cuts.length ? cuts[cuts.length - 1][1] : 0;
      for (const [c, idx] of cuts) { if (u <= c) { put = idx; break; } }
      cells[i] = put;
    }
    step = 0; hist = []; snapshots = [];
    record();
    drawAll();
  }

  function record() {
    const { nx, ny, states, hps, forcing } = prog;
    const n = nx * ny;
    const cnt = new Array(states.length).fill(0);
    for (let i = 0; i < n; i++) cnt[cells[i]] = (cnt[cells[i]] || 0) + 1;
    const dens = {};
    states.forEach((s, i) => dens[s.id] = cnt[i] / n);
    hist.push({ dens, fv: forcingAt({ forcing }, step * hps) });
    if (hist.length > 1200) hist.shift();
    if (step % 40 === 0 || step === 1) snapshots.push(Array.from(cells));
    if (snapshots.length > 6) snapshots.shift();
  }

  const offsets = (() => {
    const o = [];
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++)
      if (dx || dy) o.push([dx, dy]);
    return o;
  })();

  function advance() {
    const { nx, ny, bySrc, states, hps, forcing } = prog;
    const n = nx * ny;
    const cur = cells, nxt = new Uint8Array(cur);   // 同步更新：先拷贝
    const fv = forcingAt({ forcing }, step * hps);
    const ns = states.length;
    const cnt = new Array(ns + 1).fill(0);

    for (let y = 0; y < ny; y++) {
      const rowBase = y * nx;
      for (let x = 0; x < nx; x++) {
        const i = rowBase + x;
        const s = cur[i];
        const rs = bySrc[s];
        if (!rs) continue;
        let haveCnt = false;
        for (let k = 0; k < rs.length; k++) {
          const r = rs[k];
          if (r.when) {
            if (!haveCnt) {
              cnt.fill(0);
              for (const [dx, dy] of offsets) {
                let xx = x + dx, yy = y + dy;
                if (xx < 0) xx += nx; else if (xx >= nx) xx -= nx;   // 经度闭合
                if (yy < 0 || yy >= ny) continue;
                cnt[cur[yy * nx + xx]]++;
              }
              haveCnt = true;
            }
            if (!whenOk(r.when, cnt, fv)) continue;
          }
          let p = r.prob;
          if (r.forcing) p *= r.gain ? Math.pow(fv[r.forcing] || 0, r.gain) : (fv[r.forcing] || 1);
          if (p >= 1 || rnd() < p) { nxt[i] = r.dst; break; }
        }
      }
    }
    cells = nxt;
    step++;
    record();
  }

  /* ── 绘制 ── */
  function drawGrid() {
    const { nx, ny, states } = prog;
    gcv.width = nx; gcv.height = ny;
    const img = gctx.createImageData(nx, ny);
    const pal = states.map(s => {
      const h = String(s.color).replace('#', '');
      return [parseInt(h.slice(0, 2), 16) || 128,
              parseInt(h.slice(2, 4), 16) || 128,
              parseInt(h.slice(4, 6), 16) || 128];
    });
    for (let i = 0; i < nx * ny; i++) {
      const c = pal[cells[i]] || [128, 128, 128];
      img.data[i * 4] = c[0]; img.data[i * 4 + 1] = c[1];
      img.data[i * 4 + 2] = c[2]; img.data[i * 4 + 3] = 255;
    }
    gctx.putImageData(img, 0, 0);
  }

  function drawChart() {
    const w = ccv.clientWidth || 300, h = ccv.clientHeight || 200;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    ccv.width = w * dpr; ccv.height = h * dpr;
    const g = cctx;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, w, h);
    if (!hist.length) return;

    // 滚动窗口：只画最近 320 步，否则上千步的强迫虚线会糊成一片
    const view = hist.slice(-320);
    const pad = 26;
    const W2 = w - pad - 8, H2 = h - pad - 12;
    g.strokeStyle = 'rgba(140,170,210,.16)';
    g.lineWidth = 1;
    for (let i = 0; i <= 4; i++) {
      const y = 10 + H2 * i / 4;
      g.beginPath(); g.moveTo(pad, y); g.lineTo(pad + W2, y); g.stroke();
    }

    const cols = ['#7a4a8c', '#2f6f9e', '#c9a227', '#b5651d', '#8b1a1a', '#dcd7c9', '#1a1a1a', '#3b3a40'];
    prog.states.forEach((s, si) => {
      g.beginPath();
      view.forEach((pt, i) => {
        const x = pad + W2 * (view.length <= 1 ? 0 : i / (view.length - 1));
        const y = 10 + H2 * (1 - clamp(pt.dens[s.id] || 0, 0, 1));
        i ? g.lineTo(x, y) : g.moveTo(x, y);
      });
      g.strokeStyle = s.color || cols[si % cols.length];
      g.lineWidth = 1.4;
      g.stroke();
    });

    // 强迫项：只画总辐照类，虚线
    const f0 = (prog.forcing || [])[0];
    if (f0) {
      g.beginPath();
      view.forEach((pt, i) => {
        const x = pad + W2 * (view.length <= 1 ? 0 : i / (view.length - 1));
        // 强迫项压到图底 26% 的窄带里，别盖住密度曲线
        const y = 10 + H2 - H2 * 0.26 * clamp(pt.fv[f0.id] || 0, 0, 1);
        i ? g.lineTo(x, y) : g.moveTo(x, y);
      });
      g.strokeStyle = 'rgba(255,207,138,.5)';
      g.setLineDash([3, 3]);
      g.lineWidth = 1;
      g.stroke();
      g.setLineDash([]);
    }

    g.fillStyle = 'rgba(140,170,210,.65)';
    g.font = '9px sans-serif';
    g.fillText('1.0', 3, 14);
    g.fillText('0.0', 3, 10 + H2);
    g.fillText(`步 ${hist.length}`, pad, h - 4);
  }

  function drawProbe() {
    const { states } = prog;
    const last = hist[hist.length - 1] || { dens: {}, fv: {} };
    const n = prog.nx * prog.ny;
    const primary = states.find(s => s.kind === 'producer') || states[0];

    const sum = k => states.filter(s => s.kind === k)
      .reduce((a, s) => a + (last.dens[s.id] || 0), 0);

    const f0 = (prog.forcing || [])[0];
    const fv = f0 ? (last.fv[f0.id] || 0) : 0;
    const rows = [
      ['已跑步数', `${step}`],
      ['网格', `${prog.nx}×${prog.ny} = ${n}`],
      ['主状态', `${primary.name} ${(last.dens[primary.id] || 0).toFixed(3)}`],
      ['生产者合计', sum('producer').toFixed(3)],
      ['消费者合计', sum('consumer').toFixed(3)],
      ['裸地/基质', sum('substrate').toFixed(3)],
      ['灾变相', sum('hazard').toFixed(3)],
    ];
    if (f0) rows.push([`${f0.name || f0.id}`, fv.toFixed(2)]);

    const stable = num(EVO.summary && EVO.summary.steady_density, 0);
    const targetSteps = num(EVO.summary && EVO.summary.measured_at_step, 0);
    const now = last.dens[primary.id] || 0;
    // 还没跑到对账步数就比稳态，没有意义——必须先收敛再对账
    const converged = !targetSteps || step >= targetSteps * 0.75;
    // 8% 而非 5%：Python 用 Mersenne Twister，这里用 mulberry32，
    // 逐格轨迹必然不同，密度只剩统计涨落。超过 8% 才是规则对齐出了问题。
    const DRIFT_TOL = 0.08;
    const drift = (converged && stable > 0) ? Math.abs(now - stable) / stable : 0;
    const first = hist[0] ? (hist[0].dens[primary.id] || 0) : 0;
    const collapse = first > 0.02 && now < first * 0.2;

    let html = rows.map(([k, v]) =>
      `<div class="probe-row"><span>${k}</span><b>${v}</b></div>`).join('');
    html += `<div class="probe-row ${!converged ? '' : (drift > DRIFT_TOL ? 'bad' : 'good')}">` +
            `<span>与 summary 偏差</span>` +
            `<b>${!converged ? `收敛中 (${step}/${targetSteps})` : (drift * 100).toFixed(1) + '%'}</b></div>`;
    html += `<div class="probe-row ${collapse ? 'bad' : 'good'}">` +
            `<span>塌缩预警</span><b>${collapse ? '已跌破' : '正常'}</b></div>`;

    html += `<div class="probe-flag">`;
    if (!converged) {
      html += `还差 ${Math.max(0, targetSteps - step)} 步到达对账点（world.json 记的是第 ${targetSteps} 步）。` +
              `生态需要时间才能显出稳态，现在比没有意义。<br>`;
    } else if (drift > DRIFT_TOL) {
      html += `浏览器实跑与 world.json 的 summary 差 ${(drift * 100).toFixed(1)}%，超过 8% —— 规则可能没对齐。<br>`;
    }
    if (collapse) html += `主状态已跌到初值两成以下：这个世界的生态正在崩。<br>`;
    if (converged && drift <= DRIFT_TOL && !collapse) {
      html += `生态稳定。与 Python 端实跑相差 ${(drift * 100).toFixed(1)}%，` +
              `属跨语言 PRNG 的统计涨落（逐格轨迹不同是正常的）。<br>`;
    }

    // 状态图例
    html += `<div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:5px">` +
      states.map(s => `<span style="font-size:10px;color:var(--ink-dim)">` +
        `<i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${s.color};margin-right:4px"></i>` +
        `${s.name}</span>`).join('') + `</div>`;

    probe.innerHTML = html;
  }

  function drawAll() {
    if (!prog) return;
    drawGrid();
    drawChart();
    drawProbe();
    $('lf-clock').textContent = `第 ${step} 步`;
  }

  function loop(now) {
    const dt = Math.min((now - last) / 1000, 0.1);
    last = now;
    if (playing) {
      acc += dt * SPEEDS[speedIdx];
      let budget = 8;                    // 每帧最多 8 步，防卡死
      while (acc >= 1 / 45 && budget-- > 0) { advance(); acc -= 1 / 45; }
      drawAll();
    }
    raf = requestAnimationFrame(loop);
  }

  function open() {
    if (!EVO || !EVO.rules || !EVO.rules.length) {
      UI.hideOverlays();
      $('life-view').classList.add('show');
      probe.innerHTML = `<div class="probe-flag">这个世界的 biology.evolution 为空。<br>` +
        `先声明 states / rules / forcing，再用 <code>pangu.py ca</code> 编译。</div>`;
      UI.mark('v-life');
      return;
    }
    SURF.close();
    $('life-view').classList.add('show');
    UI.mark('v-life');
    if (!started) {
      started = true;
      $('lf-play').onclick = () => {
        playing = !playing;
        $('lf-play').textContent = playing ? '运行' : '暂停';
        $('lf-play').classList.toggle('on', playing);
      };
      $('lf-step').onclick = () => { playing = false; $('lf-play').textContent = '暂停'; advance(); drawAll(); };
      $('lf-reset').onclick = () => { reset(); drawAll(); };
      $('lf-spd').onclick = () => {
        speedIdx = (speedIdx + 1) % SPEEDS.length;
        $('lf-spd').textContent = SPEEDS[speedIdx] + '×';
      };
      build();
      reset();
    }
    if (!raf) { last = performance.now(); raf = requestAnimationFrame(loop); }
  }

  function close() {
    $('life-view').classList.remove('show');
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
  }

  window.addEventListener('resize', () => {
    if ($('life-view').classList.contains('show') && prog) drawAll();
  });

  return { open, close };
})();

  // 1.1：地面视角与演化视图不依赖 WebGL，3D 挂了也应该进得去
  const evo = WORLD.biology && WORLD.biology.evolution;
  const canSurf = IS_STARS.length > 0;
  const canLife = !!(evo && evo.rules && evo.rules.length);
  if (canSurf || canLife) {
    const bar = document.createElement('div');
    bar.style.cssText = 'margin:22px 0 10px;display:flex;gap:10px;flex-wrap:wrap';

      b.className = 'fb-go';

      b.textContent = '演化视图';
      b.className = 'fb-go';
      b.onclick = () => { fb.classList.remove('show'); LIFE.open(); };
      bar.appendChild(b);
    }
    $('fb-body').insertBefore(bar, $('fb-body').firstChild);
  }

const THREE_SOURCES = [
  'https://unpkg.com/three@0.160.0/build/three.module.js',
  'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js',
  'https://fastly.jsdelivr.net/npm/three@0.160.0/build/three.module.js',
  'https://esm.sh/three@0.160.0',
  'https://cdn.skypack.dev/three@0.160.0'
];

async function loadThree() {
  for (let i = 0; i < THREE_SOURCES.length; i++) {
    const url = THREE_SOURCES[i];
    $('boot-t').textContent = i === 0 ? '正在开天' : `正在换源 (${i + 1}/${THREE_SOURCES.length})`;
    try {
      const m = await import(/* @vite-ignore */ url);
      if (m && m.WebGLRenderer) return m;
    } catch (e) { /* 静默换源 */ }
  }
  return null;
}

/* ══════════════════════════════════════════════════════════════
   主流程
   ══════════════════════════════════════════════════════════════ */
let THREE = await loadThree();
if (!THREE) {
  showFallback('所有 CDN 均不可达（可能处于离线环境）。');
} else {
  try { boot(THREE); }
  catch (e) { console.error(e); showFallback('渲染初始化异常：' + (e && e.message ? e.message : e)); }
}

function boot(THREE) {

  /* ── 渲染器 ─────────────────────────────────────────────── */
  const canvas = $('scene');
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
  } catch (e) {
    showFallback('此浏览器不支持 WebGL。');
    return;
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  if ('outputColorSpace' in renderer) renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.NoToneMapping;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.5, 6000);

  /* ── 星空 ───────────────────────────────────────────────── */
  (function buildStars() {
    const N = 5000, pos = new Float32Array(N * 3), col = new Float32Array(N * 3);
    const c = new THREE.Color();
    for (let i = 0; i < N; i++) {
      const u = Math.random() * 2 - 1;
      const th = Math.random() * Math.PI * 2;
      const r = Math.sqrt(1 - u * u);
      const R = 900 + Math.random() * 260;
      pos[i * 3]     = Math.cos(th) * r * R;
      pos[i * 3 + 1] = u * R;
      pos[i * 3 + 2] = Math.sin(th) * r * R;
      const w = 0.55 + Math.random() * 0.45;
      c.setRGB(w, w * (0.94 + Math.random() * 0.06), w * (0.88 + Math.random() * 0.12));
      col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setAttribute('color', new THREE.BufferAttribute(col, 3));
    const m = new THREE.PointsMaterial({
      size: 1.7, sizeAttenuation: false, vertexColors: true,
      transparent: true, opacity: 0.9, depthWrite: false
    });
    scene.add(new THREE.Points(g, m));
  })();

  /* ── 辉光贴图（程序生成，零外部资源） ───────────────────── */
  const GLOW_TEX = (() => {
    const S = 256, cv = document.createElement('canvas');
    cv.width = cv.height = S;
    const ctx = cv.getContext('2d');
    const g = ctx.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
    g.addColorStop(0.00, 'rgba(255,255,255,1)');
    g.addColorStop(0.14, 'rgba(255,255,255,0.72)');
    g.addColorStop(0.32, 'rgba(255,255,255,0.22)');
    g.addColorStop(0.62, 'rgba(255,255,255,0.05)');
    g.addColorStop(1.00, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, S, S);
    const t = new THREE.CanvasTexture(cv);
    if ('colorSpace' in t) t.colorSpace = THREE.SRGBColorSpace;
    return t;
  })();

  /* ── GLSL 公共噪声 ──────────────────────────────────────── */
  const NOISE = `
vec3 mod289(vec3 x){ return x - floor(x*(1.0/289.0))*289.0; }
vec4 mod289(vec4 x){ return x - floor(x*(1.0/289.0))*289.0; }
vec4 permute(vec4 x){ return mod289(((x*34.0)+1.0)*x); }
vec4 taylorInvSqrt(vec4 r){ return 1.79284291400159 - 0.85373472095314*r; }
float snoise(vec3 v){
  const vec2 C = vec2(1.0/6.0, 1.0/3.0);
  const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
  vec3 i  = floor(v + dot(v, C.yyy));
  vec3 x0 = v - i + dot(i, C.xxx);
  vec3 g = step(x0.yzx, x0.xyz);
  vec3 l = 1.0 - g;
  vec3 i1 = min(g.xyz, l.zxy);
  vec3 i2 = max(g.xyz, l.zxy);
  vec3 x1 = x0 - i1 + C.xxx;
  vec3 x2 = x0 - i2 + C.yyy;
  vec3 x3 = x0 - D.yyy;
  i = mod289(i);
  vec4 p = permute(permute(permute(
       i.z + vec4(0.0, i1.z, i2.z, 1.0))
     + i.y + vec4(0.0, i1.y, i2.y, 1.0))
     + i.x + vec4(0.0, i1.x, i2.x, 1.0));
  float n_ = 0.142857142857;
  vec3 ns = n_ * D.wyz - D.xzx;
  vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
  vec4 x_ = floor(j * ns.z);
  vec4 y_ = floor(j - 7.0 * x_);
  vec4 x = x_ * ns.x + ns.yyyy;
  vec4 y = y_ * ns.x + ns.yyyy;
  vec4 h = 1.0 - abs(x) - abs(y);
  vec4 b0 = vec4(x.xy, y.xy);
  vec4 b1 = vec4(x.zw, y.zw);
  vec4 s0 = floor(b0)*2.0 + 1.0;
  vec4 s1 = floor(b1)*2.0 + 1.0;
  vec4 sh = -step(h, vec4(0.0));
  vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
  vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
  vec3 p0 = vec3(a0.xy, h.x);
  vec3 p1 = vec3(a0.zw, h.y);
  vec3 p2 = vec3(a1.xy, h.z);
  vec3 p3 = vec3(a1.zw, h.w);
  vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
  p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
  vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
  m = m * m;
  return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
}
float fbm(vec3 p, int oct){
  float a = 0.5, f = 1.0, s = 0.0;
  for (int i = 0; i < 6; i++){
    if (i >= oct) break;
    s += a * snoise(p * f);
    f *= 2.02; a *= 0.5;
  }
  return s;
}
float ridged(vec3 p){
  float n = snoise(p);
  return (1.0 - abs(n)) * (1.0 - abs(n)) - 0.5;
}
`;

  /* ── 行星材质 ───────────────────────────────────────────── */
  const SUN_MAX = 4;
  const allSunPos = [], allSunColor = [], allSunPower = [];

  function makePlanetMaterial(body, idx) {
    const biomes = (body.biomes || []).filter(b => b && b.color).slice(0, 8);
    const colors = [], stops = [];
    if (biomes.length) {
      for (const b of biomes) {
        colors.push(new THREE.Color(b.color));
        stops.push(clamp(num(b.elevation, 0), 0, 1));
      }
      stops[0] = 0;
    } else {
      colors.push(new THREE.Color('#6d7c72'));
      stops.push(0);
    }
    while (colors.length < 8) { colors.push(colors[colors.length - 1].clone()); stops.push(1.0); }
    while (stops.length < 8) { stops.push(1.0); }

    const atm = body.atmosphere || {};
    const polar = body.polar_color ? new THREE.Color(body.polar_color) : new THREE.Color('#dfe9f5');
    const seaLevel = clamp(num(body.sea_level, 0.42), 0, 1);

    return new THREE.ShaderMaterial({
      uniforms: {
        uSunPos:    { value: allSunPos.length ? allSunPos : [new THREE.Vector3(1, 0, 0)] },
        uSunColor:  { value: allSunColor.length ? allSunColor : [new THREE.Color('#ffffff')] },
        uSunPower:  { value: allSunPower.length ? allSunPower : [1.0] },
        uSunCount: { value: SUN_COUNT },
        uBiomeColors: { value: colors },
        uBiomeStops:  { value: stops },
        uBiomeCount:  { value: Math.max(1, Math.min(8, biomes.length || 1)) },
        uSeaLevel:  { value: seaLevel },
        uPolarColor:{ value: polar },
        uPolarAmt:  { value: clamp(num(body.polar_amount, 0.55), 0, 1) },
        uAmbient:   { value: new THREE.Color('#0b1220') },
        uSeed:      { value: idx * 37.13 + 11.7 },
        uTime:      { value: 0 }
      },
      vertexShader: `
        varying vec3 vObj;
        varying vec3 vN;
        varying vec3 vW;
        void main(){
          vObj = position;
          vN = normalize(mat3(modelMatrix) * normal);
          vec4 wp = modelMatrix * vec4(position, 1.0);
          vW = wp.xyz;
          gl_Position = projectionMatrix * viewMatrix * wp;
        }
      `,
      fragmentShader: NOISE + `
        uniform vec3  uSunPos[${SUN_MAX}];
        uniform vec3  uSunColor[${SUN_MAX}];
        uniform float uSunPower[${SUN_MAX}];
        uniform int   uSunCount;
        uniform vec3  uBiomeColors[8];
        uniform float uBiomeStops[8];
        uniform int   uBiomeCount;
        uniform float uSeaLevel;
        uniform vec3  uPolarColor;
        uniform float uPolarAmt;
        uniform vec3  uAmbient;
        uniform float uSeed;
        uniform float uTime;
        varying vec3 vObj;
        varying vec3 vN;
        varying vec3 vW;

        void main(){
          vec3 p = normalize(vObj);
          /* 双层地形：低频定大陆轮廓，高频只做细节，避免「迷彩」感 */
          float cont   = fbm(p * 1.65 + uSeed, 4) * 0.5 + 0.5;
          float detail = fbm(p * 5.20 + uSeed * 2.3, 3) * 0.5 + 0.5;
          float ridge  = ridged(p * 8.0 + uSeed * 1.7);
          float h = cont * 0.74 + detail * 0.26 + ridge * 0.09;
          h = clamp(h * 1.38 - 0.20, 0.0, 1.0);

          vec3 col = uBiomeColors[0];
          for (int i = 1; i < 8; i++){
            if (i >= uBiomeCount) break;
            col = mix(col, uBiomeColors[i], smoothstep(uBiomeStops[i] - 0.07, uBiomeStops[i] + 0.07, h));
          }

          /* 极冠：纬度 + 高度扰动，避免生硬的圆环 */
          float lat = abs(p.y);
          float cap = smoothstep(0.74, 0.965, lat + (h - 0.5) * 0.22) * uPolarAmt;
          col = mix(col, uPolarColor, cap);

          /* 海洋：低洼处压暗并加蓝 */
          float sea = smoothstep(uSeaLevel + 0.02, uSeaLevel - 0.06, h);
          col = mix(col, col * vec3(0.55, 0.72, 1.05), sea * 0.85);

          vec3 N = normalize(vN);
          vec3 lit = vec3(0.0);
          for (int i = 0; i < ${SUN_MAX}; i++){
            if (i >= uSunCount) break;
            vec3 L = normalize(uSunPos[i] - vW);
            float d = max(dot(N, L), 0.0);
            lit += uSunColor[i] * uSunPower[i] * (d * 0.9 + d * d * 0.14);
          }

          vec3 outc = col * (lit + uAmbient);

          /* 海面镜面高光（双光源各出一道，这正是「双日双影」的视觉根源） */
          vec3 V = normalize(cameraPosition - vW);
          for (int i = 0; i < ${SUN_MAX}; i++){
            if (i >= uSunCount) break;
            vec3 L = normalize(uSunPos[i] - vW);
            vec3 H = normalize(L + V);
            float spec = pow(max(dot(N, H), 0.0), 42.0) * sea * 0.55;
            outc += uSunColor[i] * spec * uSunPower[i];
          }

          gl_FragColor = vec4(outc, 1.0);
        }
      `
    });
  }

  /* ── 云层 ───────────────────────────────────────────────── */
  function makeCloudMaterial(idx) {
    return new THREE.ShaderMaterial({
      uniforms: {
        uSunPos:   { value: allSunPos.length ? allSunPos : [new THREE.Vector3(1, 0, 0)] },
        uSunColor: { value: allSunColor.length ? allSunColor : [new THREE.Color('#ffffff')] },
        uSunPower: { value: allSunPower.length ? allSunPower : [1.0] },
        uSunCount: { value: SUN_COUNT },
        uSeed:     { value: idx * 61.7 + 3.3 },
        uTime:     { value: 0 },
        uOpacity:  { value: 0.62 }
      },
      vertexShader: `
        varying vec3 vObj; varying vec3 vN; varying vec3 vW;
        void main(){
          vObj = position;
          vN = normalize(mat3(modelMatrix) * normal);
          vec4 wp = modelMatrix * vec4(position, 1.0);
          vW = wp.xyz;
          gl_Position = projectionMatrix * viewMatrix * wp;
        }
      `,
      fragmentShader: NOISE + `
        uniform vec3  uSunPos[${SUN_MAX}];
        uniform vec3  uSunColor[${SUN_MAX}];
        uniform float uSunPower[${SUN_MAX}];
        uniform int   uSunCount;
        uniform float uSeed;
        uniform float uTime;
        uniform float uOpacity;
        varying vec3 vObj; varying vec3 vN; varying vec3 vW;
        void main(){
          vec3 p = normalize(vObj);
          float n = fbm(p * 3.1 + uSeed + vec3(uTime * 0.008), 4) * 0.5 + 0.5;
          float a = smoothstep(0.52, 0.78, n);
          a *= uOpacity;
          if (a < 0.012) discard;

          vec3 N = normalize(vN);
          float lit = 0.0;
          for (int i = 0; i < ${SUN_MAX}; i++){
            if (i >= uSunCount) break;
            vec3 L = normalize(uSunPos[i] - vW);
            lit += max(dot(N, L), 0.0) * uSunPower[i];
          }
          lit = clamp(lit, 0.0, 1.6);
          vec3 shade = mix(vec3(0.16, 0.20, 0.30), vec3(1.0, 0.99, 0.96), clamp(lit, 0.0, 1.0));
          gl_FragColor = vec4(shade, a);
        }
      `,
      transparent: true,
      depthWrite: false,
      side: THREE.FrontSide
    });
  }

  /* ── 大气辉光 ───────────────────────────────────────────── */
  function makeAtmoMaterial(color, strength) {
    return new THREE.ShaderMaterial({
      uniforms: {
        uColor:    { value: new THREE.Color(color) },
        uStrength: { value: strength },
        uSunPos:   { value: allSunPos.length ? allSunPos : [new THREE.Vector3(1, 0, 0)] },
        uSunPower: { value: allSunPower.length ? allSunPower : [1.0] },
        uSunCount: { value: SUN_COUNT }
      },
      vertexShader: `
        varying vec3 vN; varying vec3 vW;
        void main(){
          vN = normalize(mat3(modelMatrix) * normal);
          vec4 wp = modelMatrix * vec4(position, 1.0);
          vW = wp.xyz;
          gl_Position = projectionMatrix * viewMatrix * wp;
        }
      `,
      fragmentShader: `
        uniform vec3  uColor;
        uniform float uStrength;
        uniform vec3  uSunPos[${SUN_MAX}];
        uniform float uSunPower[${SUN_MAX}];
        uniform int   uSunCount;
        varying vec3 vN; varying vec3 vW;
        void main(){
          vec3 N = normalize(vN);
          vec3 V = normalize(cameraPosition - vW);
          float rim = pow(1.0 - abs(dot(N, V)), 2.8);
          float lit = 0.0;
          for (int i = 0; i < ${SUN_MAX}; i++){
            if (i >= uSunCount) break;
            vec3 L = normalize(uSunPos[i] - vW);
            lit += max(dot(N, L), 0.0) * uSunPower[i];
          }
          lit = clamp(lit, 0.0, 1.0);
          gl_FragColor = vec4(uColor, rim * uStrength * (0.16 + 0.84 * lit));
        }
      `,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      side: THREE.BackSide
    });
  }

  /* ── 场景装配 ───────────────────────────────────────────── */
  const orbitRoot = new THREE.Group();
  scene.add(orbitRoot);

  const pickables = [];          // 可点击对象
  const nodes = {};              // id -> {group, body, kind}
  const orbitLines = [];
  const ambient = new THREE.AmbientLight(0x223044, 1.0);
  scene.add(ambient);

  /* 恒星 */
  const sunPositionsWorld = [];
  const SUN_COUNT = Math.max(1, IS_STARS.length);
  const L_TOT = IS_STARS.reduce((a, s) => a + num(s.luminosity_solar, 1), 0) || 1;
  IS_STARS.forEach((s, i) => {
    const R = visStarRadius(s);
    const g = new THREE.Group();
    const col = new THREE.Color(starColor(s));

    const core = new THREE.Mesh(
      new THREE.SphereGeometry(R, 40, 28),
      new THREE.MeshBasicMaterial({ color: col })
    );
    core.userData.pick = { kind: 'star', id: s.id || ('star' + i), name: s.name || ('恒星' + i), body: s };
    g.add(core);
    pickables.push(core);

    // 两层辉光
    const glow1 = new THREE.Sprite(new THREE.SpriteMaterial({
      map: GLOW_TEX, color: col, transparent: true,
      blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.92
    }));
    glow1.scale.setScalar(R * 7.0);
    g.add(glow1);

    const glow2 = new THREE.Sprite(new THREE.SpriteMaterial({
      map: GLOW_TEX, color: col, transparent: true,
      blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.26
    }));
    glow2.scale.setScalar(R * 17.0);
    g.add(glow2);

    // 光源（供卫星/环等标准材质使用）
    const lum = num(s.luminosity_solar, 1);
    const power = clamp(0.85 * Math.pow(lum / L_TOT, 0.4), 0.04, 1.2);
    const L = new THREE.PointLight(col, power * 2.2, 0, 0);
    g.add(L);

    nodes[s.id || ('star' + i)] = { group: g, kind: 'star', body: s, radius: R };
    orbitRoot.add(g);

    allSunColor.push(col);
    allSunPower.push(power);
    allSunPos.push(new THREE.Vector3());   // 每帧更新
    sunPositionsWorld.push(g);
  });

  /* 无恒星时的微弱环境；并补齐 uniform 数组到编译期长度 */
  if (!IS_STARS.length) {
    allSunColor.push(new THREE.Color('#33445c'));
    allSunPower.push(0.12);
    allSunPos.push(new THREE.Vector3(0, 0, 1));
  }
  while (allSunColor.length < SUN_MAX) {
    allSunColor.push(new THREE.Color('#000000'));
    allSunPower.push(0);
    allSunPos.push(new THREE.Vector3(0, 0, 1));
  }

  /* 物体 */
  const bodyNodes = [];
  IS_BODIES.forEach((b, i) => {
    const R = visRadius(b);
    const g = new THREE.Group();

    const mat = makePlanetMaterial(b, i);
    const surface = new THREE.Mesh(new THREE.SphereGeometry(R, 72, 48), mat);
    surface.userData.pick = { kind: 'body', id: b.id || ('body' + i), name: b.name || '天体', body: b };
    g.add(surface);
    pickables.push(surface);

    // 云
    let cloud = null;
    if (b.atmosphere) {
      cloud = new THREE.Mesh(new THREE.SphereGeometry(R * 1.016, 48, 32), makeCloudMaterial(i));
      g.add(cloud);
    }

    // 大气
    let atmo = null;
    if (b.atmosphere) {
      const aCol = b.atmosphere.color || '#88bbdd';
      const press = num(b.atmosphere.surface_pressure_kpa, 100);
      const strength = clamp(0.35 + Math.log10(press + 1) * 0.55, 0.25, 1.35);
      atmo = new THREE.Mesh(new THREE.SphereGeometry(R * 1.055, 48, 32), makeAtmoMaterial(aCol, strength));
      g.add(atmo);
    }

    // 行星环
    if (b.rings) {
      const rr = b.rings;
      const inner = R * num(rr.inner_r, 1.4);
      const outer = R * num(rr.outer_r, 2.2);
      const ringGeo = new THREE.RingGeometry(inner, outer, 128, 1);
      // 修 UV，让径向贴图可读
      const pos = ringGeo.attributes.position;
      const uv = ringGeo.attributes.uv;
      const v3 = new THREE.Vector3();
      for (let k = 0; k < pos.count; k++) {
        v3.fromBufferAttribute(pos, k);
        const t = (v3.length() - inner) / Math.max(1e-6, outer - inner);
        uv.setXY(k, t, 0.5);
      }
      const ringMat = new THREE.MeshBasicMaterial({
        color: new THREE.Color(rr.color || '#c9b79a'),
        transparent: true, opacity: clamp(num(rr.opacity, 0.55), 0, 1),
        side: THREE.DoubleSide, depthWrite: false
      });
      const ring = new THREE.Mesh(ringGeo, ringMat);
      ring.rotation.x = Math.PI / 2;
      ring.rotation.z = 0.18;
      g.add(ring);
    }

    scene.add(g);
    nodes[b.id || ('body' + i)] = { group: g, kind: 'body', body: b, radius: R, surface, cloud, mat };
    bodyNodes.push({ node: nodes[b.id || ('body' + i)], data: b, index: i });
  });

  /* 轨道：先算位置关系，再画线 */
  function orbitRadius(entry) {
    const a = num(entry.orbit && entry.orbit.a_au, 0);
    return a > 0 ? a * ORBIT_SCALE : 0;
  }

  // 恒星轨道（绕质心）
  const starOrbiters = IS_STARS.map((s, i) => ({ s, i, a: orbitRadius(s), period: num(s.orbit && s.orbit.period_days, 0) }));
  const starParent = new Set(starOrbiters.map(o => String(o.s.orbit && o.s.orbit.parent || 'bary')));

  // 天体轨道：若 parent 是某天体，挂到该天体组下；否则绕质心
  bodyNodes.forEach(({ node, data }) => {
    const parentId = String((data.orbit && data.orbit.parent) || '');
    const host = nodes[parentId];
    if (host && host.kind === 'body') {
      // 卫星：挂到母星组
      let d = orbitRadius(data);
      d = Math.max(d, host.radius * 2.15);   // 防穿模
      node.orbitHost = host.group;
      node.orbitDist = d;
      node.orbitPeriod = num(data.orbit && data.orbit.period_days, 0);
      host.group.add(node.group);
      node.group.position.set(d, 0, 0);
    } else {
      orbitRoot.add(node.group);
      node.orbitHost = orbitRoot;
      node.orbitDist = orbitRadius(data);
      node.orbitPeriod = num(data.orbit && data.orbit.period_days, 0);
      node.group.position.set(node.orbitDist, 0, 0);
    }
  });

  /* 轨道线 */
  function addOrbitLine(dist, color, opacity, tilt) {
    if (!(dist > 0)) return;
    // 远处轨道（如 12 AU 的层级伴星）在系统视图里会横穿画面，按距离衰减
    const fade = clamp(120 / dist, 0.1, 1);
    const pts = [];
    for (let i = 0; i <= 220; i++) {
      const a = (i / 220) * Math.PI * 2;
      pts.push(new THREE.Vector3(Math.cos(a) * dist, 0, Math.sin(a) * dist));
    }
    const geo = new THREE.BufferGeometry().setFromPoints(pts);
    const mat = new THREE.LineBasicMaterial({
      color: new THREE.Color(color), transparent: true,
      opacity: opacity * fade, depthWrite: false
    });
    const line = new THREE.Line(geo, mat);
    if (tilt) line.rotation.x = tilt;
    orbitRoot.add(line);
    orbitLines.push(line);
  }

  starOrbiters.forEach(o => {
    if (o.a > 0) addOrbitLine(o.a, starColor(o.s), 0.26, 0);
  });
  bodyNodes.forEach(({ node, data }) => {
    if (node.orbitHost === orbitRoot && node.orbitDist > 0) {
      const tilt = num(data.orbit && data.orbit.inclination_deg, 0) * Math.PI / 180;
      addOrbitLine(node.orbitDist, data.biomes && data.biomes[0] ? data.biomes[0].color : '#7fb6d9', 0.30, tilt);
    }
  });

  /* ── 时间 ───────────────────────────────────────────────────
     真实周期比跨度过大（卫星 29 天 / 行星 356 天），直接线性映射会让
     行星几乎静止。改用平方根压缩：既保住快慢次序，又让所有运动可读。 */
  const periods = bodyNodes.map(b => b.node.orbitPeriod).filter(p => p > 0);
  const starP = starOrbiters.map(o => o.period).filter(p => p > 0);
  const REF_P = Math.min(...periods.concat(starP).concat([365])) || 365;
  const OMEGA_UNIT = (Math.PI * 2) / 12;   // 基准周期 = 12 秒一圈
  const omegaFor = P => (P > 0 ? OMEGA_UNIT * Math.sqrt(REF_P / P) : 0);

  let t = 0, playing = true, speed = 1;
  const SPEEDS = [0.25, 1, 4, 16];
  let speedIdx = 1;

  /* ── 相机控制器（自研，零 addons 依赖） ─────────────────── */
  class OrbitLite {
    constructor(cam, dom) {
      this.cam = cam; this.dom = dom;
      this.target = new THREE.Vector3();
      this.tTarget = new THREE.Vector3();
      this.theta = 0.95; this.phi = 1.15; this.radius = 90;
      this.tTheta = 0.95; this.tPhi = 1.15; this.tRadius = 90;
      this.minR = 6; this.maxR = 900;
      this.dragging = false; this.moved = 0;
      this.px = 0; this.py = 0;
      this._bind();
    }
    _bind() {
      const d = this.dom;
      d.addEventListener('pointerdown', e => {
        this.dragging = true; this.moved = 0;
        this.px = e.clientX; this.py = e.clientY;
        d.classList.add('dragging');
        d.setPointerCapture && d.setPointerCapture(e.pointerId);
      });
      d.addEventListener('pointermove', e => {
        if (!this.dragging) return;
        const dx = e.clientX - this.px, dy = e.clientY - this.py;
        this.px = e.clientX; this.py = e.clientY;
        this.moved += Math.abs(dx) + Math.abs(dy);
        this.tTheta -= dx * 0.0055;
        this.tPhi = clamp(this.tPhi - dy * 0.0050, 0.06 * Math.PI, 0.94 * Math.PI);
        this.theta = this.tTheta; this.phi = this.tPhi;   // 拖拽时立即跟手
      });
      const up = e => {
        this.dragging = false;
        d.classList.remove('dragging');
        if (e && e.pointerId != null && d.releasePointerCapture) {
          try { d.releasePointerCapture(e.pointerId); } catch (_) {}
        }
      };
      d.addEventListener('pointerup', up);
      d.addEventListener('pointercancel', up);
      d.addEventListener('wheel', e => {
        e.preventDefault();
        this.tRadius = clamp(this.tRadius * (1 + Math.sign(e.deltaY) * 0.11), this.minR, this.maxR);
      }, { passive: false });

      // 双指缩放
      let pinch = 0;
      d.addEventListener('touchmove', e => {
        if (e.touches.length === 2) {
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          const dist = Math.hypot(dx, dy);
          if (pinch) this.tRadius = clamp(this.tRadius * (pinch / dist), this.minR, this.maxR);
          pinch = dist;
        }
      }, { passive: true });
      d.addEventListener('touchend', () => { pinch = 0; });
    }
    setTarget(v, r) {
      this.tTarget.copy(v);
      if (r) this.tRadius = clamp(r, this.minR, this.maxR);
    }
    reset() {
      this.theta = this.tTheta; this.phi = this.tPhi;
      this.radius = this.tRadius;
    }
    update() {
      const k = 0.14;
      this.theta += (this.tTheta - this.theta) * k;
      this.phi += (this.tPhi - this.phi) * k;
      this.radius += (this.tRadius - this.radius) * k;
      this.target.lerp(this.tTarget, k);
      const sp = Math.sin(this.phi);
      this.cam.position.set(
        this.target.x + this.radius * sp * Math.sin(this.theta),
        this.target.y + this.radius * Math.cos(this.phi),
        this.target.z + this.radius * sp * Math.cos(this.theta)
      );
      this.cam.lookAt(this.target);
    }
  }

  const ctrl = new OrbitLite(camera, canvas);

  /* ── 视角 ───────────────────────────────────────────────── */
  const main = bodyNodes[0] || null;
  const mainDist = main ? (main.node.orbitDist || 40) : 40;
  const farDist = Math.max(
    120,
    ...bodyNodes.map(b => b.node.orbitDist || 0),
    ...starOrbiters.map(o => o.a * 2.6)
  );

  function viewSys() {
    UI.hideOverlays();
    ctrl.setTarget(new THREE.Vector3(0, 0, 0), mainDist * 2.55);
    ctrl.tPhi = 1.15; ctrl.tTheta = 0.95;
    markView('v-sys');
  }
  function viewBody() {
    if (!main) return viewSys();
    UI.hideOverlays();
    const p = new THREE.Vector3();
    main.node.group.getWorldPosition(p);
    ctrl.setTarget(p, main.node.radius * 3.6);
    // 相机移到行星的向阳面：视线偏移方向 = 从行星指向恒星（原点）
    const dir = p.clone().multiplyScalar(-1);
    if (dir.lengthSq() > 1e-6) {
      ctrl.tTheta = Math.atan2(dir.x, dir.z);
      ctrl.tPhi = 1.22;
    }
    markView('v-body');
  }
  function viewFar() {
    UI.hideOverlays();
    ctrl.setTarget(new THREE.Vector3(0, 0, 0), farDist * 1.55);
    ctrl.tPhi = 0.72; ctrl.tTheta = 0.5;
    markView('v-far');
  }
  function markView(id) {
    UI.mark(id);
  }

  /* ── 图例 ───────────────────────────────────────────────── */
  const KIND_CN = {
    planet: '行星', moon: '卫星', ring: '环', station: '空间站',
    shell: '壳世界', anomaly: '异常体', star: '恒星'
  };
  (function buildLegend() {
    const box = $('legend');
    const items = [];
    IS_STARS.forEach((s, i) => items.push({
      id: s.id || ('star' + i), name: s.name || ('恒星' + i), kind: '恒星',
      color: starColor(s), type: 'star'
    }));
    bodyNodes.forEach(({ node, data }) => items.push({
      id: data.id || '?', name: data.name || '天体',
      kind: KIND_CN[data.kind] || data.kind || '天体',
      color: (data.biomes && data.biomes[0] && data.biomes[0].color) || '#8899aa',
      type: 'body'
    }));

    items.forEach(it => {
      const el = document.createElement('div');
      el.className = 'lg';
      el.innerHTML = `<span>${it.name}</span><span class="ty">${it.kind}</span>` +
                     `<span class="dot" style="background:${it.color};color:${it.color}"></span>`;
      el.onclick = () => {
        const n = nodes[it.id];
        if (!n) return;
        const p = new THREE.Vector3();
        n.group.getWorldPosition(p);
        ctrl.setTarget(p, n.radius * 3.6);
        document.querySelectorAll('.lg').forEach(x => x.classList.remove('on'));
        el.classList.add('on');
        UI.hideOverlays();
        ['v-sys', 'v-body', 'v-far'].forEach(x => $(x).classList.remove('on'));
      };
      box.appendChild(el);
    });
  })();

  /* ── 点击拾取 ───────────────────────────────────────────── */
  const ray = new THREE.Raycaster();
  const ndc = new THREE.Vector2();
  canvas.addEventListener('click', e => {
    if (ctrl.moved > 6) return;    // 拖拽结束的误触
    const r = canvas.getBoundingClientRect();
    ndc.x = ((e.clientX - r.left) / r.width) * 2 - 1;
    ndc.y = -((e.clientY - r.top) / r.height) * 2 + 1;
    ray.setFromCamera(ndc, camera);
    const hit = ray.intersectObjects(pickables, false)[0];
    if (hit && hit.object.userData.pick) {
      const n = nodes[hit.object.userData.pick.id];
      if (n) {
        const p = new THREE.Vector3();
        n.group.getWorldPosition(p);
        ctrl.setTarget(p, n.radius * 3.6);
      }
    }
  });

  /* ── 控制条 ─────────────────────────────────────────────── */
  $('btn-play').onclick = () => {
    playing = !playing;
    $('btn-play').textContent = playing ? '运行' : '暂停';
    $('btn-play').classList.toggle('on', playing);
  };
  $('btn-spd').onclick = () => {
    speedIdx = (speedIdx + 1) % SPEEDS.length;
    speed = SPEEDS[speedIdx];
    $('btn-spd').textContent = speed + '×';
  };
  $('v-sys').onclick = viewSys;
  $('v-body').onclick = viewBody;
  $('v-far').onclick = viewFar;
  $('btn-reset').onclick = () => {
    const n = bodyNodes.length ? bodyNodes[0].data : (IS_STARS[0] || {});
    viewSys();
  };

  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); $('btn-play').click(); }
    if (e.key === '1') viewSys();
    if (e.key === '2') viewBody();
    if (e.key === '3') viewFar();
    if (e.key === '4') SURF.open();
    if (e.key === '5') LIFE.open();
    if (e.key === 'r' || e.key === 'R') $('btn-reset').click();
  });

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  /* ── 初始视角 ───────────────────────────────────────────── */
  ctrl.tRadius = ctrl.radius = mainDist * 2.55;
  viewSys();
  ctrl.radius = ctrl.tRadius;   // 首帧不做缩放动画

  /* ── 动画 ───────────────────────────────────────────────── */
  const clock = new THREE.Clock();
  let fpsAcc = 0, fpsN = 0, downgraded = false;

  function tick() {
    const dt = Math.min(clock.getDelta(), 0.05);
    const step = playing ? dt * speed : 0;
    t += step;

    // 恒星绕质心
    starOrbiters.forEach((o, idx) => {
      const node = nodes[o.s.id || ('star' + idx)];
      if (!node) return;
      if (o.a > 0 && o.period > 0) {
        const w = omegaFor(o.period);
        const ang = t * w + idx * Math.PI;
        node.group.position.set(Math.cos(ang) * o.a, 0, Math.sin(ang) * o.a);
      }
    });

    // 天体公转 + 自转
    bodyNodes.forEach(({ node, data }, idx) => {
      let orbitW = 0;
      if (node.orbitDist > 0 && node.orbitPeriod > 0) {
        orbitW = omegaFor(node.orbitPeriod);
        const ang = t * orbitW + idx * 1.7;
        node.group.position.set(Math.cos(ang) * node.orbitDist, 0, Math.sin(ang) * node.orbitDist);
      }
      // 潮汐锁定：自转角速度 = 公转角速度
      const rotH = data.rotation_hours;
      let spin;
      if (rotH === null || rotH === undefined) {
        spin = orbitW || omegaFor(node.orbitPeriod || REF_P);
      } else {
        spin = (Math.PI * 2) / Math.max(4, (num(rotH, 24) / 24) * 8);
      }
      if (node.surface) node.surface.rotation.y += spin * step;
      if (node.cloud) node.cloud.rotation.y += spin * step * 1.12;

      if (node.mat) node.mat.uniforms.uTime.value = t;
    });

    // 更新太阳世界坐标（着色器用）
    const tmp = new THREE.Vector3();
    for (let i = 0; i < Math.min(allSunPos.length, IS_STARS.length); i++) {
      const s = IS_STARS[i];
      const node = nodes[s.id || ('star' + i)];
      if (node) {
        node.group.getWorldPosition(tmp);
        allSunPos[i].copy(tmp);
      }
    }

    ctrl.update();
    renderer.render(scene, camera);

    // 自适应降级
    fpsAcc += dt; fpsN++;
    if (!downgraded && fpsN > 120) {
      const fps = fpsN / fpsAcc;
      if (fps < 30 && renderer.getPixelRatio() > 1) {
        renderer.setPixelRatio(1);
        downgraded = true;
      }
      fpsAcc = 0; fpsN = 0;
    }

    requestAnimationFrame(tick);
  }

  /* ── 启动 ───────────────────────────────────────────────── */
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      $('boot').classList.add('done');
      document.getElementById('hud').classList.add('fade-in');
    });
  });
  tick();
}
</script>
</body>
</html>
