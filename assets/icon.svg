<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="pangu 盘古">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101826"/>
      <stop offset="1" stop-color="#05070D"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD79B"/>
      <stop offset="1" stop-color="#C8763A"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4C7FA6"/>
      <stop offset="1" stop-color="#16283A"/>
    </linearGradient>
    <clipPath id="disc"><circle cx="64" cy="64" r="43"/></clipPath>
  </defs>

  <rect width="128" height="128" rx="26" fill="url(#bg)"/>

  <g clip-path="url(#disc)">
    <rect x="21" y="21" width="86" height="43" fill="url(#sky)"/>
    <rect x="21" y="69" width="86" height="43" fill="url(#ground)"/>
  </g>

  <!-- 天地初开的那道裂缝 -->
  <path d="M23 64 L43 57 L57 67 L72 55 L87 64 L105 59"
        fill="none" stroke="#05070D" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="64" cy="64" r="43" fill="none" stroke="#E8B15C" stroke-opacity="0.42" stroke-width="1.4"/>
  <circle cx="93" cy="39" r="4.2" fill="#FFE6BE"/>
  <circle cx="84" cy="30" r="2.2" fill="#FFE6BE" opacity="0.72"/>
</svg>
